# Kiri Linux: the small WSL2 distro Kiri's engine runs in on Windows
# (Alpine and the static kiri binaries; made by `cargo xtask windows`).
# Setup and kiri-win start the engine explicitly after the distro is ready.
[boot]
systemd = false

[user]
default = root

[network]
# WSL's auto resolv.conf points at the NAT gateway, which often fails DNS
# (pulls die with "failed to lookup address information"). kiri-start writes
# public nameservers instead.
generateResolvConf = false

[interop]
# Nothing in here needs to start Windows programs: with interop off, a
# process that somehow became root in this distro still cannot run one.
enabled = false
appendWindowsPath = false
