[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
# Personal / fork release version for distributable Windows builds.
# Suffix `-zy` is for branding; Windows MSI ProductVersion is only the part
# before `-` (0.3.0). Each release must bump that numeric triple (0.3.1-zy, …)
# or msiexec / update checks will treat it as the same installer.
version = "0.3.1-zy"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Debug info goes, function names stay: crash reports' backtraces
# (`crate::diag`) then name the functions instead of bare addresses.
strip = "debuginfo"

# Feature builds (`cargo xtask app-dev`): optimized like a release, but split
# across every core and incremental, so a build takes seconds instead of a
# minute and a half. The binary is bigger and a little slower; what ships, and
# what speed checks measure, keeps [profile.release].
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[profile.dev]
panic = "abort"
