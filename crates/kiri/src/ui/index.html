.imp-items .irow .mono { font-size: var(--fs-small); }
/* Long names lose their middle, so the tag or the unique end stays visible. */
.irow .nm { display: flex; min-width: 0; white-space: nowrap; }
.irow .nm > span { overflow: hidden; text-overflow: ellipsis; }
.irow .nm .b { flex: none; max-width: 70%; }
.imp-items .irow:hover { background: var(--raised); }
.imp-items .irow.have:hover { background: none; }
.imp-items .none { padding: 12px; }
.imp-head { display: flex; align-items: center; gap: 12px; }
.imp-head p { margin-top: 2px; }
.imp-dialog .row-end { justify-content: flex-end; }
@media (prefers-reduced-motion: reduce) { body.sway .is-art .load { animation: none; } }
@keyframes pulse { to { opacity: .35; } }
@keyframes zoom { to { transform: translateX(-2px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes slide { to { background-position: -150% 0; } }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
/* Kubernetes: Pods and Services. A pod's name opens its page, as a container's does. */
.name[data-ksvc] { cursor: pointer; }
.name[data-ksvc]:hover > div:last-child > span:first-child { text-decoration: underline; text-underline-offset: 2px; }
/* Share for Kubernetes: never (cluster internals), and the port or target picker. */
.dash { color: var(--faint); padding-left: 2px; cursor: default; }
.menu.pick { width: 236px; padding: 5px; box-shadow: 0 14px 40px rgba(0, 0, 0, .45); }
.menu.pick .hd { font-size: var(--fs-small); font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; padding: 6px 9px 4px; }
.menu.pick button { display: flex; align-items: center; gap: 9px; height: auto; min-height: 30px; padding: 5px 9px; border-radius: 6px; }
.menu.pick button[aria-checked=true] { background: var(--raised); }
.menu.pick button .p { font: var(--fs-mono) var(--mono-font); min-width: 34px; }
.menu.pick button .nm { color: var(--muted); }
.menu.pick button .ck { margin-left: auto; width: 13px; height: 13px; fill: var(--blue-light); }
.menu.pick .ft { font-size: var(--fs-small); color: var(--faint); padding: 6px 9px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
.menu.pick.wide { width: 330px; }
.menu.pick .opt { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; text-align: left; }
.menu.pick .opt .tile { width: 22px; height: 22px; border-radius: 6px; grid-row: 1 / span 2; margin-top: 1px; }
.menu.pick .opt .tile svg { width: 13px; height: 13px; }
.menu.pick .opt b { font-weight: 600; }
.menu.pick .opt small { grid-column: 2; color: var(--muted); font-size: var(--fs-small); white-space: normal; line-height: 1.35; }
.menu.pick .opt em { font-style: normal; color: var(--moss); font-weight: 500; margin-left: 4px; }
.menu.pick .opt.warn small { color: var(--sun-text); }
.dialog .opt-line { display: flex; gap: 8px; align-items: center; }
.dhead .sh-chip { margin-left: 2px; }
.name[data-kpod] > div:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ksec { font-size: var(--fs); font-weight: 600; margin: 26px 0 6px; }
.ktable { max-width: 900px; }
.ktable th { position: static; background: none; }
.ktable td { padding: 7px 10px; }
.ktable td.mono { font-size: var(--fs-mono); }
.kv .pill { vertical-align: -1px; }
.empty .stripe { margin: 0 auto; }
.empty .kstep { color: var(--faint); font-size: var(--fs); margin: -6px auto 14px; }
.empty .kstep.klink { margin: 12px auto 0; }
/* The Kubernetes group's state, on its label: a dot and the context, or Off.
   The Docker label holds light or dark at its right, as Kubernetes' has its wrench. */
#k8s-label, #docker-label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
/* A little smaller than the label, so "Stopping" fits beside the wrench. */
.navlabel .kside { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); letter-spacing: .02em; }
.kwrench { margin: -3px 0 -3px auto; display: grid; place-items: center; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 5px; background: none; color: var(--faint); cursor: pointer; }
.kwrench svg.i { width: 13px; height: 13px; }
.kwrench:hover, .kwrench:focus-visible { color: var(--text); background: color-mix(in srgb, currentColor 10%, transparent); }
.kwrench:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.vm dd.kside { display: flex; justify-content: flex-end; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.vm dd.kside span { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.vm dd.kside[hidden] { display: none; }
.kside i, .kstate i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.kside i.on, .kstate i.on { background: var(--moss); }
.kside i.busy, .kstate i.busy { background: var(--sun); animation: pulse .8s infinite alternate; }
.kstate { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-weight: 500; }
.pane h4.ksub { font-size: var(--fs); font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin-bottom: -8px; }
.ksan { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; }

.kaddr { color: var(--text); user-select: text; -webkit-user-select: text; }
.pref .kdelete, .pref .pact { grid-row: 1 / span 2; grid-column: 2; }

/* --- Share: what's shared on the internet, live (Kiri Dev on the Mac; Kiri on Windows) ---- */
nav button.shareonly { display: none; }
body.share nav button.shareonly { display: flex; }
.sh { max-width: 980px; display: grid; gap: 18px; padding-top: 6px; -webkit-user-select: text; user-select: text; }
.sh-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.sh-stat { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 14px 16px; display: grid; align-content: start; gap: 4px; }
.sh-stat .k { display: flex; align-items: center; gap: 7px; font-size: var(--fs); color: var(--muted); }
.sh-stat .k svg { width: 15px; height: 15px; color: var(--blue-light); }
.sh-stat .v { font-size: var(--fs-title); font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sh-stat .s { font-size: var(--fs); color: var(--muted); }
.sh-meter { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; margin-top: 6px; }
.sh-meter i { display: block; height: 100%; border-radius: inherit; background: var(--blue); transition: width .6s; }
.sh-meter i.hot { background: #E8743B; }
.sh-wave { display: flex; align-items: flex-end; gap: 2px; height: 34px; margin-top: 4px; }
/* A moment with no traffic draws nothing (no row of stubs); a wave with
   none at all is one quiet line, and on the card it says so. */
.sh-wave i { flex: 1; border-radius: 2px 2px 0 0; background: color-mix(in srgb, var(--moss) 55%, transparent); transition: height .5s; }
.sh-wave i:last-child { background: var(--moss); }
/* The card's wave stands on a faint baseline, so a first bar or two still reads as a chart. */
.sh-stat .sh-wave { box-shadow: inset 0 -1px var(--line); }
.sh-wave.quiet { position: relative; box-shadow: inset 0 -1px var(--line); }
.sh-wave.quiet span { position: absolute; left: 0; bottom: 7px; font-size: var(--fs-small); color: var(--faint); white-space: nowrap; }
/* This month, then the speed in the same grammar: the number, what it's
   "of" (the plan's limit), a bar, with a tick at the peak. Amber only when
   close to the limit (design: kiri/share-speed-card, variant C). */
.sh-stat > * { min-width: 0; }
.sp { --c: var(--moss); --ct: var(--text); }
.sp.warn { --c: var(--sun); --ct: var(--sun-text); }
.sp.idle { --c: var(--faint); }

.sp .live i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

.sp .row .s { white-space: nowrap; }

.sp .speedrow svg { width: 14px; height: 14px; fill: var(--c); flex: none; }
.sp .speedrow .now { font-size: var(--fs-head); font-weight: 700; letter-spacing: -.01em; color: var(--ct); font-variant-numeric: tabular-nums; }
.sp .lbl-limit { margin-left: auto; font-size: var(--fs-small); color: var(--faint); white-space: nowrap; }
.sp .lbl-limit b { color: var(--muted); font-weight: 600; }
.sp .sbar { position: relative; height: 6px; border-radius: 3px; background: var(--raised); margin-top: 6px; }
.sp .sbar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--c); transition: width .6s, background-color .4s; }
.sp .sbar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--muted); opacity: .7; }
.sp .sbar.nolimit { background: repeating-linear-gradient(90deg, var(--raised) 0 6px, transparent 6px 9px); }
.sp .foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 2px; font-size: var(--fs-small); color: var(--faint); min-height: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }

           background: color-mix(in srgb, var(--moss) 14%, transparent); color: var(--text); font: 500 var(--fs-small) var(--mono-font); }

/* Every live dot's pulse is a ring that grows and fades: transform and
   opacity only, which the GPU animates without repainting. (A growing
   box-shadow repainted every frame: about 18% of a core on Share.)
   `--ring` is how far it grows. */
@keyframes ring { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(var(--ring, 2.3)); opacity: 0; } }
/* They beat together, once every few seconds (`beat` in the script), and
   rest in between with nothing to draw; not at all while Kiri isn't the
   window in use. */
body { --beat: none; }
/* Nothing moves while Kiri isn't the window in use (`away` in the script). */
body.away *, body.away *::before, body.away *::after { animation-play-state: paused !important; }
body.beat { --beat: ring 1.6s ease-out; }
@keyframes sh-blink { 50% { opacity: .35; } }
/* Diagnostics: Settings → Diagnostics, the card after a crash, an error's Details. */
.dg-part { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font: 600 var(--fs-small) var(--ui-font); letter-spacing: .02em;
           color: var(--muted); background: var(--row-hover); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }

.diag .btn svg, .dt-foot .btn svg, .rp-dialog .btn svg, .updcard .btn svg { width: 14px; height: 14px; fill: currentColor; }
.dg-result { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: var(--fs);

.dg-result > svg { width: 15px; height: 15px; fill: var(--moss); flex: none; }

.dg-crashes { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }

.dg-crash + .dg-crash, .dg-stack + .dg-crash { border-top: 1px solid var(--line); }
.dg-crash:hover { background: var(--row-hover); }

.dg-crash .first { font: var(--fs)/1.45 var(--mono-font); color: var(--text); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }

          color: #D9DEE4; user-select: text; -webkit-user-select: text; cursor: text; }

.dg-live { display: inline-flex; align-items: center; gap: 6px; }

/* The card after a crash takes the update card's place. */

.updcard .ic svg[viewBox="0 0 256 256"] { fill: currentColor; }

/* An error's Details: that one action's log lines. */
.dt-dialog { width: min(700px, calc(100% - 32px)); padding: 0; gap: 0; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); animation: wn-in .2s ease-out; }

.dt-head .ic { grid-row: 1 / span 2; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--red-text); background: color-mix(in srgb, var(--red) 14%, transparent); }

/* Create report… and Send to Kiri: what goes in, and the id once sent. */

.rp-list { display: grid; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }

/* --- The built-in terminal: a panel under the page (tests/ui/terminal.js) ----------- */
:root { --term-bg: #0B0F13; --term-fg: #D7DCE1; }
@media (prefers-color-scheme: light) { :root { --term-bg: #FFFFFF; --term-fg: #1F2328; } }
main { position: relative; }
/* Raised above the page: a shadow up onto it, a lighter top edge and a lifted
   header, so the panel never reads as more of the page. */
.htdrawer { flex: none; height: var(--ht-h, 300px); border-top: 1px solid color-mix(in srgb, var(--text) 16%, var(--line)); position: relative; z-index: 3; display: flex; flex-direction: column; min-height: 0; background: var(--panel);
  box-shadow: 0 -10px 28px rgb(0 0 0 / .32), 0 -1px 0 rgb(0 0 0 / .25); }
@media (prefers-color-scheme: light) { .htdrawer { box-shadow: 0 -8px 22px rgb(0 0 0 / .10); } }
.htdrawer[hidden] { display: none; }
.htdrawer.max { position: absolute; inset: 0; height: auto; border-top: 0; z-index: 10; }
.htgrip { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: row-resize; z-index: 5; }
.htdrawer.max .htgrip { display: none; }
.hthead { display: flex; align-items: center; height: 32px; padding: 0 6px 0 4px; border-bottom: 1px solid var(--line); gap: 2px; flex: none; background: color-mix(in srgb, var(--raised) 75%, var(--panel)); }
.httabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
.httab { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 9px; border-radius: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: var(--fs); border: 0; background: none; font-family: inherit; }
.httab:hover { background: var(--row-hover); color: var(--text); }
.httab.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.httab .x { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--faint); opacity: 0; }
.httab:hover .x, .httab.on .x { opacity: 1; }
.httab .pin { width: 16px; height: 16px; display: grid; place-items: center; color: var(--blue-light); }

  const frag = document.createDocumentFragment();

    const lines = (ui.partial[p.e] + p.t.replace(ansi, "").replace(/\r\n/g, "\n")).split("\n");
    ui.partial[p.e] = lines.pop();
    for (const line of lines) {
      const div = document.createElement("div");
      const lvl = levelOf(line);
      div.dataset.lvl = lvl || "none";
      if (lvl && lvl !== "info") div.className = `lvl-${lvl}`;
      else if (p.e) div.className = "err";
      div.textContent = line || " ";
      div.dataset.n = ++ui.logN;
      if (!shown(div, filter, level)) div.classList.add("hide");
      frag.append(div);
    }
  }
  logEl.append(frag);
  while (logEl.childElementCount > LOG_MAX) logEl.firstElementChild.remove();
  if (ui.detail.follow && atEnd || ui.detail.follow && parts.length > 50) logEl.scrollTop = logEl.scrollHeight;
  logCount();
}

function filterLogs() {
  const d = ui.detail, f = d.logFilter.toLowerCase();
  for (const div of logEl.children) div.classList.toggle("hide", !shown(div, f, d.logLevel));
  logCount();
}

/* The prompt, as a shell shows it: user@host:dir# (or $ for other users).
   Until the container has answered, it comes from the inspect data. */
function ps1(t, info) {
  const cfg = info?.Config || {};
  const user = t.user || (cfg.User || "root").split(":")[0];
  const host = t.host || cfg.Hostname || (ui.detail?.id || "").slice(0, 12);
  return `${user}@${host}:${t.cwd || cfg.WorkingDir || "/"}${user === "root" || user === "0" ? "#" : "$"} `;
}
function setPrompt() {
  const d = ui.detail;
  if (d) termEl.querySelector("#term-form span").textContent = ps1(d.term, d.info);
}
/* Each command runs on its own (sh -c), so it starts in the directory the
   last one ended in, and reports back who and where it is, after a marker. */
const PS1_MARK = "\x1e";
const shq = (s) => `'${s.replace(/'/g, `'\\''`)}'`;
function wrapped(t, cmd) {
  const cd = t.cwd ? `cd -- ${shq(t.cwd)} 2>/dev/null\n` : "";
  return `${cd}${cmd}\n__kiri=$?; printf '\\n\\036%s\\037%s\\037%s' "$(id -un 2>/dev/null || whoami 2>/dev/null)" "$(hostname 2>/dev/null || cat /etc/hostname 2>/dev/null)" "$PWD"; exit $__kiri`;
}
function probePrompt() {
  const d = ui.detail;
  if (!d || d.term.probed) return;
  d.term.probed = wrapped(d.term, ":");
  send("exec", { id: d.id, path: d.term.probed });
}

function runCommand(cmd) {
  const d = ui.detail, out = $("term-out");
  d.term.history.push(cmd);
  d.term.at = d.term.history.length;
  const block = document.createElement("div");
  block.dataset.pending = "1";
  block.innerHTML = `<div class="cmd"><span class="ps1"></span><span class="typed"></span></div><div class="body quiet">running…</div>`;
  block.querySelector(".ps1").textContent = ps1(d.term, d.info);
  block.querySelector(".typed").textContent = cmd;
  out.append(block);
  termEl.scrollTop = termEl.scrollHeight;
  send("exec", { id: d.id, path: wrapped(d.term, cmd) });
}

function finishExec(e) {
  // Split off what the shell reported (user, host, directory) and keep it for the prompt.
  let output = e.output.replace(/\r\n/g, "\n");
  const at = output.lastIndexOf(PS1_MARK);
  if (at >= 0) {
    const [user, host, cwd] = output.slice(at + 1).split("\x1f");
    Object.assign(ui.detail.term, { user: user.trim(), host: host.trim(), cwd: cwd.trim() });
    output = output.slice(0, at).replace(/\n$/, "");
    setPrompt();
  }
  const out = $("term-out") ?? termEl.querySelector("#term-out");
  const block = out.querySelector("[data-pending]");
  // The opening probe has no block of its own.
  if (!block || e.cmd === ui.detail.term.probed) return;
  block.removeAttribute("data-pending");
  const body = block.querySelector(".body");
  body.className = "body";
  body.textContent = output.replace(ansi, "").replace(/\n$/, "");
  if (e.code !== 0) {
    const x = document.createElement("div");
    x.className = "exit";
    x.textContent = `exit ${e.code}`;
    block.append(x);
  }
  termEl.scrollTop = termEl.scrollHeight;
}

termEl.querySelector("#term-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const input = termEl.querySelector("#term-in");
  const cmd = input.value.trim();
  if (!cmd) return;
  if (cmd === "clear") { termEl.querySelector("#term-out").textContent = ""; input.value = ""; return; }
  runCommand(cmd);
  input.value = "";
});
termEl.querySelector("#term-in").addEventListener("keydown", (ev) => {
  const t = ui.detail?.term;
  if (!t || !["ArrowUp", "ArrowDown"].includes(ev.key)) return;
  ev.preventDefault();
  t.at = Math.max(0, Math.min(t.history.length, t.at + (ev.key === "ArrowUp" ? -1 : 1)));
  ev.target.value = t.history[t.at] ?? "";
});

function onboarding(e) {
  ui.onb = { ...e, busy: null };
  let el = $("onb");
  if (!el) {
    el = document.createElement("div");
    el.id = "onb";
    el.setAttribute("role", "dialog");

function drawOnb() {

  const c = o.checks || {}, busy = o.busy, skipped = new Set(o.skipped || []);
  const isSkipped = (k) => skipped.has(k) && c[k] !== "ok";
  const fixable = ([k, , , fix]) => fix && fix[c[k]];
  const pending = ONB.filter((row) => fixable(row) && !isSkipped(row[0]));
  const restart = c.access === "restart";
  // What a fix in progress covers: all of them, or one; the engine and access are one step as root.
  const asRoot = (k) => k === "running" || k === "access";
  const covers = (k) => busy === "all" || busy === k || (asRoot(busy) && asRoot(k));
  const stateOf = (k) => (busy && covers(k) && c[k] !== "ok" ? "wait" : c[k]);
  const icon = (st) => st === "ok" ? onbIcon("check") : st === "bad" ? onbIcon("warning") : st === "restart" ? onbIcon("restart") : st === "wait" ? "" : onbIcon("dot");
  const say = (v) => (typeof v === "function" ? v(esc(o.user || "your account")) : v || "");
  const rows = ONB.map((row) => {
    const [k, title, words, fix, root] = row, st = stateOf(k), label = fixable(row), skip = isSkipped(k);
    const first = pending[0]?.[0] === k;
    const canSkip = ONB_SKIP[k] && label && !skip && o.ready;
    const text = skip ? ONB_SKIP[k] : say(words[c[k]]);
    const extra = skip ? `<button class="linkish" data-onbskip="${k}" data-undo="1"${busy ? " disabled" : ""}>Undo</button>`
      : canSkip ? `<button class="linkish" data-onbskip="${k}"${busy ? " disabled" : ""}>Skip</button>` : "";
    return `<div class="onb-row${skip ? " skipped" : ""}" data-check="${k}"><div class="st ${skip ? "no" : st}">${icon(skip ? "no" : st)}</div><div class="t"><div>${title}</div><p>${text}</p></div>${extra}${label && !skip ? `<button class="btn${first ? " primary" : ""}" data-onbfix="${k}"${busy ? " disabled" : ""}>${root ? onbIcon("lock") : ""}${label}</button>` : ""}</div>`;
  }).join("");
  const rootPending = pending.some(([, , , , root]) => root);
  el.innerHTML = `<div class="onb-in"><div class="onb-hd">${ONB_LOGO}<div><h2 id="onb-title">Set up Kiri</h2><p>${o.complete ? "Kiri is set up." : o.ready ? `${pending.length === 1 ? "One more step" : "A couple more steps"}: set ${pending.length === 1 ? "it" : "them"} up, or skip.` : restart ? "One more step: log out and back in." : "A few things need fixing before Kiri can run containers."}</p></div></div>
    <div class="onb-rows">${rows}</div>
    ${o.error ? `<div class="onb-err">${esc(o.error)}</div>` : ""}
    ${restart ? `<div class="onb-rs"><b>Log out to finish</b><p>This system applies your new access when you sign in again. Kiri opens ready after that.</p><div class="a"><button class="btn primary" data-onb="logout">Log out now</button><button class="btn" data-onb="restart">Restart</button></div></div>` : ""}
    <div class="onb-ft"><span class="m">${rootPending && !o.ready ? `${onbIcon("lock")}Asks for your password once` : ""}</span>${pending.length > 1 ? `<button class="btn" data-onbfix="all"${busy ? " disabled" : ""}>Fix all</button>` : ""}<button class="btn primary" data-onb="open"${o.complete && !busy ? "" : " disabled"}>Open Kiri</button></div></div>`;
}
function onbClick(ev) {
  const o = ui.onb, b = ev.target.closest("button");
  if (!o || !b || b.disabled) return;
  if (b.dataset.onbskip) {
    o.error = "";
    send("onbskip", { name: b.dataset.onbskip, value: !b.dataset.undo });
  } else if (b.dataset.onbfix) {
    o.busy = b.dataset.onbfix;
    o.error = "";
    drawOnb();
    send("onbfix", { name: b.dataset.onbfix });
  } else if (b.dataset.onb === "open") {
    $("onb")?.remove();
    ui.onb = null;
    send("onbopen");
  } else if (b.dataset.onb === "logout") send("onblogout");
  else if (b.dataset.onb === "restart") send("onbrestart");
}

function welcome() {
  let pick = "local";
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const draw = () => {
    scrim.innerHTML = `<div class="dialog" role="dialog" aria-labelledby="welcome-title" style="width:min(520px,calc(100% - 32px))">
      <h3 id="welcome-title">How should you reach your containers?</h3>
      <div class="choices">
        <button class="choice" data-pick="localhost" aria-pressed="${pick === "localhost"}">
          ${pictureBar('localhost<tspan style="fill:var(--faint)">:8080</tspan>', false)}

        <button class="choice" data-pick="local" aria-pressed="${pick === "local"}">
          ${pictureBar('myapp<tspan fill="#E0B420">.kiri.local</tspan>', true)}
          <span class="t">.kiri.local</span><span class="d">By name, no ports. ${WIN ? "Windows asks for an administrator's approval once." : "Needs an administrator password once."}</span></button>
      </div>
      ${pick === "local" && !WIN ? `<div class="admin-note"><span class="ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></span>
        <span><b>macOS will ask for an administrator password next.</b> To make names like <span class="mono">myapp.kiri.local</span> work, Kiri adds one small settings file to your Mac (<span class="mono">/etc/resolver/kiri.local</span>), and changing system settings always needs an administrator. Kiri uses the password only for that, once. It never sees the password: macOS handles it.</span></div>` : ""}
      <p>You can change this later in Settings → Domains.</p>

/* Settings → Import: images, volumes and containers from OrbStack or Docker Desktop. */
const IMPORT_KINDS = [["images", "Images"], ["volumes", "Volumes"], ["containers", "Containers"]];
/* The import lists and their Import button: Settings → Import and the review window share them. */
function importSections() {
  const im = ui.imp, picked = im.picked;
  return IMPORT_KINDS.map(([k, label]) => {
    const items = im.inv[k] || [];
    const free = items.filter((v) => !v.have && !(k === "volumes" && v.anonymous));
    const rows = items.map((v) => {
      const st = im.steps[`${k}/${v.name}`];
      const state = st ? (st.state === "running" ? `<span class="muted">Importing…</span>` : st.state === "done" ? `<span class="ok">Imported</span>` : `<span class="err-text" title="${esc(st.error || "")}">Failed</span>`) : "";
      const extra = v.have ? `<span class="muted">In Kiri</span>` : k === "images" ? `<span class="muted num">${esc(v.size || "")}</span>` : k === "containers" ? `<span class="muted">${esc(v.image || "")} · ${esc(v.state || "")}</span>` : v.anonymous ? `<span class="muted">anonymous</span>` : "";
      return `<label class="irow${v.have ? " have" : ""}"><input type="checkbox" data-imp="${k}" value="${esc(v.name)}"${picked[k].has(v.name) ? " checked" : ""}${v.have || im.running ? " disabled" : ""}><span class="mono clip">${esc(v.name)}</span>${extra}${state}</label>`;
    }).join("");
    return `<section class="isec"><div class="ihead"><b>${label}</b><span class="muted">${items.length}</span><span style="flex:1"></span>
      ${free.length ? `<button class="linkish" data-impall="${k}"${im.running ? " disabled" : ""}>${free.every((v) => picked[k].has(v.name)) ? "Select none" : "Select all"}</button>` : ""}</div>
      <div class="ilist">${rows || '<span class="muted">None</span>'}</div></section>`;
  }).join("");
}
const importCount = () => IMPORT_KINDS.reduce((n, [k]) => n + ui.imp.picked[k].size, 0);
function importGo() {
  const im = ui.imp, count = importCount();
  const verb = ctx.pending ? "Switch and import" : "Import";
  return `<button class="btn primary" data-impgo${!count || im.running ? " disabled" : ""}>${im.running ? "Importing…" : count ? `${verb} ${count} ${count === 1 ? "item" : "items"}` : verb}</button>`;
}
/* The import picture: a line from the crane, a spreader, and three containers. */
const IMPORT_ART = (cls) => `<svg class="is-art${cls}" viewBox="0 0 18 18" aria-hidden="true"><g class="load">
  <path d="M9 -2V3.5M4 3.5h10" stroke="var(--muted)" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <rect x="3" y="5" width="12" height="3.6" rx=".8" fill="#F2CF5B"/><rect x="3" y="9.2" width="12" height="3.6" rx=".8" fill="#E0B420"/><rect x="3" y="13.4" width="12" height="3.6" rx=".8" fill="#C99A12"/>
  <path d="M6 5.6v2.4M9 5.6v2.4M12 5.6v2.4M6 9.8v2.4M9 9.8v2.4M12 9.8v2.4M6 14v2.4M9 14v2.4M12 14v2.4" stroke="#0F1419" stroke-opacity=".28" stroke-width=".8"/></g></svg>`;

/* What the source has that Kiri doesn't: { images, volumes, containers, total }. */
function importable() {
  const inv = ui.imp.inv, out = { total: 0 };
  for (const [k] of IMPORT_KINDS) { out[k] = (inv?.[k] || []).filter((v) => !v.have && !(k === "volumes" && v.anonymous)).length; out.total += out[k]; }
  return out;
}

function importPane() {
  const im = ui.imp;
  if (!im.sources) return `<div class="pane"><h3>Import</h3><p class="muted">Looking for OrbStack and Docker Desktop…</p></div>`;
  if (!im.sources.length) return `<div class="pane"><h3>Import</h3><p class="muted">Nothing to import from: OrbStack and Docker Desktop aren't on this ${HOST}.</p></div>`;
  const src = im.sources.find((s) => s.id === im.source) || im.sources[0];
  const seg = im.sources.map((s) => `<button data-impsrc="${s.id}" aria-pressed="${s.id === src.id}">${esc(s.label)}</button>`).join("");
  let body;
  if (!src.running) body = `<p class="muted">${esc(src.label)} isn't running. Start it to import from it; it doesn't need to stay open afterwards.</p>`;
  else if (!im.inv || im.inv.source !== src.id) body = `<p class="muted">Reading what ${esc(src.label)} has…</p>`;
  else if (im.inv.error) body = `<p class="muted">${esc(im.inv.error)}</p>`;
  else body = `${importSections()}
      <div class="res-foot"><span class="muted">${im.summary ? esc(im.summary) : `${esc(src.label)} isn't changed: images are copied, and volumes are read through a temporary read-only helper that's removed after. Containers arrive stopped.`}</span>
        <span style="flex:1"></span>${importGo()}</div>`;
  return `<div class="pane"><h3>Import</h3>
    <div class="pref"><span class="t">From</span><span class="d">Bring images, volumes and containers over to Kiri.</span><div class="seg" role="group" aria-label="Import from">${seg}</div></div>
    ${body}</div>`;
}

/* The strip above the lists: another engine has things Kiri doesn't. Closing it
   keeps it closed until that engine has more than it had then. */
function renderImportStrip() {
  if (renderCtxStrip()) return;
  $("impstrip").classList.remove("ctx");
  // While the switch card shows the import, the strip would say it twice.
  if (ctx.card) { $("impstrip").hidden = true; return; }
  const el = $("impstrip"), n = importable(), src = ui.imp.sources?.find((s) => s.id === ui.imp.inv?.source);
  const seen = prefs.importSeen?.[src?.id] ?? -1;
  if (!src || ui.imp.inv.error || !n.total || n.total <= seen || ui.view === "settings") { el.hidden = true; return; }
  const parts = IMPORT_KINDS.filter(([k]) => n[k]).map(([k, label]) => `${n[k]} ${n[k] === 1 ? label.toLowerCase().slice(0, -1) : label.toLowerCase()}`);
  const list = parts.length > 1 ? `${parts.slice(0, -1).join(", ")} and ${parts.at(-1)}` : parts[0];
  el.innerHTML = `${IMPORT_ART("")}
    <span class="is-text"><b>${esc(src.label)} has ${list}</b> that aren't in Kiri yet.</span>
    <button class="btn sm primary" data-impreview>Review</button>
    <button class="is-x" data-impdismiss title="Hide until ${esc(src.label)} has more" aria-label="Hide">×</button>`;
  el.hidden = false;
}
function dismissImportStrip() {
  const id = ui.imp.inv?.source;
  if (!id) return;
  setPref("importSeen", { ...(prefs.importSeen || {}), [id]: importable().total });
  $("impstrip").hidden = true;
}

/* Which engine plain `docker` uses. While it's another one (OrbStack, Docker
   Desktop), the status bar says so in amber and a strip over Containers and
   Images offers to switch ("Not now" asks again in a week). Switching can
   bring that engine's images along through Import: they stay where they
   were too, and Switch back undoes it. */
const CTX_NAMES = { orbstack: "OrbStack", "desktop-linux": "Docker Desktop", default: "Docker's default engine" };
const CTX_SNOOZE = 7 * 864e5;
const ctx = { card: null };
const ctxOther = () => !!ui.status && ui.status.context !== ui.status.ours;
const ctxLabel = (c) => CTX_NAMES[c] || c;
const ctxWarn = (cls = "") => `<svg class="${cls}" viewBox="0 0 256 256" aria-hidden="true"><path d="${PH.warning}"/></svg>`;
// "1.2GB", "187MB", "5.6kB" (docker's image sizes) in bytes.
const ctxBytes = (v) => { const m = /^([\d.]+)\s*([kMGT]?)B$/i.exec(String(v || "")); return m ? +m[1] * 1000 ** " KMGT".indexOf((m[2] || " ").toUpperCase()) : 0; };

function ctxStatusItem() {
  if (!ui.status) return "";
  if (!ctxOther()) return `<span class="sep">·</span><span class="item ctx-ok" title="The docker command uses ${esc(ui.status.app || "Kiri")}"><i></i>docker → ${esc(ui.status.app || "Kiri")}</span>`;
  return `<span class="sep">·</span><button class="item ctx-warn" data-ctxswitch title="The docker command uses ${esc(ctxLabel(ui.status.context))}. Switch it to ${esc(ui.status.app || "Kiri")}">${ctxWarn()}docker → ${esc(ctxLabel(ui.status.context))}</button>`;
}

function renderCtxStrip() {
  const el = $("impstrip");
  if (!ctxOther() || !["containers", "images"].includes(ui.view) || Date.now() < (prefs.ctxSnooze || 0) || ctx.card) return false;
  el.innerHTML = `${ctxWarn("is-warn")}
    <span class="is-text"><b>docker still uses ${esc(ctxLabel(ui.status.context))}</b>, so what you run in the terminal won't show up here. Your images can come along.</span>
    <button class="btn sm primary" data-ctxswitch>Switch to ${esc(ui.status.app || "Kiri")}</button>
    <button class="is-x" data-ctxsnooze title="Not now: ask again in a week" aria-label="Not now">×</button>`;
  el.classList.add("ctx");
  el.hidden = false;
  return true;
}

/* The images the other engine has that Kiri doesn't, once its inventory is in. */
function ctxImages(from) {
  const inv = ui.imp.inv;
  return inv && inv.source === from && !inv.error ? inv.images.filter((v) => !v.have) : null;
}

function ctxDialog() {
  if (!ctxOther()) return;
  $("ctx-dlg")?.remove();
  const from = ui.status.context, label = ctxLabel(from), app = ui.status.app || "Kiri";
  const src = ui.imp.sources?.find((s) => s.id === from), imgs = ctxImages(from), inv = ui.imp.inv;
  if (src?.running && !imgs) send("inventory", { name: from });
  const bytes = (imgs || []).reduce((a, v) => a + ctxBytes(v.size), 0);
  const theirs = imgs ? `${inv.images.length} ${inv.images.length === 1 ? "image" : "images"} · ${inv.containers.length} ${inv.containers.length === 1 ? "container" : "containers"}` : src && !src.running ? "not running" : "";
  // A lot to copy (over 10 GB) isn't ticked for you: choosing is likely better.
  const big = bytes > 10e9;
  const bring = imgs?.length
    ? `<label class="ctx-opt"><input type="checkbox" id="ctx-bring"${big ? "" : " checked"}><span><b>Bring all my ${esc(label)} images to ${esc(app)}</b><small>${imgs.length} ${imgs.length === 1 ? "image" : "images"}${bytes ? `, ${size(bytes)}` : ""}. ${big ? "That's a lot to copy and can take a long time; choosing what you need is quicker." : "You can keep working while they copy."}</small></span></label>`
    : src && !src.running ? `<p class="muted" style="font-size:var(--fs)">Start ${esc(label)} to bring its images over now, or later from Settings → Import.</p>` : "";
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "ctx-dlg";
  scrim.innerHTML = `<div class="dialog ctx-dlg" role="dialog" aria-modal="true" aria-labelledby="ctx-h">
    <h3 id="ctx-h">Use ${esc(app)} for docker?</h3>
    <div class="ctx-flow"><div class="e">${esc(label)}<small>${theirs}</small></div><span class="arr">→</span>
      <div class="e">${esc(app)}<small>${ui.images.length} ${ui.images.length === 1 ? "image" : "images"} · ${ui.containers.length} ${ui.containers.length === 1 ? "container" : "containers"}</small></div></div>
    <div class="ctx-keep">
      <div><span class="ok">✓</span><span><code>docker</code>, <code>docker compose</code> and your tools run on ${esc(app)} from now on.</span></div>
      <div><span class="no">!</span><span>Your ${esc(label)} images and containers stay in ${esc(label)}. ${esc(app)} can't see them until you bring them over.</span></div>
      <div><span class="ok">✓</span><span>Nothing is deleted. You can switch back any time from the status bar.</span></div></div>
    ${bring}
    <div class="ctx-foot">${imgs?.length ? `<button class="linkish" data-ctxchoose>Choose what to bring…</button>` : "<span></span>"}
      <span><button class="btn" data-close>Not now</button> <button class="btn primary" data-ctxgo>Switch to ${esc(app)}</button></span></div></div>`;
  document.body.append(scrim);
  scrim.addEventListener("click", (ev) => {
    const t = (sel) => ev.target.closest(sel);
    if (ev.target === scrim || t("[data-close]")) scrim.remove();
    else if (t("[data-ctxgo]")) ctxSwitch(from, $("ctx-bring")?.checked ? "all" : "");
    else if (t("[data-ctxchoose]")) ctxChoose(from);
  });
  scrim.querySelector("[data-ctxgo]").focus();
}

function ctxSwitch(from, bringAll) {
  $("ctx-dlg")?.remove();
  const imgs = ctxImages(from) || [];
  if (bringAll && imgs.length && !ui.imp.running) {
    const names = imgs.map((v) => v.name);
    ui.imp.source = from; ui.imp.running = true; ui.imp.summary = "";
    for (const n of names) ui.imp.picked.images.add(n);
    send("import", { name: from, value: { images: names, volumes: [], containers: [] } });
    return ctxUse(from, names.length);
  }
  ctxUse(from, 0);
}

/* "Choose what to bring…": the Import window, whose button switches docker
   as it starts the import. Closing it switches nothing. */
function ctxChoose(from) {
  $("ctx-dlg")?.remove();
  ui.imp.source = from;
  openImportModal();
  ctx.pending = from;
  drawImportModal();
}

/* docker now uses Kiri; `total` items are on their way over. */
function ctxUse(from, total) {
  setPref("ctxBack", from);
  send("usecontext", { name: ui.status.ours });
  ctx.card = { from, total, done: 0, failed: 0, finished: false };
  drawCtxCard();
}

function ctxStep(e) {
  if (!ctx.card?.total || e.state === "running") return;
  if (e.state === "done") ctx.card.done += 1; else ctx.card.failed += 1;
  drawCtxCard();
}

function drawCtxCard() {
  const el = $("ctxcard"), c = ctx.card;
  if (!c) { el.hidden = true; el.innerHTML = ""; renderImportStrip(); return; }
  const label = esc(ctxLabel(c.from)), app = esc(ui.status?.app || "Kiri"), n = c.done + c.failed;
  const body = !c.total ? `<div class="sub">Your ${label} images stay there. Bring them over any time from Settings → Import.</div>`
    : c.finished ? `<div class="sub">Brought ${c.done} ${c.done === 1 ? "item" : "items"} over from ${label}${c.failed ? `; ${c.failed} failed (Settings → Import says why)` : ""}.</div>`
    : `<div class="sub">Bringing your images over from ${label}: ${n} of ${c.total}.</div><div class="ctx-prog"><i style="width:${Math.round(n / c.total * 100)}%"></i></div><div class="sub">They appear in Images as they arrive.</div>`;
  el.innerHTML = `<button class="x" data-ctxclose title="Close" aria-label="Close">×</button>
    <div class="head"><div class="ic ok">${UPD_ICON.ok}</div><div class="txt"><h4>docker now uses ${app}</h4>${body}</div></div>
    <div class="row-end"><span></span><span><button class="btn sm" data-ctxback>Switch back</button>${c.total ? ` <button class="btn sm" data-ctximages>Show Images</button>` : ""}</span></div>`;
  el.hidden = false;
}

$("ctxcard").addEventListener("click", (ev) => {
  const t = (sel) => ev.target.closest(sel);
  if (t("[data-ctxclose]")) { ctx.card = null; drawCtxCard(); }
  else if (t("[data-ctximages]")) show("images");
  else if (t("[data-ctxback]")) {
    send("usecontext", { name: prefs.ctxBack || "default" });
    setPref("ctxSnooze", Date.now() + CTX_SNOOZE);
    ctx.card = null; drawCtxCard();
  }
});

/* The review window: the same lists, with Close and Import. */
let impModal = null;
function openImportModal() {
  if (!importCount()) for (const v of ui.imp.inv.images || []) if (!v.have) ui.imp.picked.images.add(v.name);
  impModal = document.createElement("div");
  impModal.className = "scrim";
  document.body.append(impModal);
  drawImportModal();
  impModal.addEventListener("click", (ev) => {
    if (ev.target === impModal || ev.target.closest("[data-impclose]")) return closeImportModal();
    if (importClick(ev.target)) drawImportModal();
  });
  impModal.addEventListener("change", (ev) => { if (pickChange(ev.target)) refreshImportPicks(); });
  document.addEventListener("keydown", escImportModal);
}
function escImportModal(ev) { if (ev.key === "Escape") closeImportModal(); }
function closeImportModal() {
  impModal?.remove(); impModal = null;
  ctx.pending = null;
  document.removeEventListener("keydown", escImportModal);
  renderImportStrip();
}
function drawImportModal() {
  if (!impModal) return;
  const im = ui.imp, src = im.sources.find((s) => s.id === im.inv.source), n = importable();
  const scroll = impModal.querySelector(".imp-items .list")?.scrollTop || 0;
  impModal.innerHTML = `<div class="dialog imp-dialog" role="dialog" aria-modal="true" aria-labelledby="imp-title">
    <div class="imp-head">${IMPORT_ART(" big")}
      <div><h3 id="imp-title">Bring your ${esc(src.label)} things to Kiri</h3>
      <p>${n.total ? `${n.total} ${n.total === 1 ? "item isn't" : "items aren't"} in Kiri yet. Pick what to copy over.` : "Everything is in Kiri."}</p></div></div>
    ${importColumns()}
    <p class="imp-note">${im.summary ? esc(im.summary) : `${esc(src.label)} stays as it is: Kiri only copies. Containers arrive stopped.`}</p>
    <div class="row-end"><button class="btn" data-impclose>${im.summary && !im.running ? "Done" : "Close"}</button>${importGo()}</div>
  </div>`;
  const list = impModal.querySelector(".imp-items .list");
  if (list && impModal.dataset.col === ui.imp.col) list.scrollTop = scroll;
  impModal.dataset.col = ui.imp.col;
  // A kind with some of its items picked shows a dash, as Finder's do.
  impModal.querySelectorAll("[data-impkind]").forEach((cb) => (cb.indeterminate = cb.dataset.some === "1"));
}

/* The left column: each kind, ticked when all of it is picked. */
function importKinds() {
  const im = ui.imp, picked = im.picked;
  return IMPORT_KINDS.map(([k, label]) => {
    const f = (im.inv[k] || []).filter((v) => !v.have && !(k === "volumes" && v.anonymous)), n = f.filter((v) => picked[k].has(v.name)).length;
    const all = f.length > 0 && n === f.length, off = !f.length || im.running;
    return `<div class="imp-kind" role="option" data-impcol="${k}" aria-selected="${im.col === k}">
      <span class="pick"${off ? "" : ` data-impkind="${k}"`}><input type="checkbox" data-impkind="${k}" data-some="${n && !all ? 1 : 0}"${all ? " checked" : ""}${off ? " disabled" : ""} aria-label="All ${label.toLowerCase()}">${label}</span><span class="n">${n ? `${n} of ${f.length}` : (im.inv[k] || []).length}</span><span class="chev">›</span></div>`;
  }).join("");
}

function importAll(k) {
  const im = ui.imp, f = (im.inv[k] || []).filter((v) => !v.have && !(k === "volumes" && v.anonymous));
  return f.length ? `<button class="linkish" data-impall="${k}"${im.running ? " disabled" : ""}>${f.every((v) => im.picked[k].has(v.name)) ? "Select none" : "Select all"}</button>` : "";
}
/* A tick in the review window: only the counts and buttons change, not the long list. */
function refreshImportPicks() {
  impModal.querySelector(".imp-kinds").innerHTML = importKinds();
  impModal.querySelector(".impall").innerHTML = importAll(ui.imp.col);
  impModal.querySelector("[data-impgo]").outerHTML = importGo();
  impModal.querySelectorAll("[data-impkind]").forEach((cb) => (cb.indeterminate = cb.dataset.some === "1"));
}

/* A name in two parts: the start shrinks first, the tag (or the last few characters) stays. */
function nameCell(k, s) {
  const i = s.lastIndexOf(":"), cut = k === "images" && i > s.lastIndexOf("/") ? i : s.length > 28 ? s.length - 12 : s.length;
  return `<span class="mono nm" title="${esc(s)}"><span>${esc(s.slice(0, cut))}</span><span class="b">${esc(s.slice(cut))}</span></span>`;
}
/* The review window's two columns. */
function importColumns() {
  const im = ui.imp, picked = im.picked;
  const free = (k) => (im.inv[k] || []).filter((v) => !v.have && !(k === "volumes" && v.anonymous));
  if (!IMPORT_KINDS.some(([k]) => k === im.col)) im.col = (IMPORT_KINDS.find(([k]) => free(k).length) || IMPORT_KINDS[0])[0];
  const kinds = importKinds();
  const k = im.col, label = IMPORT_KINDS.find(([x]) => x === k)[1], items = im.inv[k] || [], f = free(k);
  const rows = items.map((v) => {
    const st = im.steps[`${k}/${v.name}`];
    const state = st ? (st.state === "running" ? `<span class="muted">Importing…</span>` : st.state === "done" ? `<span class="ok">Imported</span>` : `<span class="err-text" title="${esc(st.error || "")}">Failed</span>`) : "";
    const extra = v.have ? `<span class="muted">In Kiri</span>` : k === "images" ? `<span class="muted num">${esc(v.size || "")}</span>` : k === "containers" ? `<span class="muted">${esc(v.image || "")} · ${esc(v.state || "")}</span>` : v.anonymous ? `<span class="muted">anonymous</span>` : "";
    return `<label class="irow${v.have ? " have" : ""}"><input type="checkbox" data-imp="${k}" value="${esc(v.name)}"${picked[k].has(v.name) ? " checked" : ""}${v.have || im.running ? " disabled" : ""}>${nameCell(k, v.name)}${extra}${state}</label>`;
  }).join("");
  return `<div class="imp-cols"><div class="imp-kinds" role="listbox" aria-label="What to import">${kinds}</div>
    <div class="imp-items"><div class="ihead"><b>${label}</b><span class="muted">${items.length}</span><span style="flex:1"></span>
      <span class="impall">${importAll(k)}</span></div>
      <div class="list">${rows || `<p class="muted none">No ${label.toLowerCase()}</p>`}</div></div></div>`;
}

/* Clicks and ticks on the import lists, wherever they are shown. */
function importClick(target) {
  const t = (sel) => target.closest(sel);
  let el;
  if ((el = t("[data-impkind]"))) {
    const k = el.dataset.impkind, free = (ui.imp.inv[k] || []).filter((v) => !v.have && !(k === "volumes" && v.anonymous));
    const all = free.every((v) => ui.imp.picked[k].has(v.name));
    free.forEach((v) => (all ? ui.imp.picked[k].delete(v.name) : ui.imp.picked[k].add(v.name)));
    ui.imp.col = k;
    return true;
  }
  if ((el = t("[data-impcol]"))) { ui.imp.col = el.dataset.impcol; return true; }
  if ((el = t("[data-impall]"))) { const k = el.dataset.impall, free = (ui.imp.inv[k] || []).filter((v) => !v.have && !(k === "volumes" && v.anonymous)); const all = free.every((v) => ui.imp.picked[k].has(v.name)); free.forEach((v) => (all ? ui.imp.picked[k].delete(v.name) : ui.imp.picked[k].add(v.name))); return true; }
  if ((el = t("[data-impgo]"))) {
    const picked = Object.fromEntries(IMPORT_KINDS.map(([k]) => [k, [...ui.imp.picked[k]]]));
    ui.imp.running = true; ui.imp.summary = "";
    send("import", { name: ui.imp.source, value: picked });
    // Chosen from the switch dialog: docker switches now that the import has started.
    if (ctx.pending) { ctxUse(ctx.pending, Object.values(picked).reduce((a, v) => a + v.length, 0)); ctx.pending = null; }
    return true;
  }
  return false;
}
function pickChange(cb) {
  if (!cb.dataset?.imp) return false;
  const set = ui.imp.picked[cb.dataset.imp];
  cb.checked ? set.add(cb.value) : set.delete(cb.value);
  return true;
}

/* The first time, with another engine on this machine: which builder plain
   `docker build` uses. Keeping Docker's changes nothing, and is the default
   (Escape and the scrim mean it too). Settings → Builds switches it later. */
function buildAsk(engine) {
  if ($("bw-dlg")) return;
  if (document.querySelector('[aria-labelledby="welcome-title"]')) { ui.bwAsk = engine; return; }
  const e = esc(engine || "Docker");
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "bw-dlg";
  scrim.innerHTML = `<div class="dialog alert" role="dialog" aria-modal="true" aria-labelledby="bw-h">${alertIco("info")}<h3 id="bw-h">You already have ${e}. Which should build your images?</h3>
    <p class="bw-opt"><b>Keep building with Docker.</b> Nothing changes: <span class="mono">docker build</span> builds where it does now, and the images stay in ${e}.</p>
    <p class="bw-opt"><b>Build with Kiri.</b> <span class="mono">docker build</span> and <span class="mono">docker compose build</span> run on Kiri, and the images are in Kiri. ${e} won't see them; run them with Kiri.</p>
    <p class="bw-later">You can switch any time in Settings → Builds.</p>
    <div class="row-end"><span></span><span><button class="btn" data-bwpick="kiri">Build with Kiri</button> <button class="btn primary" data-bwpick="docker">Keep building with Docker</button></span></div></div>`;
  document.body.append(scrim);
  const pick = (v) => { scrim.remove(); document.removeEventListener("keydown", onKey); ui.bw = { ...(ui.bw || {}), with: v, ask: false }; send("buildwith", { value: v }); if (ui.view === "settings") render(); };
  const onKey = (ev) => { if (ev.key === "Escape") pick("docker"); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-bwpick]");
    if (b) pick(b.dataset.bwpick);
    else if (ev.target === scrim) pick("docker");
  });
  scrim.querySelector('[data-bwpick="docker"]').focus();
}

/* Settings → Builds: Kiri's builder, which Images and Volumes don't list: what
   it takes, and clearing its cache. Made on the first build, not before. */
function builderPref() {
  const img = ui.builderImage, vol = ui.builderVolume;
  if (!img && !vol) return `<div class="pref"><span class="t">Kiri's builder</span><span class="d">Not set up yet. It's made on your first build, which downloads BuildKit (about 110 MB) once.</span></div>`;
  const parts = [img ? `BuildKit ${size(img.Size)}` : "", vol ? "its build cache" : ""].filter(Boolean).join(" and ");
  return `<div class="pref"><span class="t">Kiri's builder</span><span class="d">${parts}. Not listed in Images or Volumes: it's docker build's machinery.</span>
    <button class="btn sm" data-buildprune${ui.bwPruning ? " disabled" : ""}>${ui.bwPruning ? "Clearing…" : "Clear build cache"}</button></div>`;
}

/* Settings → Builds: Docker's builder or Kiri's for plain `docker build`, at once. */
function buildsPane() {
  const b = ui.bw;
  if (!b) return `<div class="pane"><h3>Builds</h3><p class="muted">Loading…</p></div>`;
  if (b.error) return `<div class="pane"><h3>Builds</h3><p class="muted">${esc(b.error)}</p></div>`;
  const kiri = b.with === "kiri", e = b.engine ? esc(b.engine) : "";
  const cmd = (c) => `<span class="mono">${c}</span>`;
  const desc = kiri
    ? `${cmd("docker build")} and ${cmd("docker compose build")} run on Kiri, and the images are in Kiri, whichever engine docker uses.${e ? ` ${e} doesn't see them.` : ""}`
    : `${cmd("docker build")} builds wherever docker points${e ? `, so ${e}'s builds stay in ${e}` : ""}. When docker uses Kiri, builds run on Kiri.`;
  const note = kiri && !b.ready ? `<p class="muted">Kiri sets up its builder once its engine is running, and builds go to it from then on.</p>`
    : kiri && !b.taken ? `<p class="muted">Another builder has been picked for ${cmd("docker build")} since (${cmd("docker buildx use")}). Choose Kiri again to build on Kiri.</p>` : "";
  return `<div class="pane"><h3>Builds</h3>
    <div class="pref"><span class="t">Build with</span><span class="d">${desc}</span>
      <div class="seg" role="group" aria-label="Build with"><button data-bw="docker" aria-pressed="${!kiri}">Docker</button><button data-bw="kiri" aria-pressed="${kiri}">Kiri</button></div></div>
    ${note}
    ${builderPref()}
    <p class="muted">${cmd("kiri build")} always builds on Kiri. A switch applies at once, in terminals already open too. Switching back to Docker puts docker's build settings back as they were before Kiri changed them.</p>
  </div>`;
}

/* Settings → Network: the proxy for pulls and, if wanted, for containers. */
function networkPane() {
  const p = ui.proxy;
  if (!p) return `<div class="pane"><h3>Network</h3><p class="muted">Loading…</p></div>`;
  if (p.error) return `<div class="pane"><h3>Network</h3><p class="muted">Start Kiri to change its network settings. (${esc(p.error)})</p></div>`;
  const d = ui.pxDraft, eff = p.effective;
  const seg = [["system", `${OS} settings`], ["custom", "Custom"], ["none", "None"]].map(([v, l]) => `<button data-pxmode="${v}" aria-pressed="${d.mode === v}">${l}</button>`).join("");
  const now = eff.https || eff.http ? `In use: <span class="mono">${esc(eff.https || eff.http)}</span>${eff.no_proxy.length ? `, except <span class="mono">${esc(eff.no_proxy.join(", "))}</span>` : ""}.` : "No proxy is in use.";
  const field = (k, label, ph) => `<label class="pxf"><span>${label}</span><input class="field" id="px-${k}" value="${esc(d[k] || "")}" placeholder="${ph}" spellcheck="false" autocomplete="off"></label>`;
  return `<div class="pane"><h3>Network</h3>
    <div class="pref"><span class="t">Proxy</span><span class="d">For pulling and pushing images. ${d.mode === p.settings.mode ? now : ""}</span>
      <div class="seg" role="group" aria-label="Proxy">${seg}</div></div>
    ${d.mode === "system" && eff.pac ? `<p class="muted">${OS} uses an automatic proxy configuration (PAC) file, which Kiri can't follow. Choose Custom and enter the proxy.</p>` : ""}
    ${d.mode === "custom" ? `<div class="pxgrid">${field("http", "HTTP proxy", "proxy.example.com:3128")}${field("https", "HTTPS proxy", "proxy.example.com:3128")}${field("no_proxy", "Bypass for", "*.internal, registry.corp")}</div>` : ""}
    <div class="pref"><span class="t">Pass to containers</span><span class="d">New containers get <span class="mono">HTTP_PROXY</span>, <span class="mono">HTTPS_PROXY</span> and <span class="mono">NO_PROXY</span>.${WIN ? "" : ` A proxy on this Mac is reached as <span class="mono">host.docker.internal</span>.`}</span>
      <div class="seg" role="group" aria-label="Pass to containers"><button data-pxc="0" aria-pressed="${!d.containers}">Off</button><button data-pxc="1" aria-pressed="${!!d.containers}">On</button></div></div>
    <div class="res-foot"><span class="muted">${WIN ? "Container traffic leaves through WSL's network." : "VPNs need no setting: container traffic leaves through macOS."}</span><span style="flex:1"></span><button class="btn primary" data-savepx>Save</button></div>
  </div>`;
}

/* Settings → Resources: the most the Linux VM may use. */
const gb = (mib) => `${Math.round(mib / 1024)} GB`;
const cpuText = (n) => `${n} ${n === 1 ? "CPU" : "CPUs"}`;
/* How far along its track a slider's blue fill reaches, as CSS: to the
   middle of the thumb, which travels the track less its own 26 px. */
const rangeFill = (v, min, max) => {
  const f = max > min ? (v - min) / (max - min) : 0;
  return `calc(13px + (100% - 26px) * ${f.toFixed(4)})`;
};
const resChanged = () => ui.res && (ui.resDraft.cpus !== ui.res.cpus || ui.resDraft.memory_mib !== ui.res.memory_mib);
/* Settings › Resources: the engine's on/off, the same switch as the card. */
function enginePane() {
  const { shown } = engineShown(), off = shown === "stopped";
  const d = off ? "Off: press Start engine to run containers. It stays off after a restart until you start it."
    : shown === "running" ? "Running: it rests by itself when nothing runs and wakes when you use it."
    : shown === "booting" ? "Starting…" : shown === "stopping" ? "Stopping…" : "";
  const busy = shown === "booting" || shown === "stopping";
  const btn = off ? `<button class="btn primary" data-vmpower="start"${busy ? " disabled" : ""}>Start engine</button>`
    : `<button class="btn" data-vmpower="stop"${busy ? " disabled" : ""}>Turn off engine</button>`;
  return `<div class="pane"><h3>${VM}</h3><div class="pref"><span class="t">${vmLabels[shown] ?? "—"}</span><span class="d">${d}</span><span class="pact">${btn}</span></div></div>`;
}

function resourcesPane() {
  const r = ui.res;
  if (!r) return `<div class="pane"><h3>Resources</h3><p class="muted">Loading…</p></div>`;
  if (r.error) return `<div class="pane"><h3>Resources</h3><p class="muted">Start Kiri to change its resources. (${esc(r.error)})</p></div>`;
  const d = ui.resDraft;
  const maxGb = Math.max(1, Math.floor(r.max_memory_mib / 1024));
  const pending = r.awake && (r.running_cpus !== r.cpus || Math.abs(r.running_memory_mib - r.memory_mib) > 64);
  return `<div class="pane"><h3>Resources</h3>
    <div class="pref"><span class="t">CPUs</span><span class="d">Shared with ${OS}: the VM only uses them while containers are busy.</span>
      <div class="range"><input type="range" id="res-cpus" min="1" max="${r.max_cpus}" step="1" value="${d.cpus}" aria-label="CPUs" style="--fill:${rangeFill(d.cpus, 1, r.max_cpus)}"><span class="num" id="res-cpus-v">${cpuText(d.cpus)}</span></div></div>
    <div class="pref"><span class="t">Memory</span><span class="d">The most the VM may take. It uses memory only as containers need it and gives the rest back to ${OS}.</span>
      <div class="range"><input type="range" id="res-mem" min="1024" max="${maxGb * 1024}" step="1024" value="${Math.min(d.memory_mib, maxGb * 1024)}" aria-label="Memory" style="--fill:${rangeFill(Math.min(d.memory_mib, maxGb * 1024), 1024, maxGb * 1024)}"><span class="num" id="res-mem-v">${gb(d.memory_mib)}</span></div></div>
    ${r.overridden ? `<p class="muted">KIRI_CPUS or KIRI_MEMORY_MIB is set for the daemon, and it takes precedence over these.</p>` : ""}
    <div class="res-foot"><span class="muted">${r.awake ? `Running now with ${cpuText(r.running_cpus)} and up to ${gb(r.running_memory_mib)}.` : "The VM is asleep; it starts with these next time."}</span>
      <span style="flex:1"></span>
      ${pending ? `<button class="btn" id="res-restart" data-restartvm>Restart VM to apply</button>` : ""}
      <button class="btn primary" id="res-save" data-saveres${resChanged() ? "" : " disabled"}>Save</button></div>
    ${pending ? `<p class="muted">${esc(r.restart_note || "Restarting stops the running containers; start them again afterwards.")}</p>` : ""}
  </div>`;
}

      ? "On: running containers answer at <span class=mono>&lt;name&gt;.kiri.local</span>."
      : "Off: containers answer at <span class=mono>&lt;name&gt;.kiri.localhost</span>, which needs no setup."}</span>

/* A column given a sort key ([label, class, key]) sorts on click, and again

function table(head, rows, view, last = '<th class="r">Actions</th>') {
  const sort = ui.sort[view];
  // A column can say how it sizes ({ fixed: ch } for one whose longest value is known, { share } for
  // its part of the rest). A column that isn't fixed has a resize edge when one after it isn't either:
  // it moves the line to that column.
  const flex = (i) => !head[i]?.[3]?.fixed;
  const grip = (i) => (flex(i) && head.some((_, k) => k > i && flex(k)) ? `<span class="col-resize" data-col="${i}" title="Drag to resize, double-click to reset"></span>` : "");
  const size = (o) => (o?.fixed ? ` data-fixed="${esc(o.fixed)}" data-extra="${o.extra || 0}"` : o?.share ? ` data-share="${o.share}"` : "");
  const th = ([h, c, key, o], i) => {
    if (!key) return `<th class="${c || ""}"${size(o)}>${h}${grip(i)}</th>`;
    const on = sort?.key === key;
    return `<th class="sortable ${c || ""}" data-sort="${key}" data-sortview="${view}"${size(o)} aria-sort="${on ? (sort.desc ? "descending" : "ascending") : "none"}">${h}<span class="arrow">${on ? (sort.desc ? "↓" : "↑") : ""}</span>${grip(i)}</th>`;
  };

  // focus for its keys (⌘A, arrows, Space, Delete).
  morph($("content"), `<table data-view="${view}"${LISTS[view]?.bulk ? ' tabindex="0"' : ""}><thead><tr>${LISTS[view]?.bulk ? pickHead(view) : ""}${head.map(th).join("")}${last}</tr></thead><tbody>${rows.join("")}</tbody></table>`);

/* Resized columns. A table's widths are kept as shares of the room beside its last column (the

const headCells = (tbl) => { const cells = [...tbl.tHead.rows[0].cells].filter((th) => !th.classList.contains("ck")); return [cells, cells.pop()]; };

function sortBy(items, view, keys) {
  const s = ui.sort[view], get = keys[s?.key];

const match = (...fields) => !ui.filter || fields.some((f) => String(f || "").toLowerCase().includes(ui.filter.toLowerCase()));
// The tab is said too, when it narrows the list as well.

/* Published ports, each a link. The table shows the first and "+N more" for the
   rest, so one busy container does not stretch every row; the details pane
   lists them all. */
function ports(c, first) {
  const seen = new Set();
  const all = (c.Ports || []).filter((p) => p.PublicPort && !seen.has(p.PublicPort) && seen.add(p.PublicPort));
  const link = (p) => `<a class="port" data-open="http://localhost:${p.PublicPort}">${p.PublicPort}→${p.PrivatePort}</a>`;
  if (!first || all.length <= first) return all.map(link).join(" ");
  const rest = all.slice(first);
  return `${all.slice(0, first).map(link).join(" ")} <button class="port-more" data-detail="${esc(c.Id)}" title="${esc(rest.map((p) => `${p.PublicPort}→${p.PrivatePort}`).join("\n"))}">+${rest.length} more</button>`;

const CONTAINER_SORT = {
  name: (c) => c.Names[0].replace(/^\//, ""), image: (c) => c.Image, state: (c) => c.State,
  ports: (c) => Math.min(...(c.Ports || []).map((p) => p.PublicPort || Infinity), Infinity),
  size: (c) => (ui.images.find((i) => i.Id === c.ImageID) || ui.images.find((i) => (i.RepoTags || []).includes(c.Image)))?.Size || 0,
  created: (c) => c.Created || 0,
};
function renderContainers() {
  // Sorting orders the containers first; a Compose group then sits where its first member lands.
  const items = sortBy(listed("containers"), "containers", CONTAINER_SORT);
  if (!kept("containers").length) return renderEmpty("containers");
  if (!items.length) return noMatch();
  // A Compose project shows where its newest container would, as one group.
  const rows = [], seen = new Set();
  for (const c of items) {
    const project = c.Labels?.["com.docker.compose.project"];
    if (!project) { rows.push(containerRow(c)); continue; }
    if (seen.has(project)) continue;
    seen.add(project);
    const members = items.filter((x) => x.Labels?.["com.docker.compose.project"] === project);
    rows.push(groupRow(project, members));
    if (!ui.collapsed.has(project)) rows.push(...members.map((m, i) => containerRow(m, i === members.length - 1 ? "last" : true)));
  }

  if (share.length) share[0].push(undefined, { share: 1 });

}

function groupRow(project, members) {

  const open = !ui.collapsed.has(project);
  const p = esc(project);
  return `<tr class="row group" data-group="${p}" aria-expanded="${open}">${groupPick(members)}
    <td colspan="${shareOn() ? 7 : 6}" data-fill><div class="name"><span class="chev" aria-hidden="true">${open ? "▾" : "▸"}</span><div class="tile"><svg viewBox="0 0 256 256"><path d="${PH.stack}"/></svg></div>
      <div><b>${p}</b><div class="sub-name">Compose · ${running} of ${members.length} running</div></div></div></td>
    <td class="actions"><div class="acts-row">
      ${running < members.length ? ibtn("play", "Start all", `data-g="start" data-project="${p}"`, "go") : ""}
      ${running ? ibtn("stop", "Stop all", `data-g="stop" data-project="${p}"`, "halt") : ""}
      ${btn("⋯", `data-gmore="${p}" aria-label="More actions for ${p}" aria-haspopup="menu"`, "more")}
    </div></td></tr>`;
}

/* The project's box picks every container in it: ticked when all are, a dash when some are. */
function groupPick(members) {

  const pick = action === "start" ? members.filter((c) => c.State !== "running" && c.State !== "paused")

      ${pickCell("containers", c)}<td><div class="name" data-detail="${c.Id}">${member ? `<span class="tree${member === "last" ? " last" : ""}" aria-hidden="true"></span>` : ""}<div class="tile-wrap">${tile(c.icon, "cube")}${reach ? `<span class="kbadge" title="Reachable at ${esc(domain)}">${KDOT}</span>` : ""}</div><div title="${esc(name)}"><span class="link">${esc(name)}</span>${isKiriK8s(c) ? `<span class="k8s-mark" title="Kiri's Kubernetes cluster" aria-label="Kubernetes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${K8S_LOGO}"/></svg></span>` : ""}${reach ? `<div class="sub-name"><button class="sub-addr" data-open="${esc(domain)}" title="Open ${esc(domain)}">${esc(domain.replace(/^https?:\/\//, ""))}</button></div>` : `<div class="sub-name"${project && !member ? "" : ` title="${esc(c.Image)}"`}>${esc(project && !member ? project : refLabel(c.Image))}</div>`}</div></div></td>
      <td class="clip col-state">${statusPill(c)}</td>
      <td class="num nowrap">${ports(c, 1) || '<span class="muted">—</span>'}</td>
      ${shareOn() ? `<td class="col-share">${shareCell(c, name)}</td>` : ""}
      <td class="r num">${imageSize(c)}</td>
      <td class="muted col-created">${ago(c.Created)}</td>
      <td class="actions"><div class="acts-row">
        ${up ? ibtn("restart", "Restart", `data-c="restart" data-id="${c.Id}"`, enter)
          : ibtn("restart", "Start it to restart it", "disabled", "ghost")}
        ${up ? ibtn("stop", "Stop", `data-c="stop" data-id="${c.Id}"`, `halt ${enter}`)
          : ibtn("play", starting ? "Starting…" : "Start", `data-c="start" data-id="${c.Id}"`, starting ? "go rolling" : "go")}
        ${isKiriK8s(c) ? ibtn("trash", "Kubernetes is managed in Settings → Kubernetes", "data-ksettings", "locked")
          : ibtn("trash", "Remove", `data-c="remove" data-id="${c.Id}"`, "danger")}
        ${btn("⋯", `data-more="${c.Id}" aria-label="More actions for ${esc(name)}" aria-haspopup="menu"`, "more")}
      </div></td></tr>`;
}

/* The ⋯ menu: the actions that don't need a button of their own. */
function closeMenu() { document.querySelector(".menu")?.remove(); }
function openMenu(button, id, project) {
  closeMenu();
  const c = ui.containers.find((x) => x.Id === id);
  if (!c && !project) return;
  const items = project
    ? [["Restart all", `data-g="restart" data-project="${esc(project)}"`], ["Remove project", `data-g="remove" data-project="${esc(project)}"`, "danger"]]
    : [["Ports…", `data-ports="${id}"`]];
  if (project) return showMenu(button, items);
  // Open lives here now that the row's first button is Restart.
  const domain = c.State === "running" && c.Ports?.length ? localUrl(c, cname(c)) : "";
  if (domain) items.unshift([`Open ${esc(domain)}`, `data-open="${esc(domain)}"`]);
  if (c.State === "running") items.push(["Pause", `data-c="pause" data-id="${id}"`]);
  if (c.State === "paused") items.push(["Resume", `data-c="unpause" data-id="${id}"`]);
  // kiri-k8s goes with Kubernetes, in Settings, not from here.
  if (!isKiriK8s(c)) items.push(["Remove", `data-c="remove" data-id="${id}"`, "danger"]);
  showMenu(button, items);
}
function showMenu(button, items) {
  const menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "menu");
  menu.innerHTML = items.map(([label, attrs, cls]) => `<button role="menuitem" class="${cls || ""}" ${attrs}>${label}</button>`).join("");
  document.body.append(menu);
  // The text size zooms the page, so the button's place on screen and the
  // menu's left/top are in different units: k screen pixels per page pixel,
  // measured off the menu itself.
  const r = button.getBoundingClientRect();
  const k = menu.getBoundingClientRect().width / menu.offsetWidth || 1;
  const w = menu.offsetWidth * k, h = menu.offsetHeight * k;
  const left = Math.max(8, r.right - w), top = r.bottom + 4 + h > innerHeight ? r.top - h - 4 : r.bottom + 4;
  menu.style.left = `${left / k}px`;
  menu.style.top = `${top / k}px`;
  menu.querySelector("button")?.focus();
}
document.addEventListener("click", (ev) => {
  const item = ev.target.closest(".menu button");
  if (item) {
    if (item.dataset.ports) openPorts(item.dataset.ports);
    else if (item.dataset.c) containerAction(item.dataset.c, item.dataset.id);
    else if (item.dataset.g) projectAsk(item.dataset.project, item.dataset.g);

  }

});

$("content").addEventListener("scroll", closeMenu);

/* The size of the container's image, from the image list. */
function imageSize(c) {
  const img = ui.images.find((i) => i.Id === c.ImageID) || ui.images.find((i) => (i.RepoTags || []).includes(c.Image));
  return img ? size(img.Size) : '<span class="muted">—</span>';
}

/* The environment editor, in place of the list on the container's page.
   Docker can't change a container's environment; Kiri's engine can: it
   keeps the container and its files, and restarts it if it's running. */
const envSplit = (e) => { const i = e.indexOf("="); return i < 0 ? [e, ""] : [e.slice(0, i), e.slice(i + 1)]; };
function envOpen() {
  const d = ui.detail;
  d.env = [...(d.info?.Config?.Env || []).map((e) => { const [k, v] = envSplit(e); return { k, v, ok: k, ov: v }; }), { k: "", v: "" }];
  render();
  document.querySelector(".env-r:last-child input")?.focus();
}
function envEditor(rows) {
  const row = (r, i) => {
    const cls = r.del ? "del" : r.ok == null ? (r.k || r.v ? "new" : "") : r.k !== r.ok || r.v !== r.ov ? "chg" : "";
    const last = i === rows.length - 1 && r.ok == null && !r.k && !r.v;
    return `<div class="env-r ${cls}" data-envi="${i}"><input class="k" value="${esc(r.k)}" placeholder="NAME" spellcheck="false" aria-label="Name"${r.del ? " disabled" : ""}><input class="v" value="${esc(r.v)}" placeholder="value" spellcheck="false" aria-label="Value"${r.del ? " disabled" : ""}>${last ? "<span></span>" : `<button class="x" data-envx="${i}" title="${r.del ? "Keep" : "Remove"}">${r.del ? "Undo" : "×"}</button>`}</div>`;
  };
  return `<div class="env-ed">${rows.map(row).join("")}</div>
    <div class="env-foot"><span class="hint">Paste NAME=value lines, or a .env file, into a name.</span><span class="chg" id="env-chg">${envNote(rows)}</span>
      <button class="btn" data-envcancel>Cancel</button><button class="btn primary" data-envapply>Apply…</button></div>`;
}
function envChanges(rows) {
  const out = { add: [], chg: [], del: [] };
  for (const r of rows) {
    if (r.ok == null) { if (r.k && !r.del) out.add.push(r); }
    else if (r.del || !r.k) out.del.push(r);
    else if (r.k !== r.ok || r.v !== r.ov) out.chg.push(r);
  }
  return out;
}
function envNote(rows) {
  const c = envChanges(rows), n = c.add.length + c.chg.length + c.del.length;
  if (!n) return "No changes";
  const parts = [c.add.length && `${c.add.length} added`, c.chg.length && `${c.chg.length} changed`, c.del.length && `${c.del.length} removed`].filter(Boolean);
  return `<b>${n} change${n === 1 ? "" : "s"}</b> · ${parts.join(", ")}`;
}
/* Typing keeps focus: the row's colour and the count update in place; a
   new empty row appears once the last one is used. */
function envInput(ev) {
  const r = ev.target.closest("[data-envi]"), d = ui.detail;
  if (!r || !d?.env) return;
  const i = +r.dataset.envi, row = d.env[i];
  row[ev.target.classList.contains("k") ? "k" : "v"] = ev.target.value;
  if (i === d.env.length - 1 && (row.k || row.v)) {
    d.env.push({ k: "", v: "" });
    const pos = [ev.target.classList.contains("k") ? "k" : "v", ev.target.selectionStart];
    render();
    const el = document.querySelector(`[data-envi="${i}"] .${pos[0]}`);
    el?.focus(); el?.setSelectionRange(pos[1], pos[1]);
    return;
  }
  r.className = `env-r ${row.ok == null ? (row.k || row.v ? "new" : "") : row.k !== row.ok || row.v !== row.ov ? "chg" : ""}`;
  $("env-chg").innerHTML = envNote(d.env);
}
/* Pasting lines (a .env file) into a name fills one row each. */
function envPaste(ev) {
  const r = ev.target.closest("[data-envi]"), d = ui.detail;
  const text = ev.clipboardData?.getData("text/plain") || "";
  if (!r || !d?.env || !ev.target.classList.contains("k") || !/\n|=/.test(text)) return;
  ev.preventDefault();
  const lines = text.split(/\r?\n/).map((l) => l.trim()).filter((l) => l && !l.startsWith("#")).map((l) => l.replace(/^export\s+/, ""));
  for (const l of lines) {
    const [k, raw] = envSplit(l), v = raw.replace(/^(["'])(.*)\1$/, "$2");
    const same = d.env.find((x) => x.k === k && !x.del);
    if (same) same.v = v; else d.env.splice(d.env.length - 1, 0, { k, v });
  }
  render();
}
function envApply() {
  const d = ui.detail, rows = d.env, c = envChanges(rows);
  if (!(c.add.length + c.chg.length + c.del.length)) { d.env = null; return render(); }
  const bad = rows.find((r) => !r.del && r.k && /[\s=]/.test(r.k));
  if (bad) return toast("error", `"${bad.k}" can't be a name: names have no spaces or "=".`);
  const info = d.info, name = (info.Name || "").replace(/^\//, ""), up = !!info.State?.Running;
  const lbl = info.Config?.Labels || {}, compose = lbl["com.docker.compose.project"];
  const diff = [...c.chg.map((r) => `<span class="c">~ ${esc(r.k)}=${esc(r.v)} <span class="muted">(was ${esc(r.ok !== r.k ? `${r.ok}=${r.ov}` : r.ov)})</span></span>`),
    ...c.add.map((r) => `<span class="a">+ ${esc(r.k)}=${esc(r.v)}</span>`),
    ...c.del.map((r) => `<span class="d">- ${esc(r.ok)}=${esc(r.ov)}</span>`)].join("");
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog alert" role="dialog" aria-modal="true">${alertIco("info")}<h3>${up ? `Restart ${esc(name)} with the new environment?` : `Save ${esc(name)}'s new environment?`}</h3>
    <div class="env-diff">${diff}</div>
    <div class="keeps"><span><b>Kept:</b> the container itself, its files, image, ports, volumes, network and restart policy.</span>
      ${up ? `<span class="warn">It restarts, so open connections drop.</span>` : `<span>It takes effect when it next starts.</span>`}
      ${compose ? `<span class="warn">Compose project ${esc(compose)} made it: <span class="mono">docker compose up</span> puts back what the compose file says, so change it there too.</span>` : ""}</div>
    <div class="row-end"><span></span><span><button class="btn" data-close>Back to editing</button> <button class="btn primary" data-go>${up ? "Restart" : "Save"}</button></span></div></div>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim || ev.target.closest("[data-close]")) return close();
    if (!ev.target.closest("[data-go]")) return;
    send("env", { id: d.id, value: rows.filter((r) => r.k && !r.del).map((r) => `${r.k}=${r.v}`) });
