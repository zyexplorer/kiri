  const d = dgDate(iso), day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  const days = Math.round((day(new Date()) - day(d)) / 86400000);
  if (days === 0) return sentence ? `today at ${hm}` : `Today ${hm}`;
  if (days === 1) return sentence ? `yesterday at ${hm}` : `Yesterday ${hm}`;
  const date = d.toLocaleDateString([], { day: "numeric", month: "short" });
  return sentence ? `on ${date} at ${hm}` : `${date} ${hm}`;
}
const dgTime = (iso) => { const d = dgDate(iso); return isNaN(d) ? iso : `${d.toLocaleTimeString([], { hour12: false })}.${String(d.getMilliseconds()).padStart(3, "0")}`; };
// The search, marked in a piece of a line.
function dgMark(text) {
  if (!dg.find) return esc(text);
  const lower = text.toLowerCase(), q = dg.find.toLowerCase();
  let out = "", at = 0, i;
  while ((i = lower.indexOf(q, at)) >= 0) { out += `${esc(text.slice(at, i))}<mark>${esc(text.slice(i, i + q.length))}</mark>`; at = i + q.length; }
  return out + esc(text.slice(at));
}
const dgFields = (l) => Object.entries(l.fields || {}).map(([k, v]) => ` ${k}=${typeof v === "string" ? (/\s/.test(v) || !v ? JSON.stringify(v) : v) : JSON.stringify(v)}`);
const dgText = (l) => `${l.msg || ""}${dgFields(l).join("")}`;
function dgRow(l) {
  const lv = ["error", "warn", "info", "debug"].includes(l.level) ? l.level : "info";
  return `<div class="dg-row ${lv}${lv === "error" ? " hit" : ""}"><span class="t">${esc(dgTime(l.time))}</span><span class="lv">${lv.toUpperCase()}</span><span class="p">${DG_PART[l.part] || esc(l.part || "")}</span><span class="m">${dgMark(l.msg || "")}${dgFields(l).map((f) => `<span class="k">${dgMark(f)}</span>`).join("")}</span></div>`;
}
// A line as text, for Copy: local time, level, part, message and fields.
const dgPlain = (l) => `${dgTime(l.time)} ${(l.level || "").toUpperCase().padEnd(5)} ${(DG_PART[l.part] || l.part || "").padEnd(6)} ${dgText(l)}`;

/* Warn means warnings and errors, Info everything but debug: each level and worse. */
function dgVisible() {
  return (dg.lines || []).filter((l) => (dg.level !== "error" || l.level === "error") && (dg.level !== "info" || l.level !== "debug")
    && (!dg.find || dgText(l).toLowerCase().includes(dg.find.toLowerCase())));
}
function dgFetch() {
  send("diaglogs", { name: dg.part, id: dg.op, value: { errors: dg.level === "warn" || dg.level === "error", n: 500 } });
}
// Settings → Diagnostics opened: its crashes and log, then the log again every 2 s while it follows.
function diagOpen() { dg.lines = null; dg.shown = ""; send("diagcrashes"); dgFetch(); }
setInterval(() => { if (ui.view === "settings" && prefs.tab === "diagnostics" && dg.follow && !document.hidden) dgFetch(); }, 2000);

function drawDiagLog() {
  const el = $("dg-log");
  if (!el) return;
  const rows = dgVisible();
  const key = `${rows.length}|${rows.at(-1)?.time}|${rows[0]?.time}|${dg.find}`;
  $("dg-count").textContent = dg.lines ? `${rows.length} ${rows.length === 1 ? "line" : "lines"}` : "";
  if (key === dg.shown && el.childElementCount) return;
  dg.shown = key;
  const top = el.scrollTop;
  el.innerHTML = !dg.lines ? `<div class="dg-empty">Reading the log…</div>` : rows.length ? rows.map(dgRow).join("")
    : `<div class="dg-empty">${dg.find || dg.level || dg.part || dg.op ? "No lines match." : "Nothing logged yet."}</div>`;
  el.scrollTop = dg.follow ? el.scrollHeight : top;
}

function diagPane() {
  const levels = [["", "All levels"], ["error", "Errors"], ["warn", "Warnings and errors"], ["info", "Info and up"]];
  const crash = (c) => {
    const busy = dg.sending.has(c.name) || c.sending, open = dg.open.has(c.name);
    return `<div class="dg-crash" data-crashrow="${esc(c.name)}" aria-expanded="${open}">
      <button class="car" aria-label="${open ? "Hide" : "Show"} the crash report">${dgIcon("caret")}</button>
      <span class="when">${esc(dgWhen(c.time))}</span><span><span class="dg-part">${DG_PART[c.part] || esc(c.part)}</span></span>
      <span class="first" title="${esc(c.location ? `${c.message}\n${c.location}` : c.message || "")}">${esc(c.message || "(no message)")}</span>
      <span class="st">${c.sent ? `<span class="pill sent">Sent</span>${c.id ? `<span class="mono">${esc(c.id)}</span>${copyBtn(c.id, "report ID")}` : ""}`
        : busy ? `<span class="pill">Sending…</span>` : `<span class="pill">Not sent</span>${btn("Send", `data-crashsend="${esc(c.name)}"`)}`}</span>
    </div>${open ? `<pre class="dg-stack">${esc(c.text || "")}</pre>` : ""}`;
  };
  const crashes = dg.crashes == null ? `<div class="none">Looking for crash reports…</div>` : dg.crashes.length ? dg.crashes.map(crash).join("") : `<div class="none">No crashes. Kiri keeps a report here if one of its parts ever stops unexpectedly.</div>`;
  return `<div class="pane diag"><h3>Diagnostics</h3>
    <div class="pref"><span class="t">Send crash reports automatically</span>
      <span class="d">When part of Kiri crashes, the stack trace and the last 200 log lines before it go to Kiri Cloud, with Kiri's and the system's versions, the computer's model and a random ID for this install. Never your Kiri Cloud account, and nothing from inside your containers. Your home folder, image and container names, tokens and passwords are taken out.</span>
      <div class="seg" role="group" aria-label="Send crash reports automatically"><button data-dgauto="0" aria-pressed="${prefs.crashReports !== true}">Off</button><button data-dgauto="1" aria-pressed="${prefs.crashReports === true}">On</button></div></div>
    <div class="pref"><span class="t">Diagnostics report</span>
      <span class="d">Recent logs, crash reports and versions in one redacted file, for when something goes wrong.</span>
      <div class="dg-acts"><button class="btn sm" data-dgreport="save">Create report…</button><button class="btn sm" data-dgreport="send">${dgIcon("send")}Send to Kiri</button></div>
      ${dg.sent ? `<div class="dg-result">${dgIcon("checkcircle")}<span>Sent. Quote <span class="mono">${esc(dg.sent)}</span> if you write to us.</span>${copyBtn(dg.sent, "report ID")}</div>` : ""}</div>
    <h4 class="ksub">Recent crashes</h4>
    <div class="dg-crashes">${crashes}</div>
    <h4 class="ksub">Logs</h4>
    <div class="dg-logs">
      <div class="logbar">
        <div class="seg" role="group" aria-label="Part">${[["", "All"], ["ui", "Window"], ["daemon", "Engine"], ["cli", "CLI"]].map(([v, l]) => `<button data-dgpart="${v}" aria-pressed="${dg.part === v}">${l}</button>`).join("")}</div>
        <select id="dg-level" aria-label="Level">${levels.map(([v, l]) => `<option value="${v}"${dg.level === v ? " selected" : ""}>${l}</option>`).join("")}</select>
        <input class="field" id="dg-find" placeholder="Find in logs" spellcheck="false" autocomplete="off">
        ${dg.op ? `<span class="dg-chip">Action <span class="mono">${esc(dg.op)}</span><button data-dgop aria-label="Show all actions">${UPD_ICON.x}</button></span>` : ""}
        <span style="flex:1"></span>
        <label class="toggle"><input type="checkbox" id="dg-follow"${dg.follow ? " checked" : ""}> Follow</label>
      </div>
      <div class="dg-log" id="dg-log" role="log" aria-label="Kiri's log"></div>
      <div class="dg-logfoot"><span class="dg-live${dg.follow ? "" : " off"}"><i></i>${dg.follow ? "Live" : "Paused"}</span><span>·</span><span class="num" id="dg-count"></span>
        <span>· the newest 500 · up to 15 MB a part is kept</span>
        <span style="flex:1"></span><button class="btn sm" data-dgfolder>${dgIcon("folder")}Open logs folder</button></div>
    </div>
  </div>`;
}
// After the pane is drawn: the search keeps its text and focus across redraws.
function diagDrawn() {
  const f = $("dg-find");
  if (!f || f.dataset.bound) return;
  f.dataset.bound = "1"; f.value = dg.find;
  f.addEventListener("input", () => { dg.find = f.value; drawDiagLog(); });
  $("dg-level").addEventListener("change", (ev) => { dg.level = ev.target.value; dg.lines = null; drawDiagLog(); dgFetch(); });
  $("dg-follow").addEventListener("change", (ev) => { dg.follow = ev.target.checked; render(); if (dg.follow) dgFetch(); });
  dg.shown = ""; drawDiagLog();
}
function diagClick(t) {
  let el;
  if ((el = t("[data-dgpart]"))) { dg.part = el.dataset.dgpart; dg.lines = null; render(); dgFetch(); }
  else if ((el = t("[data-dgauto]"))) setPref("crashReports", el.dataset.dgauto === "1");
  else if ((el = t("[data-crashsend]"))) { dg.sending.add(el.dataset.crashsend); send("diagsendcrash", { name: el.dataset.crashsend }); render(); }
  else if (t("[data-dgop]")) { dg.op = ""; dg.lines = null; render(); dgFetch(); }
  else if ((el = t("[data-dgreport]"))) reportDialog(el.dataset.dgreport);
  else if (t("[data-dgfolder]")) send("diagfolder");
  else if ((el = t("[data-crashrow]")) && !t(".st button, .copy")) { const n = el.dataset.crashrow; dg.open.has(n) ? dg.open.delete(n) : dg.open.add(n); render(); }
  else return false;
  return true;
}
// Opens Settings → Diagnostics, on one action's lines or with a crash open.
function showDiag(op, crash) {
  prefs.tab = "diagnostics";
  if (op) { dg.op = op; dg.follow = false; dg.find = ""; dg.level = ""; dg.part = ""; }
  if (crash) dg.open.add(crash);
  show("settings");
  requestAnimationFrame(() => (op ? $("dg-log") : document.querySelector(".dg-crashes"))?.scrollIntoView({ block: "nearest" }));
}

/* Create report… (saved to the Desktop, shown in Finder) and Send to Kiri:
   what goes in first, the container list only when ticked. */
let rp = null;
function reportDialog(mode) {
  rp = { mode, state: "", containers: false, id: "", error: "", close: () => close() };
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "rp";
  document.body.append(scrim);
  drawReport();
  const close = () => { scrim.remove(); rp = null; document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("change", (ev) => { if (ev.target.dataset.rpopt != null) rp.containers = ev.target.checked; });
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim || ev.target.closest("[data-close]")) return close();
    if (ev.target.closest("[data-rpcopy]")) { send("copy", { name: rp.id }); ev.target.closest("button").innerHTML = `${dgIcon("check")}Copied`; }
    if (ev.target.closest("[data-rpgo]")) { rp.state = "busy"; rp.error = ""; send(rp.mode === "send" ? "diagsend" : "diagreport", { value: { containers: rp.containers } }); drawReport(); }
  });
  scrim.querySelector("[data-rpgo]")?.focus();
}
function drawReport() {
  const scrim = $("rp");
  if (!scrim || !rp) return;
  const send_ = rp.mode === "send", done = rp.state === "sent";
  const item = (t, d) => `<div class="rp-item">${dgIcon("check")}<span class="t">${t}</span><span class="d">${d}</span></div>`;
  scrim.innerHTML = `<div class="dialog rp-dialog" role="dialog" aria-modal="true" aria-labelledby="rp-t">
    <h3 id="rp-t">${send_ ? "Send a report to Kiri" : "Create a diagnostics report"}</h3>
    <p>${send_ ? "We get the file below, redacted, and you get an ID to quote when you write to us. If you're signed in to Kiri Cloud, it says it's from you, so we can reply." : "One text file, redacted, saved to your Desktop and shown in Finder. Read it before you share it."}</p>
    <div class="rp-list">${item("Kiri's logs", "The last 300 lines from the window, the engine and kiri commands, and the engine's own output")}
      ${item("Crash reports", "The 5 newest, and macOS's own crash reports for Kiri from the last 30 days")}
      ${item("Kiri and this Mac", "Versions, macOS, whether the engine runs, how many containers and images")}
      <label class="rp-item opt"><input type="checkbox" data-rpopt${rp.containers ? " checked" : ""}${rp.state ? " disabled" : ""}><span class="t">Container list</span><span class="d">Names, images and status. Not their files, logs or environment.</span></label></div>
    <div class="rp-red">${dgIcon("shieldcheck")}<span>Your home folder's path, tokens, passwords and other secrets are blanked before anything is written.</span></div>
    ${done ? `<div class="rp-id"><span class="lab">Report ID</span><span class="val">${esc(rp.id)}</span><button class="btn sm" data-rpcopy>${dgIcon("copy")}Copy</button></div>` : ""}
    ${rp.error ? `<p class="err">${send_ ? "Couldn't send it" : "Couldn't save it"}: ${esc(rp.error)}</p>` : ""}
    <div class="row-end"><span></span><span>${done ? `<button class="btn primary" data-close>Done</button>`
      : `<button class="btn" data-close>Cancel</button> <button class="btn primary" data-rpgo${rp.state === "busy" ? " disabled" : ""}>${rp.state === "busy" ? (send_ ? "Sending…" : "Saving…") : rp.error ? "Try again" : send_ ? "Send" : "Save to Desktop"}</button>`}</span></div></div>`;
}

/* The card after a crash, in the update card's place (an update offer goes
   first). `lastcrash` says which crash; Send report sends that file. */
function crashCard() {
  const c = ui.crash;
  if (!c || c.hidden) return "";
  const who = DG_WHO[c.part] || "Part of Kiri", when = dgWhen(c.time, true);
  const title = c.part === "cli" ? "A kiri command crashed" : "Kiri quit unexpectedly last time";
  const more = c.count > 1 ? ` That's ${c.count} crashes since Kiri last opened.` : "";
  const head = (ic, h, sub) => `<div class="updcard" role="dialog" aria-label="${esc(h)}">
    <div class="head"><div class="ic ${ic}">${dgIcon(ic === "ok" ? "checkcircle" : "warning")}</div><div class="txt"><h4>${esc(h)}</h4><div class="sub">${sub}</div></div>
    <button class="close" data-crashcard="close" aria-label="Close">${UPD_ICON.x}</button></div>`;
  if (c.id || c.state === "sent") return `${head("ok", "Report sent", `Quote <span class="mono">${esc(c.id)}</span> if you write to us about this crash.`)}
    <div class="row">${btn(`${dgIcon("copy")}Copy ID`, 'data-crashcard="copy"')}<button class="lnk" data-crashcard="view">Details</button></div></div>`;
  if (c.sent || (c.crashReports && c.state !== "error")) return `${head("calm", title, `${who} stopped ${esc(when)}.${more} Crash reports are sent automatically, so this one goes to Kiri too.`)}
    <div class="row"><button class="lnk" data-crashcard="view">Details</button></div></div>`;
  return `${head("calm", title, `${who} stopped ${esc(when)}.${more} A report helps us fix it: the stack trace and the last 200 log lines before it, with your home folder and tokens blanked.`)}
    ${c.error ? `<div class="err">Couldn't send it: ${esc(c.error)}</div>` : ""}
    <label class="opt"><input type="checkbox" data-crashcard="auto"${c.always ? " checked" : ""}> Always send crash reports</label>
    <div class="row">${btn(c.state === "busy" ? "Sending…" : c.error ? "Try again" : "Send report", `data-crashcard="send"${c.state === "busy" ? " disabled" : ""}`, "primary")}${btn("Not now", 'data-crashcard="close"')}<button class="lnk" data-crashcard="view">Details</button></div></div>`;
}
function crashCardAction(a, el) {
  const c = ui.crash;
  if (!c) return;
  if (a === "close") c.hidden = true;
  else if (a === "send") { if (c.always) setPref("crashReports", true); Object.assign(c, { state: "busy", error: "" }); send("diagsendcrash", { name: c.name }); }
  else if (a === "copy") { send("copy", { name: c.id }); copiedBtn(el); }
  else if (a === "view") { c.hidden = true; showDiag("", c.name); }
  renderUpdate();
}

/* An error's Details: the lines its action logged, in the window and the engine. */
let dt = null;
function detailsDialog(text, op) {
  const cut = text.indexOf(": ");
  dt = { op, title: cut > 0 ? text.slice(0, cut) : "Something went wrong", why: cut > 0 ? text.slice(cut + 2) : text, lines: null, state: "", id: "", error: "" };
  const scrim = document.createElement("div");
  scrim.className = "scrim"; scrim.id = "dt";
  document.body.append(scrim);
  drawDetails();
  send("diaglogs", { name: "", id: op, value: { errors: false, n: 200 } });
  const close = () => { scrim.remove(); dt = null; document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim) return close();
    const b = ev.target.closest("[data-dt]");
    if (!b) return;
    const a = b.dataset.dt;
    if (a === "close") close();
    else if (a === "copy") { send("copy", { name: [text, ...(dt.lines || []).map(dgPlain)].join("\n") }); b.innerHTML = `${dgIcon("check")}Copied`; }
    else if (a === "copyid") { send("copy", { name: dt.id }); b.innerHTML = `${dgIcon("check")}Copied`; }
    else if (a === "send") { Object.assign(dt, { state: "busy", error: "" }); send("diagsend", { value: { containers: false } }); drawDetails(); }
    else if (a === "diag") { close(); showDiag(op); }
  });
  scrim.querySelector('[data-dt="close"].primary')?.focus();
}
function drawDetails() {
  const scrim = $("dt");
  if (!scrim || !dt) return;
  const n = dt.lines?.length ?? 0, parts = [...new Set((dt.lines || []).map((l) => DG_PART[l.part] || l.part))].join(" and ").toLowerCase();
  scrim.innerHTML = `<div class="dialog dt-dialog" role="dialog" aria-modal="true" aria-labelledby="dt-t">
    <div class="dt-head"><span class="ic">${dgIcon("xcircle")}</span><h3 id="dt-t">${esc(dt.title)}</h3><p>${esc(dt.why[0].toUpperCase() + dt.why.slice(1))}</p>
      <button class="close" data-dt="close" aria-label="Close">${UPD_ICON.x}</button></div>
    <div class="dt-meta">${dt.lines?.[0] ? `<span>${esc(dgWhen(dt.lines[0].time))}</span>` : ""}<span>Action <span class="mono">${esc(dt.op)}</span></span>
      <span>${dt.lines ? `${n} log ${n === 1 ? "line" : "lines"}${n ? ` from the ${parts}` : ""}` : "Reading the log…"}</span></div>
    <div class="dt-body"><div class="dg-log" role="log" aria-label="Log lines for this action">${!dt.lines ? `<div class="dg-empty">Reading the log…</div>` : n ? dt.lines.map(dgRow).join("") : `<div class="dg-empty">This action left no log lines.</div>`}</div></div>
    <div class="dt-foot"><button class="lnk" data-dt="diag">Show in Diagnostics</button>
      ${dt.error ? `<span class="err">Couldn't send it: ${esc(dt.error)}</span>` : ""}
      ${dt.state === "sent" ? `<span class="ok">${dgIcon("checkcircle")}Sent as <span class="mono">${esc(dt.id)}</span></span>${btn(`${dgIcon("copy")}Copy ID`, 'data-dt="copyid"')}`
        : `${btn(`${dgIcon("copy")}Copy`, 'data-dt="copy"')}${btn(`${dgIcon("send")}${dt.state === "busy" ? "Sending…" : "Send report"}`, `data-dt="send"${dt.state === "busy" ? " disabled" : ""}`)}`}
      ${btn("Close", 'data-dt="close"', "primary")}</div>
  </div>`;
}

/* The diagnostics events. */
function diagEvent(e) {
  switch (e.type) {
    case "diaglogs":
      if (dt && e.op === dt.op && !e.part) { dt.lines = e.lines || []; drawDetails(); }
      if (dg.copyOp && e.op === dg.copyOp) { send("copy", { name: [dg.copyText, ...(e.lines || []).map(dgPlain)].join("\n") }); dg.copyOp = ""; }
      if (e.part === dg.part && e.op === dg.op) { dg.lines = e.lines || []; drawDiagLog(); }
      break;
    case "diagcrashes":
      dg.crashes = e.crashes || [];
      for (const c of dg.crashes) if (c.sent) dg.sending.delete(c.name);
      if (ui.view === "settings") render();
      break;
    case "diagsendcrash":
      dg.sending.delete(e.name);
      if (ui.crash?.name === e.name) { Object.assign(ui.crash, e.id ? { state: "sent", id: e.id, hidden: false } : { state: "error", error: e.error }); renderUpdate(); }
      else if (e.error) toast("error", `Couldn't send the crash report: ${e.error}`);
      send("diagcrashes");
      break;
    case "diagsend":
      if (e.id) dg.sent = e.id;
      if (rp?.mode === "send") { Object.assign(rp, e.id ? { state: "sent", id: e.id } : { state: "", error: e.error }); drawReport(); }
      if (dt?.state === "busy") { Object.assign(dt, e.id ? { state: "sent", id: e.id } : { state: "", error: e.error }); drawDetails(); }
      if (ui.view === "settings") render();
      break;
    case "diagreport":
      if (rp?.mode === "save") { if (e.path) rp.close(); else { Object.assign(rp, { state: "", error: e.error }); drawReport(); } }
      if (e.path) toast("ok", `Saved the report to ${e.path}`); else if (!rp) toast("error", `Couldn't save the report: ${e.error}`);
      break;
    case "lastcrash": ui.crash = { ...e, state: "", always: false }; renderUpdate(); break;
  }
}

window.kiri = {
  on(e) {
    switch (e.type) {
      case "state": setVm(e.state, e.error); break;
      case "vm":
        setText($("vm-running"), String(e.running ?? "—"));
        // The CPUs, and how busy they are together (an engine from before that reading sends none).
        // How busy, then how many: "4% · 1".
        setHTML($("vm-cpus"), e.cpus == null ? "—" : `${e.awake && e.cpu_pct != null ? `<span class="pct">${pct(e.cpu_pct)} · </span>` : ""}${e.cpus}`);
        // What the VM uses, of the most it may; asleep, it holds none.
        ui.mem = { used: e.awake ? e.used_mib : 0, target: e.awake ? e.target_mib : 0, ceiling: e.ceiling_mib, stall: e.awake ? e.stall_pct || 0 : 0 };
        oomCount(e.awake ? e.oom_kills : null);
        renderStatus();
        setText($("vm-mem"), `${memText(ui.mem.used)} / ${(e.ceiling_mib / 1024).toFixed(0)} GB`);
        if ($("vm-mem").title !== memTitle()) $("vm-mem").title = memTitle();
        const meter = `${(ui.mem.used / e.ceiling_mib * 100).toFixed(1)}%`;
        if ($("vm-meter").style.width !== meter) $("vm-meter").style.width = meter;
        break;
      case "lists":
        // Run's look at an image's start script makes a container it never starts; and
        // docker build's BuildKit workers (buildx names them buildx_buildkit_<builder>N) are
        // the build machinery, not containers anyone ran: neither is listed. Nor is the

   has no Filter box of its own). Esc clears it; ⌘K / Ctrl+K and ⌘F / Ctrl+F
   go to it. */
$("gq").addEventListener("input", (ev) => { ui.filter = ev.target.value.trim(); render(); });
$("gq").addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") { ev.target.value = ""; ui.filter = ""; ev.target.blur(); render(); }
});
document.addEventListener("keydown", (ev) => {
  if ((WIN ? ev.ctrlKey : ev.metaKey) && !ev.altKey && !ev.shiftKey && (ev.key.toLowerCase() === "k" || ev.key.toLowerCase() === "f")) {
    ev.preventDefault();
    // In a container's logs, ⌘F finds in the logs.
    const f = ev.key.toLowerCase() === "f" && $("log-filter")?.isConnected ? $("log-filter") : $("gq");
    f.focus(); f.select();
  }
});
$("vm-toggle").addEventListener("click", () => powerEngine(engineShown().shown === "running" ? "stop" : "start"));

/* Window chrome: a mouse-down on empty header or sidebar space drags the
   window, and a double-click zooms it, like a native title bar. */
/* Not `chrome`: WebView2 has a window.chrome that older runtimes make
   non-configurable, and redeclaring it is a SyntaxError for this whole script. */
const dragArea = ".strip, .toolbar, aside, .navlabel, .toolbar h2, .toolbar .sub, .toolbar .spacer";
const interactive = "button, input, a, select, textarea, nav, .vm, .gfind";
document.addEventListener("mousedown", (ev) => {
  if (ev.button !== 0 || ev.detail > 1) return;
  const t = ev.target;
  if (t.closest(interactive) || !t.closest(dragArea)) return;
  ev.preventDefault();
  send("drag");
});
document.addEventListener("dblclick", (ev) => {
  const t = ev.target;
  if (!t.closest(interactive) && t.closest(dragArea)) send("zoom");
});

/* --- Kubernetes: Pods and Services ---------------------------------------------------
   The kiri-k8s cluster, as ui/k8s.rs reads it with kubectl inside the node
   container. Read every 3 s while Pods or Services shows; otherwise only for
   the sidebar's counts, every 30 s, and only while the node runs (the VM is
   awake for it then anyway). Nothing here starts the cluster but Start. */
const K8S_VIEWS = new Set(["pods", "services"]);
const k8s = { state: null, ready: false, pods: [], services: [], icon: null, asked: 0, sig: "", detail: null, svc: null, partial: "",
  op: "", opAt: 0, opLine: "", context: "", config: null, sanDraft: null, port: null, wantPort: 6443, portDraft: null };
empty.pods = { title: "No pods", body: "Pods you create with <code>kubectl</code> show up here, grouped by namespace.", art: "pods" };
empty.services = { title: "No services", body: "Services you create with <code>kubectl expose</code> show up here. LoadBalancer services answer on <code>localhost</code>.", art: "services" };
// The system's own pods start folded away.
ui.collapsed.add("ns:kube-system");
const k8sContext = () => k8s.context || (ui.status?.dev ? "kiri-dev" : "kiri");
/* The Mac address of the API server, from the node's real port binding. */
const k8sApi = () => (k8s.port ? `127.0.0.1:${k8s.port}` : "");
const k8sMoved = () => (k8s.port && k8s.port !== k8s.wantPort ? ` (${k8s.wantPort} was in use)` : "");
const k8sCopy = (text) => send("k8s", { action: "copy", value: { text } });
const k8sNode = () => ui.containers.find((c) => c.Names?.[0] === "/kiri-k8s");
/* The cluster is looked at: Pods, Services, or Settings → Kubernetes. */
const k8sShown = () => K8S_VIEWS.has(ui.view) || (ui.view === "settings" && prefs.tab === "kubernetes");
function k8sAsk(force = false) {
  if (!force && Date.now() - k8s.asked < 2500) return;
  k8s.asked = Date.now();
  send("k8s", { action: "list" });
}
function k8sCounts() {
  const on = k8s.state === "running" && k8s.ready;
  $("n-pods").textContent = on ? k8s.pods.length : "";
  $("n-services").textContent = on ? k8s.services.length : "";
}
const OP_WORDS = { start: "Starting…", stop: "Stopping…", set: "Restarting…", deletecluster: "Deleting…" };
/* Settings, at its Kubernetes section. */
function k8sSettings() {
  closePod();
  prefs.tab = "kubernetes";
  show("settings");
  document.querySelector("#content .pane")?.scrollIntoView({ block: "start" });
}
/* Short enough for the group label's row: a restart is a start there. */
const SIDE_WORDS = { start: "Starting", stop: "Stopping", set: "Starting", deletecluster: "Deleting" };
/* The group's status line: from the container list, so it never wakes the VM. */
function k8sSide() {
  const el = $("k8s-side"), node = k8sNode();
  if (!el) return;
  // A dot and a word, in the label's own letters; the context and port are in the card below and in Settings.
  const html = k8s.op ? `<i class="busy"></i>${SIDE_WORDS[k8s.op]}` : node?.State === "running" ? `<i class="on"></i>On` : `<i></i>Off`;
  if (el.innerHTML !== html) el.innerHTML = html;
  el.title = k8s.op ? "" : node?.State === "running" ? `Running: kubectl --context ${k8sContext()}` : "Kubernetes isn't running";
  // The VM card's line, while there is a cluster.
  const vm = $("vm-k8s"), line = k8s.op ? `<i class="busy"></i><span>${OP_WORDS[k8s.op]}</span>` : node?.State === "running" ? `<i class="on"></i><span>On${k8s.port ? ` · :${k8s.port}` : ""}</span>` : node ? `<i></i><span>Stopped</span>` : "";
  vm.hidden = $("vm-k8s-l").hidden = !line;
  if (vm.innerHTML !== line) vm.innerHTML = line;
  vm.title = node?.State === "running" && k8s.port ? `Running · API on ${k8sApi()}${k8sMoved()} · kubectl --context ${k8sContext()}` : "";
}
setInterval(() => {
  k8sSide();
  if (ui.vm === "stopped") return;
  if (k8sShown()) { if (!document.hidden) k8sAsk(); return; }
  const node = k8sNode();
  if (node?.State === "running") { if (Date.now() - k8s.asked > 30000) k8sAsk(); }
  else if (k8s.state === "running") { k8s.state = node?.State || "absent"; k8s.ready = false; k8sCounts(); }
}, 3000);
// Ages count on without a redraw.
setInterval(() => {
  for (const el of document.querySelectorAll("[data-kage]")) {
    const text = since(Date.parse(el.dataset.kage) / 1000);
    if (el.textContent !== text) el.textContent = text;
  }
}, 5000);

function k8sOn(e) {
  const d = k8s.detail;
  switch (e.type) {
    case "k8s": {
      // A list read just before a button was pressed doesn't end its command.
      k8s.op = e.op || (Date.now() - k8s.opAt < 4000 ? k8s.op : "");
      if (!k8s.op) k8s.opLine = "";
      Object.assign(k8s, { state: e.state, ready: !!e.ready, error: e.error || "", context: e.context || k8s.context, config: e.config || k8s.config });
      if ("port" in e) k8s.port = e.port;
      if (e.want_port) k8s.wantPort = e.want_port;
      if (e.ready) { Object.assign(k8s, { pods: e.pods || [], services: e.services || [], icon: e.icon }); kGone(); }
      k8sCounts();
      k8sSide();
      // Only a change redraws, so hovering a row or typing in the filter is left alone.
      const sig = JSON.stringify([e.state, e.ready, k8s.op, e.config, k8s.port, e.pods, e.services]);
      if (sig === k8s.sig || !k8sShown()) { k8s.sig = sig; break; }
      k8s.sig = sig;
      if (d?.tab === "logs" && podOf(d) && K8S_VIEWS.has(ui.view)) { const pill = $("kpod-pill"); if (pill) pill.outerHTML = podPill(podOf(d), "kpod-pill"); break; }
      render();
      break;
    }
    case "k8sop":
      if (e.state === "progress") {
        k8s.opLine = e.line.endsWith("…") || e.line.endsWith(".") || e.line.endsWith(")") ? e.line : `${e.line}…`;
        if (k8sShown()) { const el = $("k8s-step"); if (el) el.textContent = k8s.opLine; else render(); }
        break;
      }
      k8s.op = ""; k8s.opLine = ""; k8s.opAt = 0; k8s.sanDraft = null; k8s.portDraft = null;
      if (e.port) k8s.port = e.port;
      if (e.want_port) k8s.wantPort = e.want_port;
      if (e.state === "error") toast("error", `Kubernetes: ${e.error}`);
      else if ((e.op === "start" || e.op === "set") && e.port) toast("ok", `Kubernetes is running · API on ${k8sApi()}${k8sMoved()}`);
      if (e.state !== "error" && e.op === "start") starMoment("Kubernetes is running.");
      else toast("ok", { start: `Kubernetes is running: kubectl --context ${e.context}`, stop: "Kubernetes stopped. Its state is kept for the next start.",
        set: "Kubernetes settings saved. They apply when it next starts.", deletecluster: "Kubernetes deleted, with its state" }[e.op] || "Done");
      k8sSide();
      k8sAsk(true);
      if (k8sShown()) render();
      break;
    case "k8slogs": if (d?.logKey === e.key) addKLogs(e.parts); break;
    case "k8slogs-end":
      if (d?.logKey === e.key) {
        const div = document.createElement("div");
        div.className = "quiet";
        div.textContent = d.previous ? "— the end of the run before the last restart —" : "— the log stream ended —";
        klogEl.append(div);
        d.logsOn = false;
      }
      break;
  }
}

/* start, stop, set or deletecluster: `kiri k8s …` in the background, with its progress. */
function k8sDo(op, value) {
  if (k8s.op) return;
  Object.assign(k8s, { op, opAt: Date.now(), opLine: op === "start" ? "Starting Kubernetes…" : OP_WORDS[op] });
  send("k8s", { action: op, value });
  k8sSide();
  render();
}

function renderK8s() {
  k8sAsk();
  $("subtitle").textContent = "";
  if (k8s.state !== "running" || !k8s.ready) k8sOff();
  else if (ui.view === "pods" && k8s.detail) renderPod();
  else if (ui.view === "pods") renderPods();
  else if (k8s.svc) renderSvc(); else renderServices();
  $("content").insertAdjacentHTML("afterbegin", k8sMem());
}

/* Kubernetes wants about 2 GB. When the VM can't give it that, or its memory
   is nearly all used, say so on every Kubernetes view: a starved API server
   just stops answering, which otherwise looks like Kiri being flaky. */
const K8S_MIB = 2048;
function k8sMem() {
  const m = ui.mem, node = k8sNode();
  if (!m?.ceiling || node?.State !== "running") return "";
  if (memOut()) return oomLine("Kubernetes is out of memory", `Its API server stalls or stops answering · ${memFree()}`);
  const small = m.ceiling < K8S_MIB, full = m.used && m.used / m.ceiling >= 0.9;
  if (!small && !full) return "";
  const why = small
    ? `Kubernetes needs about ${memText(K8S_MIB)}, and this VM can use ${memText(m.ceiling)}${m.used ? `, of which ${memText(m.used)} is in use` : ""}.`
    : `The VM's memory is nearly full: ${memText(m.used)} of ${memText(m.ceiling)}.`;
  return `<div class="kmem" role="status"><svg class="i" viewBox="0 0 256 256"><path d="${PH.warning}"/></svg>
    <span><b>Kubernetes is short of memory.</b> ${why} Short of memory, its API server slows down or stops answering.</span>
    <button class="btn sm" data-kres>${small ? "Give the VM more memory" : "Resources"}</button></div>`;
}

/* Not running, starting, or not answering yet: what there is to do about it. */
function k8sOff() {
  const starting = k8s.op === "start" || k8s.op === "set";
  const busy = !!k8s.op || k8s.state === "running";
  // Up for a while but not answering: say so, rather than "starting" for ever.
  const stuck = !k8s.op && k8s.state === "running" && k8sNode()?.KiriStartedAt < Date.now() / 1000 - 120;
  const title = k8s.state === null ? "Looking for Kubernetes…" : stuck ? "Kubernetes isn't answering"
    : k8s.op === "stop" ? "Kubernetes is stopping" : k8s.op === "deletecluster" ? "Deleting Kubernetes" : busy ? "Kubernetes is starting" : "Kubernetes is off";
  const body = k8s.state === null ? ""
    : stuck ? `Its node runs, but the API server doesn't answer${k8s.error ? `: <span class="mono">${esc(k8s.error)}</span>` : ""}. A busy or memory-starved VM can do this; Kiri keeps asking.`
    : starting || (busy && !k8s.op) ? "A single-node cluster (k3s) in one container. It takes about 20 s, longer the first time, while k3s downloads."
    : busy ? ""
    : `Start a single-node cluster (k3s) in one Kiri container. Its API is on <code>127.0.0.1:${k8s.wantPort}</code> (or the next free port), and kubectl gets the <code>${esc(k8sContext())}</code> context, as with <code>kiri k8s start</code>.`;
  const settings = '<p class="kstep"><button class="linkish" data-ksettings>Kubernetes settings</button></p>';
  const action = k8s.state === null ? ""
    : stuck ? settings
    : busy ? `<div class="kstep" id="k8s-step">${esc(k8s.opLine || "Waiting for the API server…")}</div><div class="stripe"></div>`
    : `<button class="btn primary" data-kstart>Start Kubernetes</button>${settings.replace('class="kstep"', 'class="kstep klink"')}`;
  $("content").innerHTML = `<div class="empty"><div><svg class="i art" viewBox="0 0 256 256"><path d="${PH.pods}"/></svg>
    <h3>${title}</h3>${body ? `<p>${body}</p>` : ""}${action}</div></div>`;
}

/* Settings → Kubernetes: the cluster on or off, its network, and Delete. */
function kubernetesPane() {
  k8sAsk();
  const node = k8sNode(), on = node?.State === "running", op = k8s.op;
  const version = node ? (node.Image.split(":")[1] || "").replace(/-k3s\d+$/, "") : "";
  const state = op ? OP_WORDS[op] : on ? `Running · k3s ${esc(version)}${k8s.port ? ` · API on ${k8sApi()}${esc(k8sMoved())}` : ""}` : node ? "Stopped" : "Not created yet";
  const portDraft = k8s.portDraft ?? String(k8s.wantPort);
  const nodes = `kubectl --context ${k8sContext()} get nodes`;
  const cfg = k8s.config || { lan: false, tls_san: [] };
  const draft = k8s.sanDraft ?? (cfg.tls_san || []).join(", ");
  const dis = op ? " disabled" : "";
  const seg = (attr, value, label) => `<div class="seg" role="group" aria-label="${label}"><button ${attr}="0" aria-pressed="${!value}"${dis}>Off</button><button ${attr}="1" aria-pressed="${!!value}"${dis}>On</button></div>`;
  return `<div class="pane"><h3>Kubernetes</h3>
    <div class="pref"><span class="t">Kubernetes cluster</span>
      <span class="d"><span class="kstate"><i class="${op ? "busy" : on ? "on" : ""}"></i>${state}</span>${op && k8s.opLine ? ` · <span id="k8s-step">${esc(k8s.opLine)}</span>` : ""}<br>
        A single-node cluster (k3s) in one container, for kubectl's <span class="mono">${esc(k8sContext())}</span> context. Off stops it and keeps its state.</span>
      ${seg("data-k8son", op ? op === "start" || op === "set" : on, "Kubernetes cluster")}</div>
    ${node && k8s.port ? `<div class="pref"><span class="t">API server</span><span class="d"><span class="mono kaddr">https://${esc(k8sApi())}</span>${esc(k8sMoved())}</span>
      <button class="btn" data-kcopy="https://${esc(k8sApi())}">Copy</button></div>` : ""}
    ${node ? `<div class="pref"><span class="t">kubectl context</span><span class="d"><span class="mono kaddr">${esc(nodes)}</span></span>
      <button class="btn" data-kcopy="${esc(nodes)}">Copy</button></div>` : ""}
    <h4 class="ksub">Network</h4>
    <div class="pref"><span class="t">Expose services to LAN</span><span class="d">${cfg.lan
      ? "On: the API server and LoadBalancer services answer on every network interface, so other devices on your network can reach them."
      : `Off: the API server and LoadBalancer services answer on this ${HOST} only (127.0.0.1).`} Changing it restarts the cluster.</span>
      ${seg("data-k8slan", cfg.lan, "Expose services to LAN")}</div>
    <div class="pref"><span class="t">API server port</span><span class="d">The port on this ${HOST} for the API server, from 1024 to 65535 (6443 by default). If it's in use when the cluster starts, the next free one is taken. Saving restarts the cluster and updates the <span class="mono">${esc(k8sContext())}</span> context.</span>
      <div class="ksan"><input class="field mono kport" id="k8s-port" type="number" min="1024" max="65535" value="${esc(portDraft)}" spellcheck="false" autocomplete="off"${dis}>
        <button class="btn" data-k8sport${dis || portDraft === String(k8s.wantPort) ? " disabled" : ""}>Save</button></div></div>
    <div class="pref"><span class="t">Additional certificate names</span><span class="d">IP addresses or domain names, separated by commas, that the API server's certificate also covers, such as this ${HOST}'s address on your network. Saving restarts the cluster.</span>
      <div class="ksan"><input class="field mono" id="k8s-san" value="${esc(draft)}" placeholder="192.168.1.20, my-mac.local" spellcheck="false" autocomplete="off"${dis}>
        <button class="btn" data-k8ssan${dis || draft === (cfg.tls_san || []).join(", ") ? " disabled" : ""}>Save</button></div></div>
    <div class="pref"><span class="t">Delete cluster</span><span class="d">Removes the cluster's container, everything in it (the <span class="mono">kiri-k8s</span> volume) and the <span class="mono">${esc(k8sContext())}</span> kubectl context, as <span class="mono">kiri k8s delete</span> does.</span>
      <button class="btn danger kdelete" data-k8sdelete${dis || !node ? " disabled" : ""}>Delete cluster</button></div>
  </div>`;
}

function deleteCluster() {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog alert" role="alertdialog" aria-modal="true">${alertIco("remove")}<h3>Delete the Kubernetes cluster?</h3>
      <p>Everything in it goes: its pods, services, volumes and other resources, and the <b>${esc(k8sContext())}</b> kubectl context. The next start makes a new, empty cluster.</p>
      <div class="row-end"><span></span><span><button class="btn" data-close>Cancel</button> <button class="btn danger" data-go>Delete cluster</button></span></div></div>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim || ev.target.closest("[data-close]")) return close();
    if (ev.target.closest("[data-go]")) { closePod(); k8sDo("deletecluster"); close(); }
  });
  scrim.querySelector("[data-close]")?.focus();
}

/* A pod's status as kubectl prints it, coloured as the container pills are:
   green when running and ready, yellow on its way, grey when done, red when failing. */
function podClass(p) {
  const s = p.status;
  if (s === "Running") return p.allReady ? "running" : "paused";
  if (s === "Succeeded" || s === "Completed") return "exited";
  if (/^(Pending|ContainerCreating|PodInitializing|Terminating|Init:\d)/.test(s)) return "paused";
  return "failed";
}
// Kubernetes says OOMKilled; people say out of memory.
const podWord = (s) => (s === "OOMKilled" ? "Out of memory" : s);
const podPill = (p, id = "") => `<span class="pill ${podClass(p)}"${id ? ` id="${id}"` : ""}${p.status === "OOMKilled" ? ` title="Kubernetes stopped it: it used more memory than it may, or the VM ran out"` : ""}>${esc(podWord(p.status))}</span>`;
const podAge = (p) => (p.created ? since(Date.parse(p.created) / 1000) : "");
const podOf = (d) => k8s.pods.find((p) => p.ns === d.ns && p.name === d.name);
/* default first, the system's own namespaces last. */
const nsRank = (n) => (n === "default" ? 0 : n.startsWith("kube-") ? 2 : 1);
const nsOrder = (a, b) => nsRank(a) - nsRank(b) || a.localeCompare(b);
const POD_SORT = {
  name: (p) => p.name, status: (p) => p.status, ready: (p) => p.ready, restarts: (p) => p.restarts,
  age: (p) => Date.now() - Date.parse(p.created || 0),
};

function renderPods() {
  // How many, and how many run, are the tabs beside it.
  $("subtitle").textContent = [k8sContext(), k8sApi()].filter(Boolean).join(" · ");
  if (!kept("pods").length) return renderEmpty("pods");
  const items = sortBy(listed("pods"), "pods", POD_SORT);
  if (!items.length) return noMatch();
  const rows = [];
  for (const ns of [...new Set(items.map((p) => p.ns))].sort(nsOrder)) {
    const pods = items.filter((p) => p.ns === ns), key = `ns:${ns}`;
    // A filter opens every namespace it matches in.
    const open = !ui.collapsed.has(key) || !!ui.filter;
    const up = pods.filter((p) => p.status === "Running").length;
    rows.push(`<tr class="row group" data-group="${esc(key)}" aria-expanded="${open}">${CK0}
      <td colspan="${shareOn() ? 6 : 5}" data-fill><div class="name"><span class="chev" aria-hidden="true">${open ? "▾" : "▸"}</span>${tile(k8s.icon, "pods")}
        <div><b>${esc(ns)}</b><div class="sub-name">Namespace · ${up} of ${pods.length} running</div></div></div></td><td class="actions"></td></tr>`);
    if (open) rows.push(...pods.map(podRow));
  }
  table([["Name", "", "name"], ["Status", "col-state", "status"], ["Ready", "", "ready"], ["Restarts", "r", "restarts"], ...(shareOn() ? [["Share", "col-share"]] : []), ["Age", "", "age"]], rows, "pods");
}

function podRow(p) {
  const key = esc(`${p.ns}/${p.name}`);
  return `<tr class="row member${chosen("pods", p)}" data-key="${key}"${pickAt("pods", p)}>
    ${pickCell("pods", p)}<td><div class="name" data-kpod="${key}">${tile(p.icon, "pods")}<div title="${esc(p.name)}"><span class="link">${esc(p.name)}</span></div></div></td>
    <td class="clip col-state">${podPill(p)}</td>
    <td class="num">${esc(p.ready)}</td>
    <td class="r num">${p.restarts ? p.restarts : '<span class="muted">0</span>'}</td>
    ${shareOn() ? `<td class="col-share">${kCell("pod", p)}</td>` : ""}
    <td class="muted" data-kage="${esc(p.created || "")}">${podAge(p)}</td>
    <td class="actions"><div class="acts-row">${ibtn("logs", "Logs", `data-kpod="${key}" data-ktab="logs"`)}${ibtn("trash", "Delete", `data-kdel="${key}"`, "danger")}</div></td></tr>`;
}

/* Delete asks first, and says whether something starts the pod again. */
function deletePod(key) {
  const [ns, name] = key.split("/");
  const p = k8s.pods.find((x) => x.ns === ns && x.name === name);
  const again = !p?.owner ? "Nothing starts it again: no deployment or other controller owns it."
    : p.owner === "ReplicaSet" ? "Its deployment starts a new pod in its place."
    : p.owner === "Job" ? "Its job may start it again." : `Its ${esc(p.owner)} starts a new pod in its place.`;
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog alert" role="alertdialog" aria-modal="true">${alertIco("remove")}<h3>Delete pod ${esc(name)}?</h3>
      <p>${again} Its containers stop and their files go.</p>

/* A pod's page: Info and Logs. The log console is kept as a live element,

/* Follows the picked container's log, from its last 2000 lines; Previous

  if (!again && d.logKey === key && (d.logsOn || d.previous)) return;

/* A container in a pod: its state in a word, as a pill, and since when. */

  if (c.state === "terminated") return `<span class="pill ${c.exit === 0 ? "exited" : "failed"}">${esc(c.reason || "Terminated")}${c.exit != null ? ` (${c.exit})` : ""}${when}</span>`;

/* Services. Kiri publishes a LoadBalancer service's ports on localhost, so

    const to = x.targetPort != null && String(x.targetPort) !== String(x.port) ? `→${esc(x.targetPort)}` : "";

    return `<span>${x.port}${x.nodePort && !lb ? `:${x.nodePort}` : ""}${to}${proto}</span>`;

const SVC_SORT = { name: (s) => s.name, ns: (s) => s.ns, type: (s) => s.type, ip: (s) => s.clusterIP, age: (s) => Date.now() - Date.parse(s.created || 0) };

/* --- Share for Kubernetes: a service, or a pod, gets the same Share cell as a

  if (declared.length) return declared;
  const seen = new Set();
  return kSelecting(p).flatMap((s) => (s.ports || []).filter((x) => /^\d+$/.test(String(x.targetPort ?? x.port)))
    .map((x) => ({ port: Number(x.targetPort ?? x.port), name: x.name, protocol: x.protocol }))).filter((x) => !seen.has(x.port) && seen.add(x.port));

/* The ports worth a link: TCP, and not a database or the like. */

  if (!kPorts(kind, x).web.length) return (kind === "service" ? x.ports : x.containers.flatMap((c) => c.ports || []))?.length ? "Not a web port, so it isn't shared" : "No ports to share";

const kServicesFor = (p) => kSelecting(p).filter((s) => !kNever("service", s) && !kBlocked("service", s));

/* A service's or pod's cell in the Share column, as shareCell is a container's. */
function kCell(kind, x) {

  const why = kBlocked(kind, x), g = shSvg("globe"), pre = kPre(kind, x.ns, x.name);
  if (why) return `<span class="shc off" title="${esc(why)}" aria-label="Can't be shared">${g}Share</span>`;
  const it = kLive(kind, x.ns, x.name);
  if ([...sh.starting].some((k) => k.startsWith(pre)) || (it && it.state !== "live")) return `<span class="shc wait" role="status"><i class="sh-spin"></i>${shWaitWord(it)}</span>`;
  if (it) return `<button class="shc live" data-shmodal="${it.id}" title="Shared · ${esc((it.url || "").replace(/^https:\/\//, ""))}" aria-label="${esc(x.name)} is shared">${g}<i class="led"></i>Live</button>`;
  const bad = [...sh.items.values()].find((y) => y.state === "ended" && y.error && !y.gone && y.source?.startsWith(pre) && Date.now() - (y.failedAt || 0) < SH_FAILED_MS);

/* The live link under a shared service's name, with Copy. */
function kAddr(kind, x) {
  const it = kLive(kind, x.ns, x.name);
  return it?.url ? `<div class="addr"><button class="sh-chip" data-shopen="${it.id}" title="Open ${esc(it.url)}"><span class="sh-led"></span><span>${esc(it.url.replace(/^https:\/\//, ""))}</span></button>${copyBtn(it.url, "link")}</div>` : "";

/* Starts a share of `key` ("service default/web :80"), signing in first if need be. */
function kStart(key) {

      return `<button class="opt" aria-checked="${i === 0}" data-kgo="${esc(kKey("service", s.ns, s.name, p.port))}">${wheel}<b>Share service ${esc(s.name)}${i === 0 ? "<em>Recommended</em>" : ""}</b><small>Port ${p.port}. The link keeps working when pods restart.</small></button>`; }).join("")}
    ${web.map((p) => `<button class="opt warn" data-kgo="${esc(kKey("pod", ns, name, p.port))}">${wheel}<b>Share this pod's port ${p.port}</b><small>${x.owner ? "This pod's name changes when it restarts, and the link would end." : "The link ends when the pod does."}</small></button>`).join("")}
    ${web.length ? "" : `<button class="opt warn" data-kask="${esc(`${ns}/${name}`)}">${wheel}<b>Share this pod on a port…</b><small>${x.owner ? "This pod's name changes when it restarts, and the link would end." : "The link ends when the pod does."}</small></button>`}`, true);
}
/* A small menu under the Share button; Escape or a click elsewhere closes it. */

}
function htMove(dir) {
  const ids = htTab() ? htLeaves(htTab().tree) : [];
  const from = htPane()?.el.getBoundingClientRect();
  if (!from || ids.length < 2) return;
  const cx = from.left + from.width / 2, cy = from.top + from.height / 2;
  let best = null, bestD = Infinity;
  for (const id of ids) {
    if (id === ht.focus) continue;
    const r = htPane(id).el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const ok = { left: x < cx - 1, right: x > cx + 1, up: y < cy - 1, down: y > cy + 1 }[dir];
    const d = Math.hypot(x - cx, y - cy);
    if (ok && d < bestD) { best = id; bestD = d; }
  }
  if (best) htSetFocus(best);
}
function htSetFs(v, quiet) {
  const fs = Math.max(HT_FS.min, Math.min(HT_FS.max, v));
  if (fs !== htFs()) { prefs.termFs = fs; send("setpref", { name: "termFs", value: fs }); }
  for (const p of ht.panes.values()) if (p.term) p.term.options.fontSize = fs;
  htQ("input[type=range]").value = fs;
  htQ(".htfsv").textContent = `${fs} px`;
  htQueueFit();
  if (!quiet) htToast(`Text size ${fs} px`);
}
const htStep = (step) => htSetFs(step === 0 ? HT_FS.def : htFs() + step);
/* The window's text size is CSS zoom on the body; xterm measures in real
   pixels, so its element undoes the zoom (and has its own size instead). */
function htApply() {
  htEl.style.setProperty("--ht-h", `${Math.max(120, Number(prefs.termH) || 300)}px`);
  htEl.style.setProperty("--ht-unzoom", String(1 / (Number(prefs.scale) || 1)));
  const theme = htTheme(), font = htFont();
  for (const p of ht.panes.values()) if (p.term) { p.term.options.theme = theme; p.term.options.fontFamily = font; }
  htQueueFit();
}
window.htApply = htApply;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", htApply);

function htMax(on = !ht.max) {
  ht.max = on;
  htEl.classList.toggle("max", on);
  const b = htQ('[data-ht="max"]');
  b.innerHTML = on ? HT_ICON.restore : HT_ICON.max;
  b.title = on ? "Restore" : "Maximise";
  b.setAttribute("aria-label", b.title);
  htQueueFit();
}
function htFind(open = true) {
  const f = htQ(".htfind");
  f.hidden = !open;
  if (open) { const i = f.querySelector("input"); i.focus(); i.select(); }
  else { htPane()?.search?.clearDecorations(); htQ(".htcount").textContent = ""; htPane()?.term?.focus(); }
}
const HT_DECO = { matchBackground: "#6EA8FE55", activeMatchBackground: "#FFC23D", matchOverviewRuler: "#6EA8FE", activeMatchColorOverviewRuler: "#FFC23D" };
function htFindGo(back) {
  const s = htPane()?.search, q = htQ(".htfind input").value;
  ht.findQ = q;
  if (!s) return;
  if (!q) { s.clearDecorations(); htQ(".htcount").textContent = ""; return; }
  const found = back ? s.findPrevious(q, { decorations: HT_DECO }) : s.findNext(q, { decorations: HT_DECO, incremental: false });
  if (!found) htQ(".htcount").textContent = "No results";
}
htQ(".htfind input").addEventListener("input", () => {
  const s = htPane()?.search, q = htQ(".htfind input").value;
  ht.findQ = q;
  if (!s) return;
  if (!q) { s.clearDecorations(); htQ(".htcount").textContent = ""; return; }
  if (!s.findNext(q, { decorations: HT_DECO, incremental: true })) htQ(".htcount").textContent = "No results";
});
htQ(".htfind input").addEventListener("keydown", (ev) => {
  ev.stopPropagation();
  if (ev.key === "Enter") { ev.preventDefault(); htFindGo(ev.shiftKey); }
  else if (ev.key === "Escape") { ev.preventDefault(); htFind(false); }
});

/* Pasting more than one line runs each line as a command: ask first. */
function htPaste(id, text) {
  const p = htPane(id);
  if (!p?.term || !text || p.exited) return;
  const lines = text.replace(/\r\n/g, "\n").replace(/\n$/, "").split("\n").length;
  if (lines < 2) return p.term.paste(text);
  p.el.querySelector(".htask")?.remove();
  const ask = document.createElement("div");
  ask.className = "htask";
  ask.setAttribute("role", "alertdialog");
  ask.innerHTML = `<p>Paste ${lines} lines? Each line runs as a command.</p><pre>${esc(text.slice(0, 400))}</pre><div class="acts"><button class="btn" data-htask="no">Cancel</button><button class="btn primary" data-htask="yes">Paste</button></div>`;
  p.el.append(ask);
  const done = (yes) => { ask.remove(); if (yes) p.term.paste(text); p.term.focus(); };
  ask.addEventListener("click", (ev) => { const b = ev.target.closest("[data-htask]"); if (b) done(b.dataset.htask === "yes"); });
  ask.addEventListener("keydown", (ev) => { ev.stopPropagation(); if (ev.key === "Escape") done(false); else if (ev.key === "Enter") done(true); });
  ask.querySelector('[data-htask="yes"]').focus();
}
function htCopy(p) {
  const text = p.term?.getSelection();
  if (!text) return false;
  send("term", { name: "copy", value: text });
  htToast("Copied");
  return true;
}
/* The browser's own paste (a menu, or a key the WebView handles itself)
   goes through the same check. */
htEl.addEventListener("paste", (ev) => {
  if (!ev.target.closest?.(".htx")) return;
  ev.preventDefault();
  ev.stopPropagation();
  const id = ev.target.closest(".htpane")?.dataset.id;
  htPaste(id, ev.clipboardData?.getData("text/plain") || "");
}, true);

/* The panel's keys (HT_KEYS), per system. */
function htAction(ev) {
  const k = ev.key, low = k.length === 1 ? k.toLowerCase() : k;
  const mod = WIN || LINUX ? ev.ctrlKey && !ev.metaKey : ev.metaKey && !ev.ctrlKey;
  const arrow = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down" }[k];
  if (WIN || LINUX) {
    if (ev.ctrlKey && ev.shiftKey && !ev.altKey) {
      const a = { t: "newtab", w: "close", f: "find", c: "copy", v: "paste", [LINUX ? "e" : "z"]: "zoom" }[low];
      if (a) return a;
      if (LINUX && (k === "(" || k === "9")) return "sr";
      if (LINUX && (k === ")" || k === "0")) return "sd";
    }
    if (WIN && ev.altKey && ev.shiftKey && !ev.ctrlKey && (k === "+" || k === "=" || ev.code === "Equal")) return "sr";
    if (WIN && ev.altKey && ev.shiftKey && !ev.ctrlKey && (k === "_" || k === "-" || ev.code === "Minus")) return "sd";
    if (ev.altKey && !ev.ctrlKey && !ev.shiftKey && arrow) return `move-${arrow}`;
    if (WIN && ev.ctrlKey && !ev.shiftKey && !ev.altKey && low === "v") return "paste";
    if (WIN && ev.ctrlKey && !ev.shiftKey && !ev.altKey && low === "c") return "copysel";
  } else {
    if (mod && !ev.altKey && !ev.shiftKey) {
      const a = { t: "newtab", w: "close", d: "sr", f: "find", c: "copy", v: "paste" }[low];
      if (a) return a;
    }
    if (mod && ev.shiftKey && !ev.altKey && low === "d") return "sd";
    if (mod && ev.shiftKey && k === "Enter") return "zoom";
    if (mod && ev.altKey && arrow) return `move-${arrow}`;
  }
  if (mod && !ev.altKey && (k === "=" || k === "+")) return "zin";
  if (mod && !ev.altKey && !ev.shiftKey && k === "-") return "zout";
  if (mod && !ev.altKey && !ev.shiftKey && k === "0") return "z0";
  return null;
}
const htToggleKey = (ev) => (ev.ctrlKey && !ev.metaKey && !ev.altKey && (ev.code === "Backquote" || ev.key === "`")) || (LINUX && ev.key === "F4" && !ev.ctrlKey && !ev.altKey && !ev.shiftKey && !ev.metaKey);
function htKey(ev, p) {
  if (ev.type !== "keydown") return true;
  if (htToggleKey(ev)) { ev.preventDefault(); ev.stopPropagation(); htToggle(); return false; }
  const a = htAction(ev);
  if (!a) return true;
  // Ctrl+C copies only with a selection; otherwise it is the shell's interrupt.
  if (a === "copysel" && !p.term.hasSelection()) return true;
  ev.preventDefault();
  ev.stopPropagation();
  htDo(a, p);
  return false;
}
function htDo(a, p = htPane()) {
  if (a === "copy" || a === "copysel") { if (p) htCopy(p); }
  else if (a === "paste") { if (p) send("term", { name: "paste", id: p.id }); }
  else if (a === "newtab") htNewTab();
  else if (a === "close") { if (p) htDrop(p.id); }
  else if (a === "sr") htSplit("h");
  else if (a === "sd") htSplit("v");
  else if (a === "find") htFind(true);
  else if (a === "zoom") { if (htTab() && htLeaves(htTab().tree).length > 1) { ht.zoom = !ht.zoom; htRender(); htToast(ht.zoom ? "Pane zoomed" : "Pane restored"); requestAnimationFrame(() => htPane()?.term?.focus()); } }
  else if (a === "zin") htStep(1);
  else if (a === "zout") htStep(-1);
  else if (a === "z0") htStep(0);
  else if (a.startsWith("move-")) htMove(a.slice(5));
}
/* The toggle works from anywhere in the window. */
document.addEventListener("keydown", (ev) => {
  if (htToggleKey(ev)) { ev.preventDefault(); htToggle(); }
});
htBody.addEventListener("wheel", (ev) => {
  if (!(WIN || LINUX ? ev.ctrlKey : ev.metaKey || ev.ctrlKey)) return;
  ev.preventDefault();
  ev.stopPropagation();
  htStep(ev.deltaY < 0 ? 1 : -1);
}, { passive: false, capture: true });

/* Right-click a tab: pin it (first in the row, no ×), or close it. */
function htPin(i, on) {
  const t = ht.tabs[i];
  if (!t) return;
  const cur = htTab();
  t.pinned = on;
  ht.tabs.splice(i, 1);
  const lastPinned = ht.tabs.reduce((n, x, j) => (x.pinned ? j + 1 : n), 0);
  ht.tabs.splice(lastPinned, 0, t);
  ht.at = ht.tabs.indexOf(cur);
  htRender();
  htToast(on ? "Tab pinned" : "Tab unpinned");
}
function htCtx(ev, i) {
  const m = htQ(".htctx"), t = ht.tabs[i], box = htEl.getBoundingClientRect(), zoom = Number(prefs.scale) || 1;
  setHTML(m, `<button class="mi" role="menuitem" data-htpin="${i}">${t.pinned ? "Unpin tab" : "Pin tab"}</button><button class="mi" role="menuitem" data-htclose="${i}"${t.pinned ? " disabled" : ""}>Close tab</button>`);
  m.hidden = false;
  m.style.left = `${Math.min(ev.clientX - box.left, box.width - 180) / zoom}px`;
  m.style.top = `${(ev.clientY - box.top) / zoom}px`;
}
htQ(".httabs").addEventListener("contextmenu", (ev) => {
  const tab = ev.target.closest("[data-httab]");
  if (!tab) return;
  ev.preventDefault();
  ev.stopPropagation();
  htCtx(ev, Number(tab.dataset.httab));
});
htQ(".htctx").addEventListener("click", (ev) => {
  const pin = ev.target.closest("[data-htpin]"), close = ev.target.closest("[data-htclose]");
  htQ(".htctx").hidden = true;
  if (pin) htPin(Number(pin.dataset.htpin), !ht.tabs[Number(pin.dataset.htpin)].pinned);
  else if (close && !close.disabled) htCloseTab(Number(close.dataset.htclose));
});
function htMenu() {
  const m = htQ(".htmenu"), list = ht.shells || [];
  const item = (s, i) => `<button class="mi" data-htshell="${esc(s.id)}">${esc(s.label)}${i === 0 ? `<span class="k">${esc(HT_KEYS.newtab)}</span>` : ""}</button>`;
  const def = list.find((s) => s.id === ht.def);
  const rest = list.filter((s) => s !== def);
  const plain = rest.filter((s) => !s.group), groups = [...new Set(rest.filter((s) => s.group).map((s) => s.group))];
  setHTML(m, [def ? item(def, 0) : "", ...plain.map((s) => item(s, 1)),
    ...groups.map((g) => `<hr><div class="ml">${esc(g)}</div>${rest.filter((s) => s.group === g).map((s) => item(s, 1)).join("")}`)].join("") || `<div class="ml">Looking for shells…</div>`);
}
function htFontMenu() {
  const sel = htQ(".htfont"), names = fontLists.mono.length ? fontLists.mono : [];
  const cur = prefs.termFont || "";
  setHTML(sel, `<option value="">Same as the window (${esc(prefs.mono || "System Mono")})</option>` + names.map((n) => `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}</option>`).join(""));
  sel.value = cur;
}
htEl.addEventListener("click", (ev) => {
  const t = ev.target;
  // A split pane's own ×, in its title bar.
  const px = t.closest("[data-htpx]");
  if (px) { ev.stopPropagation(); return htDrop(px.closest(".htpane").dataset.id); }
  const x = t.closest("[data-htx]");
  if (x) { ev.stopPropagation(); return htCloseTab(Number(x.dataset.htx)); }
  const tab = t.closest("[data-httab]");
  if (tab) { ht.at = Number(tab.dataset.httab); ht.focus = null; ht.zoom = false; htRender(); requestAnimationFrame(() => htPane()?.term?.focus()); return; }
  const sh = t.closest("[data-htshell]");
  if (sh) { htQ(".htmenu").hidden = true; return htNewTab(sh.dataset.htshell); }
  const b = t.closest("[data-ht]");
  if (!t.closest(".htpop, .htmenu") && b?.dataset.ht !== "menu" && b?.dataset.ht !== "aa") htEl.querySelectorAll(".htpop, .htmenu").forEach((m) => (m.hidden = true));
  if (b) {
    const k = b.dataset.ht;
    if (k === "menu") { const m = htQ(".htmenu"); htQ(".htpop").hidden = true; m.hidden = !m.hidden; if (!m.hidden) { htMenu(); if (!ht.shells) send("term", { name: "shells" }); } }
    else if (k === "aa") { const pop = htQ(".htpop"); htQ(".htmenu").hidden = true; pop.hidden = !pop.hidden; if (!pop.hidden) { htSetFs(htFs(), true); htFontMenu(); if (!fontLists.mono.length) send("fonts"); } }
    else if (k === "max") htMax();
    else if (k === "hide") htShow(false);
    else if (k === "prev") htFindGo(true);
    else if (k === "next") htFindGo(false);
    else if (k === "findx") htFind(false);
    else htDo(k);
    return;
  }
  const pane = t.closest(".htpane");
  if (pane && !t.closest(".htask")) htSetFocus(pane.dataset.id);
});
htQ("input[type=range]").addEventListener("input", (ev) => htSetFs(Number(ev.target.value)));
htQ(".htfont").addEventListener("change", (ev) => { prefs.termFont = ev.target.value; send("setpref", { name: "termFont", value: ev.target.value }); htApply(); });
document.addEventListener("mousedown", (ev) => {
  if (!ev.target.closest?.(".htwrap")) htEl.querySelectorAll(".htpop, .htmenu").forEach((m) => (m.hidden = true));
  if (!ev.target.closest?.(".htctx")) htQ(".htctx").hidden = true;
});

/* The grip on the top edge sets the panel's height. */
htQ(".htgrip").addEventListener("mousedown", (ev) => {
  ev.preventDefault();
  // Mouse positions are the screen's; the panel's height is in the zoomed page's pixels.
  const zoom = Number(prefs.scale) || 1, startY = ev.clientY, startH = Math.max(120, Number(prefs.termH) || 300);
  const maxH = () => htEl.parentElement.getBoundingClientRect().height / zoom - 80;
  let h = startH;
  const move = (e) => { h = Math.round(Math.max(120, Math.min(maxH(), startH + (startY - e.clientY) / zoom))); htEl.style.setProperty("--ht-h", `${h}px`); };
  const up = () => { removeEventListener("mousemove", move); removeEventListener("mouseup", up); prefs.termH = h; send("setpref", { name: "termH", value: h }); htFitAll(); htPane()?.term?.focus(); };
  addEventListener("mousemove", move);
  addEventListener("mouseup", up);
});

/* What the app says back (termwire.rs). */
function htOn(e) {
  if (e.ev === "shells") {
    ht.shells = e.shells || [];
    ht.def = e.default || ht.shells[0]?.id || "";
    if (!htQ(".htmenu").hidden) htMenu();
    if (ht.wantTab) { const want = ht.wantTab; ht.wantTab = false; htNewTab(want === true ? undefined : want); }
    return;
  }
  const p = htPane(e.id);
  if (!p?.term) return;
  if (e.ev === "data") p.term.write(htUnB64(e.b64));
  else if (e.ev === "paste") htPaste(e.id, e.text || "");
  else if (e.ev === "exit") {
    p.exited = true;
    // A shell that ends by itself closes its pane, as other terminals do;
    // one that couldn't start says why.
    if (e.error) p.term.write(`\r\n\x1b[31mCouldn't start ${htShellLabel(p.shell)}: ${String(e.error).replace(/[\x00-\x1f]/g, " ")}\x1b[0m\r\n`);
    else htDrop(p.id, false);
  }
}
/* ⌘W on the Mac comes here first from the menu (mac.rs). */
function htCloseKey() {
  if (htHasFocus() && htPane()) htDrop(ht.focus);
  else send("closewindow");
}
function htStatusItem() {
  // renderStatus can run before this part of the script has.
  if (!ht) return "";
  return `<button class="item httoggle${ht.open ? " on" : ""}" data-htterm title="${ht.open ? "Hide" : "Show"} the terminal (${esc(HT_KEYS.toggle)})">${HT_ICON.term}<span>Terminal</span><kbd>${esc(HT_KEYS.toggle)}</kbd></button>`;
}
htApply();
// Shells from before a reload have nothing on screen any more.
send("term", { name: "closeall" });

document.querySelectorAll("svg[data-ph]").forEach((el) => (el.innerHTML = `<path d="${PH[el.dataset.ph]}"/>`));
render();
send("ready");
send("shares");
send("logins");
</script>
</body>
</html>
