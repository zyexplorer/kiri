/* The ports editor: host port → container port, one row each. A running
   container keeps running while its ports change. */
function openPorts(id) {
  const c = ui.containers.find((x) => x.Id === id);
  if (!c) return;
  const seen = new Set();
  const rows = (c.Ports || []).filter((p) => p.PublicPort && !seen.has(`${p.PublicPort}/${p.Type}`) && seen.add(`${p.PublicPort}/${p.Type}`))
    .map((p) => ({ host: p.PublicPort, container: p.PrivatePort, proto: p.Type || "tcp" }));
  if (!rows.length) rows.push({ host: "", container: "", proto: "tcp" });
  const name = c.Names[0].replace(/^\//, "");
  const row = (r, i) => `<div class="port-row" data-i="${i}">
      <input id="ph-${i}" inputmode="numeric" placeholder="auto" value="${esc(r.host)}" aria-label="Port on your ${HOST}">
      <span class="arrow">→</span>
      <input id="pc-${i}" inputmode="numeric" placeholder="80" value="${esc(r.container)}" aria-label="Port in the container">
      <select id="pp-${i}" aria-label="Protocol"><option${r.proto === "tcp" ? " selected" : ""}>tcp</option><option${r.proto === "udp" ? " selected" : ""}>udp</option></select>
      <button class="btn sm" data-del="${i}" aria-label="Remove this port">×</button></div>`;
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const draw = () => {
    scrim.innerHTML = `<form class="dialog" id="ports-form">
      <h3>Ports for ${esc(name)}</h3>
      <p>Port on your ${HOST} (localhost) → port inside the container. Leave the ${HOST} side empty to pick a free one.${c.State === "running" ? " The container keeps running." : ""}</p>
      <div class="port-head"><span>${HOST}</span><span></span><span>Container</span><span>Protocol</span><span></span></div>
      ${rows.map(row).join("")}
      <div class="row-end"><button class="btn sm" type="button" id="ports-add">Add port</button>
        <span><button class="btn" type="button" id="ports-cancel">Cancel</button> <button class="btn primary" type="submit">Save</button></span></div>
    </form>`;
  };
  const read = () => rows.forEach((r, i) => { r.host = $(`ph-${i}`)?.value.trim() ?? r.host; r.container = $(`pc-${i}`)?.value.trim() ?? r.container; r.proto = $(`pp-${i}`)?.value ?? r.proto; });
  draw();
  document.body.append(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim || ev.target.id === "ports-cancel") return close();
    if (ev.target.id === "ports-add") { read(); rows.push({ host: "", container: "", proto: "tcp" }); draw(); return; }
    const del = ev.target.closest("[data-del]");
    if (del) { read(); rows.splice(+del.dataset.del, 1); draw(); }
  });
  scrim.addEventListener("submit", (ev) => {
    ev.preventDefault();
    read();
    const ports = [];
    for (const r of rows) {
      if (!r.container && !r.host) continue;
      const cp = +r.container, hp = r.host === "" ? 0 : +r.host;
      if (!Number.isInteger(cp) || cp < 1 || cp > 65535) return toast("error", `Container port "${r.container}" is not a port number (1–65535).`);
      if (!Number.isInteger(hp) || hp < 0 || hp > 65535) return toast("error", `${HOST} port "${r.host}" is not a port number (1–65535).`);
      ports.push({ container_port: cp, host_port: hp, proto: r.proto, host_ip: "" });
    }
    send("ports", { id, ports });
    close();
  });
  $("ph-0")?.focus();
}

const IMAGE_SORT = {
  repo: (i) => split(i.RepoTags?.[0] || "")[0], tag: (i) => split(i.RepoTags?.[0] || "")[1], id: (i) => i.Id,
  size: (i) => i.Size || 0, created: (i) => i.Created || 0, pulled: (i) => i.Pulled || 0, used: (i) => usersOf(i).length,
};
/* View → Zoom In / Zoom Out (⌘+ / ⌘−) step through Settings' text sizes;
   Actual Size (⌘0) goes back to 100%. */
function stepTextSize(step) {
  const at = SIZES.findIndex((z) => Math.abs(z - (prefs.scale || 1)) < 0.01);
  const from = at < 0 ? SIZES.indexOf(1) : at;
  const next = step === 0 ? 1 : SIZES[Math.max(0, Math.min(SIZES.length - 1, from + step))];
  if (next !== prefs.scale) setPref("scale", next);
}

/* The containers made from an image: Docker won't remove an image while one
   exists, running or not, since it couldn't start again without it. */
const usersOf = (img) => ui.containers.filter((c) => c.ImageID === img.Id);
const cname = (c) => c.Names[0].replace(/^\//, "");
/* Phosphor's cube, drawn as strokes so a light can run round its edge; `i`
   is a lit box's place in the list, for the spark's stagger. */
const CUBE_E = "M128 24 216 72V184L128 232 40 184V72Z M40 72 128 120 216 72 M128 120V232";
const cube = (st, i = 0) => `<svg class="cube ${st}" viewBox="0 0 256 256"${st === "run" ? ` style="--i:${Math.min(i, 14)}"` : ""} aria-hidden="true"><path class="f" d="M40 72 128 24 216 72 128 120Z"/><path class="e" d="${CUBE_E}"/>`
  + `${st === "run" ? '<path class="sp" pathLength="1" d="M128 24 216 72V184L128 232 40 184V72Z"/>' : ""}</svg>`;
/* An image's Used by cell: "3 containers", then a box and count per state.
   The words are its tooltip. `lit` counts the green boxes so far. */
function usedCell(i, lit) {
  const users = usersOf(i), n = users.length, by = { running: 0, stopped: 0, failed: 0 };
  for (const c of users) by[ctrState(c)]++;
  const groups = [["running", "run"], ["stopped", "stop"], ["failed", "fail"]].filter(([s]) => by[s]);
  const ctrs = (k) => `${k} ${k === 1 ? "container" : "containers"}`;
  if (!n) return `<td class="used" title="Not in use: no container was made from it"><div class="l1">${cube("off")}<span class="off">not in use</span></div></td>`;
  const words = groups.map(([s]) => ctrs(by[s]).replace(" ", ` ${s} `)).join(" · ");
  const boxes = groups.map(([s, k]) => `<span>${cube(k, k === "run" ? lit.n++ : 0)}${by[s]}</span>`).join("<i>·</i>");
  return `<td class="used" title="${words}"><div class="l1">${ctrs(n)}</div><div class="l2">${boxes}</div></td>`;
}

/* Remove on an image: straight away when nothing uses it; otherwise a dialog
   that offers to remove the stopped containers with it, or says which running
   ones to stop first. */
/* Run an image where you are: the button is a yellow spinner until the
   container is up, then the play button again. The list stays put.
   With no env yet, a popover asks for an optional container name (and any
   password the image needs). Pass env (even []) to start. */
function runImage(name, env, container, port) {
  if (isK8sImage(name)) return k8sRunNote(name);
  if (ui.running.has(name)) return;
  if (env === undefined) {
    if (!needsFor(name) && !probedFresh(name)) return probeNeeds(name);
    if (needsFor(name)) return needOpen(name);
    return runOpen(name);
  }
  ui.running.add(name);
  send("run", { name, value: env || [], container: container || "", port: port || 0 });
  if (ui.view === "images") render();
}
function runBtn(name) {
  const n = esc(name);
  if (ui.running.has(name) || runHeld(name)) return ibtn("play", "Starting…", `data-run="${n}" disabled`, "go rolling");
  const live = ui.containers.find((c) => c.Id === ui.launched.get(name) && c.State === "running");
  // How long it's been up, beside Stop; the ticker keeps it current, and it opens the container.
  if (live) return `<button class="run-up" data-golive="${esc(live.Id)}" data-live="${esc(live.Id)}" title="Open ${esc(cname(live))}">${esc(statusText(live))}</button>${ibtn("stop", `Stop ${esc(cname(live))}`, `data-c="stop" data-id="${esc(live.Id)}"`, "halt")}`;
  return ibtn("play", "Run", `data-run="${n}" aria-expanded="${ui.need?.image === name}"`, "go");
}

/* Asks before something is deleted: `title` is the question, `note` what goes with it. */
function confirmRemove(title, note, label, go, kind = "danger") {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog alert" role="alertdialog" aria-modal="true">${alertIco(/^(Remove|Delete|Clear)/.test(label) ? "remove" : "warn")}<h3>${title}</h3>${note ? `<p>${note}</p>` : ""}
    <div class="row-end"><span></span><span><button class="btn" data-close>Cancel</button> <button class="btn ${kind}" data-go>${label}</button></span></div></div>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim || ev.target.closest("[data-close]")) return close();
    if (ev.target.closest("[data-go]")) { go(); close(); }
  });
  scrim.querySelector("[data-close]")?.focus();
}

/* A container action; removing asks first. */
function containerAction(action, id) {
  if (action === "start") {
    // A start that never comes up stops rolling after a while; an error says why.
    clearTimeout(ui.starting.get(id));
    ui.starting.set(id, setTimeout(() => { if (ui.starting.delete(id) && ui.view === "containers") render(); }, 20000));
    if (ui.view === "containers") render();
  }
  const c = ui.containers.find((x) => x.Id === id), name = c ? cname(c) : short(id);
  // kiri-k8s is Kiri's Kubernetes: stopping or removing it turns Kubernetes off.
  if (isKiriK8s(c) && action === "stop") return confirmRemove("Stop Kubernetes?", "<span class=\"mono\">kiri-k8s</span> is Kiri's Kubernetes cluster. Stopping it turns Kubernetes off, and its pods stop until it starts again.", "Stop", () => send("container", { action, id }));
  if (isKiriK8s(c) && action === "remove") return confirmRemove("Remove Kubernetes' container?", "<span class=\"mono\">kiri-k8s</span> is Kiri's Kubernetes cluster. Removing it turns Kubernetes off. The cluster's data stays in the <span class=\"mono\">kiri-k8s</span> volume; Delete cluster in Settings → Kubernetes removes everything.", "Remove", () => send("container", { action, id }));
  if (action !== "remove") return send("container", { action, id });
  const up = c && (c.State === "running" || c.State === "paused");
  confirmRemove(`Remove ${esc(name)}?`, `${up ? "It's stopped and deleted" : "It's deleted"}, with its files and unnamed volumes. Named volumes stay.`, "Remove", () => send("container", { action, id }));
}

/* Removing a whole Compose project asks first; the rest go straight through. */
function projectAsk(project, action) {
  if (action !== "remove") return projectAction(project, action);
  const n = ui.containers.filter((c) => c.Labels?.["com.docker.compose.project"] === project).length;
  confirmRemove(`Remove ${esc(project)}?`, `Its ${n === 1 ? "container is" : `${n} containers are`} stopped and deleted, with their files. Named volumes stay.`, "Remove all", () => projectAction(project, action));
}

function removeImage(name) {
  const img = ui.images.find((i) => i.RepoTags?.includes(name) || i.Id === name);
  const users = img ? usersOf(img) : [];
  if (!users.length) return confirmRemove(`Remove ${esc(name)}?`, "You can pull it again later.", "Remove", () => send("rmi", { name }));
  const running = users.filter((c) => c.State === "running" || c.State === "paused");
  const list = (cs) => cs.map((c) => `<b>${esc(cname(c))}</b>`).join(", ");
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = running.length
    ? `<div class="dialog alert" role="alertdialog" aria-modal="true">${alertIco("warn")}<h3>${esc(name)} is in use</h3>
        <p>${list(running)} ${running.length === 1 ? "is" : "are"} running from this image. Stop ${running.length === 1 ? "it" : "them"} first, then remove the image.</p>
        <div class="row-end"><span></span><button class="btn" data-close>OK</button></div></div>`
    : `<div class="dialog alert" role="alertdialog" aria-modal="true">${alertIco("remove")}<h3>Remove ${users.length === 1 ? esc(cname(users[0])) : `${users.length} containers`} and ${esc(name)}?</h3>
        <p>${list(users)} ${users.length === 1 ? "was" : "were"} made from this image and can't start again without it, so ${users.length === 1 ? "it goes" : "they go"} too, with ${users.length === 1 ? "its" : "their"} files. Volumes stay.</p>
        <div class="row-end"><span></span><span><button class="btn" data-close>Cancel</button> <button class="btn danger" data-go>Remove ${users.length === 1 ? "both" : "all"}</button></span></div></div>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => {
    if (ev.target === scrim || ev.target.closest("[data-close]")) return close();
    if (ev.target.closest("[data-go]")) { send("rmi", { name, value: users.map((c) => c.Id) }); close(); }
  });
  scrim.querySelector("[data-go], [data-close]")?.focus();
}

function renderImages() {
  // A finished pull's row stays until the list has its image.
  for (const [n, p] of ui.pulls) if (p.phase === "done" && (ui.images.some((i) => i.RepoTags?.includes(n)) || Date.now() - p.end > 5000)) ui.pulls.delete(n);
  const items = sortBy(listed("images"), "images", IMAGE_SORT), pulls = [...ui.pulls.values()].reverse();
  if (!kept("images").length && !pulls.length) return renderEmpty("images");
  if (!items.length && !pulls.length) return noMatch();
  const rows = pulls.map(pullRow), lit = { n: 0 };
  for (const i of items) {
    const name = imgKey(i);
    const [repo, tag] = untagged(i) ? ["<none>", ""] : split(name);
    const picked = ui.picked && (i.RepoTags || []).some((t) => t === ui.picked || t === `${ui.picked}:latest`);
    rows.push(`<tr class="row${picked ? " picked" : ""}${chosen("images", i)}" data-rowopen="img" data-key="${esc(name)}"${pickAt("images", i)}>
      ${pickCell("images", i)}<td class="clip"><div class="name" data-img="${esc(name)}" title="${esc(repo)}">${tile(i.icon)}<div><span class="link">${esc(repo)}</span></div></div></td>
      <td class="clip">${untagged(i) ? '<span class="tag none">untagged</span>' : tagPill(tag)}</td>
      ${usedCell(i, lit)}
      <td class="mono muted col-id"><span class="sel">${esc(short(i.Id))}</span>${copyBtn(i.Id, "image ID")}</td>
      <td class="r num">${size(i.Size)}</td>
      <td class="muted col-created">${ago(i.Created)}</td>
      <td class="muted">${i.Pulled ? ago(i.Pulled) : ""}</td>
      <td class="actions"><div class="acts-row">
        ${runBtn(name, true)}
        ${ibtn("pull", "Pull", `data-pull="${esc(name)}" ${pulling(name) || untagged(i) ? "disabled" : ""}`)}
        ${ibtn("trash", "Remove", `data-rmi="${esc(name)}"`, "danger")}
      </div></td></tr>`);
  }
  // Shares like Containers: the table is always fixed-layout so a long repo or
  // tag ellipsises instead of pushing Actions off the window.
  table([["Repository", "", "repo", { share: 3 }], ["Tag", "", "tag", { share: 1.2 }], ["Used by", "", "used", { share: 1.4 }], ["ID", "col-id", "id", { share: 1 }], ["Size", "r", "size", { share: 0.8 }], ["Created", "col-created", "created", { share: 1 }], ["Pulled", "", "pulled", { share: 1 }]], rows, "images");
}

      <span class="spacer"></span>

/* Builds: BuildKit's history of docker builds (Mac). The list on the left, newest
   first; the picked build on the right with its steps in the order they ran, each
   with its time against the slowest, or "cached", and its output on a click. */
const BL_ICON = (k, cls = "") => `<svg class="i ${cls}" viewBox="0 0 256 256" aria-hidden="true"><path d="${PH[k]}"/></svg>`;
const blKind = (status) => /^complet/i.test(status) ? "ok" : /^(error|failed)/i.test(status) ? "fail" : /^running/i.test(status) ? "run" : "off";
const blWord = { ok: "Completed", fail: "Failed", run: "Building", off: "Canceled" };
function blDur(ms) {
  if (!(ms >= 0)) return "";
  if (ms < 1000) return `${(ms / 1000).toFixed(1)}s`;
  const s = Math.round(ms / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${s % 60}s`;
}
const blSpan = (a, b) => (a && b ? Date.parse(b) - Date.parse(a) : a ? Date.now() - Date.parse(a) : NaN);
// Dockerfile steps are "[stage 3/9] …" or "[2/4] …"; the rest is BuildKit's own work.
const blInternal = (name) => !/^\[([^\]]* )?\d+\/\d+\]/.test(name || "");
function pickBuild(b) {
  ui.bl.sel = b; ui.bl.d = null; ui.bl.open = new Set(); ui.bl.confirm = null; ui.bl.layers = null; ui.bl.plat = null;
  send("build", { name: b.builder, id: b.id });
  if (ui.bl.tab === "layers" || ui.bl.tab === "security") send("buildlayers", { name: b.builder, id: b.id });
}

function renderBuilds() {
  const b = ui.bl, c = $("content");
  if (b.items === null) {
    c.innerHTML = `<div class="empty"><div>${BL_ICON("hammer", "art")}<h3>Reading build history…</h3>${oomWait() || "<p>BuildKit starts if it's asleep.</p>"}</div></div>`;
    return;
  }
  if (!b.items.length) {
    if (b.error) { c.innerHTML = `<div class="empty"><div>${BL_ICON("hammer", "art")}<h3>Couldn't read the build history</h3><p>${esc(b.error)}</p></div></div>`; return; }
    return renderEmpty("builds");
  }
  if (!kept("builds").length) return renderEmpty("builds");
  const items = listed("builds");
  const scroll = c.querySelector(".bl-list")?.scrollTop || 0, dscroll = c.querySelector(".bl-detail")?.scrollTop || 0;
  c.innerHTML = `<div class="bl">
    <div class="bl-list" role="listbox" aria-label="Builds">${items.length ? items.map((x) => {
      const k = blKind(x.status);
      return `<button class="bl-item" role="option" data-bl="${esc(x.id)}" aria-selected="${b.sel?.id === x.id}">
        <span class="bl-st ${k}" title="${blWord[k]}">${k === "run" ? '<i class="spin"></i>' : BL_ICON(k === "ok" ? "checkcircle" : k === "fail" ? "xcircle" : "minus")}</span>
        <span class="bl-txt"><b>${esc(x.name || x.id)}</b><small>${blDur(blSpan(x.started, x.completed))}${x.started ? ` · ${ago(Date.parse(x.started) / 1000)}` : ""}</small></span></button>`;
    }).join("") : `<p class="bl-none">No build matches.</p>`}</div>
    <div class="bl-detail">${buildDetail()}</div></div>`;
  c.querySelector(".bl-list").scrollTop = scroll;
  c.querySelector(".bl-detail").scrollTop = dscroll;
}

function buildDetail() {
  const b = ui.bl, s = b.sel, d = b.d;
  if (!s) return "";
  // A build stopped with Ctrl-C ends as an Error whose message says it was canceled.
  const k = d?.error && /\bcancel/i.test(d.error.message || "") ? "off" : blKind(d?.status || s.status);
  const head = `<div class="bl-head"><h2>${esc(s.name || s.id)}</h2><span class="bl-pill ${k}">${blWord[k]}</span>
    <span class="bl-acts">${b.confirm === s.id ? `<span class="muted">Remove this build from the history?</span>${btn("Cancel", 'data-blrm="no"')}${btn("Remove", 'data-blrm="yes"', "danger")}` : btn("Remove", 'data-blrm="ask"')}</span></div>`;
  if (!d) return `${head}<div class="bl-loading muted">Loading the steps…</div>`;
  const warns = d.warnings || [];
  const meta = `<div class="bl-meta">
    <span title="Duration">${BL_ICON("clock")}${blDur(blSpan(d.started, d.completed)) || "—"}</span>
    ${d.started ? `<span title="Started">${BL_ICON("calendar")}${esc(new Date(d.started).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }))}</span>` : ""}
    <span title="Steps">${BL_ICON("steps")}${d.done ?? "?"}/${d.total ?? "?"}${d.cached ? ` (${d.cached} cached)` : ""}</span>
    ${warns.length ? `<span class="warn" title="Warnings">${BL_ICON("warning")}${warns.length}</span>` : ""}
  </div>
  <div class="bl-sub mono">${d.context ? `<span title="Build context">${esc(d.context)}</span>` : ""}<span title="Build record"><span class="sel"># ${esc(d.id)}</span>${copyBtn(d.id, "build ID")}</span></div>`;
  const err = d.error?.message ? `<div class="bl-err${k === "off" ? " off" : ""}"><b>${BL_ICON("xcircle")}${esc(k === "off" ? "The build was canceled" : d.error.step || "The build failed")}</b><p>${esc(d.error.message)}</p>${d.error.source ? `<pre>${esc(d.error.source.trim())}</pre>` : ""}</div>` : "";
  const warnList = warns.length ? `<div class="bl-warns">${warns.map((w) => `<div>${BL_ICON("warning")}<span>${esc(w.text)}${w.line ? ` <span class="muted">(line ${w.line})</span>` : ""}${w.detail ? `<small>${esc(w.detail)}</small>` : ""}</span>${/^https:\/\/docs\.docker\.com\//.test(w.url || "") ? `<button class="linkish" data-open-site="${esc(w.url)}">Docs</button>` : ""}</div>`).join("")}</div>` : "";
  let steps = (d.steps || []).filter((x) => b.internal || !blInternal(x.name));
  if (b.steps === "ran") steps = steps.filter((x) => !x.cached && x.started);
  if (b.steps === "cached") steps = steps.filter((x) => x.cached);
  if (b.steps === "failed") steps = steps.filter((x) => x.error);
  const max = Math.max(1, ...steps.filter((x) => !x.cached).map((x) => blSpan(x.started, x.completed) || 0));
  const openAll = steps.length > 0 && steps.every((x) => b.open.has(x.name));
  const bar = `<div class="bl-bar">
    <select data-blsteps aria-label="Which steps">${[["all", "All steps"], ["ran", "Ran"], ["cached", "Cached"], ["failed", "Failed"]].map(([v, l]) => `<option value="${v}"${b.steps === v ? " selected" : ""}>${l}</option>`).join("")}</select>
    <label class="bl-check"><input type="checkbox" data-blinternal${b.internal ? " checked" : ""}> Internal steps</label>
    <button class="btn sm bl-all" data-blall>${BL_ICON(openAll ? "collapse" : "expand")}${openAll ? "Collapse all" : "Expand all"}</button></div>`;
  const rows = steps.map((x) => {
    const ms = blSpan(x.started, x.completed), open = b.open.has(x.name), has = x.log || x.error;
    const st = x.error ? "fail" : x.cached ? "cached" : !x.started ? "skip" : !x.completed ? "run" : "ok";
    const ic = st === "run" ? '<i class="spin"></i>' : BL_ICON(st === "ok" ? "checkcircle" : st === "fail" ? "xcircle" : st === "cached" ? "lightning" : "minus");
    const m = (x.name || "").match(/^(\[[^\]]*\])\s*(.*)$/s);
    // An image pinned by digest reads as alpine:latest@sha256:be2656061b53…; the step's tooltip has it all.
    const short = (t) => t.replace(/@sha256:([0-9a-f]{12})[0-9a-f]{52}/g, "@sha256:$1…");
    const right = st === "cached" ? `<span class="bl-time muted">cached</span>` : st === "skip" ? `<span class="bl-time muted">skipped</span>`
      : `<span class="bl-time"><span>${blDur(ms)}</span><span class="track"><i style="width:${Math.max(2, Math.round(((ms || 0) / max) * 100))}%"></i></span></span>`;
    return `<div class="bl-step ${st}${open ? " open" : ""}">
      <button class="bl-row" data-blstep="${esc(x.name)}"${has ? "" : " disabled"} aria-expanded="${open}"><span class="bl-st ${st}">${ic}</span>
        <span class="bl-name mono" title="${esc(x.name)}">${m ? `<span class="muted">${esc(m[1])}</span> ${esc(short(m[2]))}` : esc(short(x.name || ""))}</span>${right}</button>
      ${open && has ? `<pre class="console bl-log">${esc(((x.log || "") + (x.error ? `\n${x.error}` : "")).trim())}</pre>` : ""}</div>`;
  }).join("");
  const tab = ["layers", "security"].includes(b.tab) ? b.tab : "steps";
  const tabs = `<div class="bl-tabs" role="tablist">
    <button role="tab" data-bltab="steps" aria-selected="${tab === "steps"}">Steps</button>
    <button role="tab" data-bltab="layers" aria-selected="${tab === "layers"}">Layers</button>
    <button role="tab" data-bltab="security" aria-selected="${tab === "security"}">Security</button>
  </div>`;
  const pane = tab === "security" ? blSecurity() : tab === "layers" ? blLayers()
    : `${bar}<div class="bl-steps">${rows || '<p class="bl-none">No steps here.</p>'}</div>`;
  return `${head}${meta}${err}${warnList}${tabs}${pane}`;
}

// Layers: the image the build made, per platform, read from the manifest and
// config BuildKit keeps with the build. Biggest first is one click away.
function blLayers() {
  const L = ui.bl.layers;
  if (L && !L.error && !L.images?.length) return `<p class="bl-none">This build made no image: it failed before exporting, or its output was the cache only.</p>`;
  return layersView(L, ui.bl.plat, { own: "Added by this build", base: "From the base image" });
}

// An image's layers, newest work first, then what came from its base; used by a
// build's Layers tab and by an image's own page.
function layersView(L, plat, words) {
  if (!L) return `<div class="bl-loading muted">Reading the image…</div>`;
  if (L.error) return `<p class="bl-none">${esc(L.error)}</p>`;
  const im = L.images.find((i) => i.platform === plat) || L.images[0];
  const real = im.layers.filter((l) => !l.empty), base = real.filter((l) => l.base), own = real.filter((l) => !l.base);
  const sum = (a) => a.reduce((t, l) => t + (l.size || 0), 0);
  const big = Math.max(...real.map((l) => l.size || 0), 1);
  const plats = L.images.length > 1 ? `<span class="bl-plats">${L.images.map((i) => `<button data-blplat="${esc(i.platform)}" aria-pressed="${i === im}">${esc(i.platform)}</button>`).join("")}</span>` : `<span class="muted">${esc(im.platform)}</span>`;
  const mat = (L.materials || []).map((m) => (m.URI || "").match(/^pkg:docker\/([^?]+)/)?.[1]).filter(Boolean);
  const row = (l, i) => {
    const pct = Math.round(((l.size || 0) / big) * 100);
    return `<div class="bl-layer${l.empty ? " cfgline" : ""}${l.base ? " base" : ""}" title="${esc(l.digest || "no layer: this line only changes the image's settings")}">
      <span class="bl-ln muted">${i + 1}</span><span class="bl-by mono">${esc(l.by || "(no description)")}</span>
      ${l.empty ? `<span class="bl-lsz muted">settings</span>` : `<span class="bl-lsz"><span>${size(l.size)}</span><span class="track"><i style="width:${Math.max(2, pct)}%"></i></span></span>`}</div>`;
  };
  const group = (title, note, rows) => rows.length ? `<div class="bl-lgroup"><div class="bl-lhead"><b>${title}</b><span class="muted">${note}</span></div>${rows.join("")}</div>` : "";
  const lines = im.layers.map((l, i) => ({ l, i }));
  const c = im.config || {};
  const run = [...(c.entrypoint || []), ...(c.cmd || [])];
  const kv = (k, v) => v ? `<div><span class="muted">${k}</span><span class="mono">${v}</span></div>` : "";
  const env = (c.env || []).filter((e) => !/^PATH=/.test(e));
  const labels = Object.entries(c.labels || {});
  return `<div class="bl-lsum">
      <span><b>${size(im.size)}</b> <span class="muted">compressed</span></span>
      <span><b>${real.length}</b> <span class="muted">layers</span></span>
      <span><b>${size(sum(own))}</b> <span class="muted">${words.own.toLowerCase()}</span></span>
      ${mat.length ? `<span class="muted" title="Base image">FROM <span class="mono">${esc(mat.join(", "))}</span></span>` : ""}
      <span class="bl-lplat">${plats}</span>
    </div>
    ${group(words.own, `${own.length} layer${own.length === 1 ? "" : "s"} · ${size(sum(own))}`, lines.filter(({ l }) => !l.base).map(({ l, i }) => row(l, i)))}
    ${group(words.base, `${base.length} layer${base.length === 1 ? "" : "s"} · ${size(sum(base))}`, lines.filter(({ l }) => l.base).map(({ l, i }) => row(l, i)))}
    <div class="bl-lgroup bl-cfg"><div class="bl-lhead"><b>How it runs</b><span class="muted">the image's settings</span></div>
      ${kv("Runs", esc(run.join(" ")))}${kv("Working dir", esc(c.workdir || ""))}${kv("User", esc(c.user || "root"))}
      ${kv("Ports", esc((c.ports || []).join(", ")))}${kv("Volumes", esc((c.volumes || []).join(", ")))}
      ${kv("Health check", esc((c.healthcheck || []).join(" ")))}${kv("Stop signal", esc(c.stopsignal || ""))}
      ${kv("Environment", env.map(esc).join("<br>"))}${kv("Labels", labels.map(([k, v]) => `${esc(k)}=${esc(v)}`).join("<br>"))}
    </div>`;
}

// Security: the image a build made, scanned with Grype once it's in Kiri.
function blSecurity() {
  const L = ui.bl.layers;
  if (!L) return `<div class="bl-loading muted">Reading the image…</div>`;
  if (L.error) return `<p class="bl-none">${esc(L.error)}</p>`;
  if (!L.images?.length) return `<p class="bl-none">This build made no image to scan: it failed before exporting, or its output was the cache only.</p>`;
  const im = L.images.find((i) => i.platform === ui.bl.plat) || L.images[0];
  const img = ui.images.find((i) => i.Id === im.config_digest);
  if (!img) return `<p class="bl-none">This build's image isn't in Kiri, so there's nothing here to scan. It was pushed or exported elsewhere, or removed since. Build it with <code>--load</code> to scan it here.</p>`;
  return scanView(img, { own: "this build" });
}

/* Scanning: Grype, run on the Mac against Kiri's store. One image's scan,
   keyed by its ID; the same view for a build and for an image's page. */
const SEVS = ["Critical", "High", "Medium", "Low", "Negligible", "Unknown"];
const sevKey = (s) => (SEVS.includes(s) ? s : "Unknown").toLowerCase();

const poweredBy = () => `<button class="sc-by" data-open-grype title="Grype, the open-source scanner from Anchore">Powered by <img src="${GRYPE_MARK}" alt=""><b>Grype</b><span class="muted">· Anchore</span></button>`;
const sevCounts = (c) => SEVS.filter((x) => c[x]).map((x) => `<span class="sc-sev ${sevKey(x)}">${c[x]} ${x}</span>`).join("") || `<span class="muted">None found</span>`;
const when = (t) => new Date(t * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

// An image's scans: the history first, one scan open over it with a close.
function scanView(img, words) {
  const id = img.Id;
  let st = ui.scans.get(id);
  if (!st) { st = { history: null }; ui.scans.set(id, st); send("scanhistory", { name: id }); }
  const label = img.RepoTags?.[0] || short(id);
  const err = st.error ? `<p class="sc-err">${esc(st.error)}</p>` : "";
  if (st.running) {
    const pct = st.phase === "scanner" ? st.pct : null;
    return `<div class="sc-run"><div class="sc-runline"><span class="sc-spin" aria-hidden="true"></span><b>${SCAN_PHASE[st.phase] || "Starting the scan"}</b><span class="spacer"></span>${poweredBy()}</div>
      ${pct != null ? `<div class="pprog"><div class="pbar"><span style="width:${pct}%"></span></div><span class="num">${pct}%</span></div>` : `<div class="stripe"></div>`}
      <p class="muted">Kiri runs Grype here on your Mac against the image in Kiri's store. The image isn't uploaded anywhere.</p></div>`;
  }
  if (st.open != null) {
    if (st.result?.scanned !== st.open) return `<div class="bl-loading muted">Opening the scan…</div>`;
    return scanResult(img, st.result, words, err);
  }
  if (!st.history) return st.histErr ? `<p class="sc-err">${esc(st.histErr)}</p>` : `<div class="bl-loading muted">Reading the scans…</div>`;
  if (!st.history.length) return `<form class="sc-intro" data-scanform="${esc(id)}">
      <div class="sc-introtop">${BL_ICON("shieldcheck")}<b>Scan ${esc(label)} for known vulnerabilities</b></div>
      <p class="muted">Kiri finds every package in the image (OS packages, language libraries and binaries) and checks each against a vulnerability database. No scans yet: run the first one.</p>
      ${scannerOptions(scannerFresh(id))}
      ${err}<div class="sc-go"><button type="submit" class="btn primary">Start scan</button></div></form>`;
  const rows = st.history.map((h, n) => `<tr class="sc-hrow" data-scanat="${h.scanned}" data-scanimg="${esc(id)}">
      <td><b>${when(h.scanned)}</b><div class="muted">${ago(h.scanned)}${n === 0 ? " · latest" : ""}</div></td>
      <td><div class="sc-counts">${sevCounts(h.counts || {})}</div></td>
      <td class="r num">${h.vulns}</td><td class="r num">${h.fixable}</td><td class="r num">${h.packages}</td>
      <td class="muted">${h.db ? new Date(h.db).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : ""}</td>
    </tr>`).join("");
  return `<div class="sc">
    <div class="sc-head"><b>Scans</b><span class="muted">${st.history.length} of this image, newest first</span><span class="spacer"></span>${poweredBy()}${btn("Scan image", `data-scan="${esc(id)}"`, "primary")}</div>
    ${err}
    <div class="sc-table"><table>
      <thead><tr><th>Scanned</th><th>Found</th><th class="r">Vulnerabilities</th><th class="r">With a fix</th><th class="r">Packages</th><th>Database</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>`;
}

// The scanners to pick from, in the first-scan card and the Scan image dialog.
const scannerOptions = (fresh) => `<fieldset class="sc-opts"><legend class="muted">Scan with</legend>
    <label class="sc-opt"><input type="radio" name="scanner" value="grype" checked>
      <img src="${GRYPE_MARK}" alt="">
      <span><b>Grype</b> <span class="muted">· Anchore, open source</span><br>
      <span class="muted">Runs here on your Mac against Kiri's copy of the image; nothing is uploaded.${fresh ? " The first scan downloads Grype and its database, about 230 MB (3 GB unpacked)." : ""}</span></span></label>
  </fieldset>`;
const scannerFresh = (id) => !ui.scans.get(id)?.history?.length && ![...ui.scans.values()].some((x) => x.history?.length);

// Scan image: pick the scanner first. Grype is the one there is, and it runs here.
function startScan(id) {
  const x = ui.scans.get(id) || {};
  ui.scans.set(id, { ...x, running: true, phase: "", error: null });
  send("scan", { name: id });
  rerenderScan();
}
function chooseScanner(id) {
  const img = ui.images.find((i) => i.Id === id);
  const label = img?.RepoTags?.[0] || short(id);
  const fresh = scannerFresh(id);
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<form class="dialog sc-pick" role="dialog" aria-modal="true" aria-labelledby="sc-pick-title">
      <h3 id="sc-pick-title">Scan ${esc(label)}</h3>
      ${scannerOptions(fresh)}
      <div class="row-end"><span></span><span><button type="button" class="btn" data-close>Cancel</button> <button type="submit" class="btn primary">Start scan</button></span></div>
    </form>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", (ev) => { if (ev.target === scrim || ev.target.closest("[data-close]")) close(); });
  scrim.querySelector("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    if (new FormData(ev.target).get("scanner") === "grype") { close(); startScan(id); }
  });
  scrim.querySelector("[type=submit]").focus();
}

// One scan's findings, with a close back to the history.
function scanResult(img, r, words, err) {
  const id = img.Id, label = img.RepoTags?.[0] || short(id);
  const f = ui.scanf;
  const counts = Object.fromEntries(SEVS.map((x) => [x, 0]));
  for (const v of r.vulns) counts[SEVS.includes(v.severity) ? v.severity : "Unknown"]++;
  const fixable = r.vulns.filter((v) => v.fixed?.length).length;
  const own = r.vulns.filter((v) => v.base === false).length;
  const shown = r.vulns.filter((v) => (!f.sev || v.severity === f.sev) && (!f.fix || v.fixed?.length) && (!f.own || v.base === false));
  const chips = SEVS.filter((x) => counts[x] || x === "Critical" || x === "High").map((x) =>
    `<button class="sc-chip ${sevKey(x)}" data-scansev="${x}" aria-pressed="${f.sev === x}"><b>${counts[x]}</b> ${x}</button>`).join("");
  const db = r.db ? new Date(r.db).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
  const rows = shown.map((v) => `<tr>
      <td><span class="sc-sev ${sevKey(v.severity)}">${esc(v.severity)}</span></td>
      <td class="mono">${v.url ? `<button class="sc-link" data-advisory="${esc(v.url)}" title="${esc(v.url)}">${esc(v.id)}</button>` : esc(v.id)}</td>
      <td><span class="mono">${esc(v.package)}</span> <span class="muted mono">${esc(v.version)}</span><div class="muted sc-kind">${esc(v.kind || "")}</div></td>
      <td class="mono">${v.fixed?.length ? esc(v.fixed.join(", ")) : `<span class="muted">No fix yet</span>`}</td>
      <td class="sc-where" title="${esc(v.by || "")}">${v.base == null ? `<span class="muted">—</span>` : v.base ? `<span class="muted">Base image</span>` : `<span>${esc(words.own[0].toUpperCase() + words.own.slice(1))}</span>`}${v.by ? `<div class="muted mono">${esc(v.by)}</div>` : ""}</td>
    </tr>`).join("");
  return `<div class="sc">
    <div class="sc-head">
      <b>Scan of ${when(r.scanned)}</b>
      <span class="spacer"></span>
      ${btn("Save SBOM", `data-sbom="${esc(id)}" data-sbomat="${r.scanned}" data-sbomname="${esc(label)}" title="The ${r.packages} packages as CycloneDX JSON, saved to Downloads"`)}
      ${btn("Scan again", `data-scan="${esc(id)}"`)}
      <button class="sc-close" data-scanclose="${esc(id)}" title="Close this scan" aria-label="Close this scan">×</button>
    </div>
    <div class="sc-chips">${chips}</div>
    <div class="sc-meta muted">${r.vulns.length ? `${r.vulns.length} vulnerabilit${r.vulns.length === 1 ? "y" : "ies"} in ${r.packages} packages · ${fixable} with a fix · ${own} from ${esc(words.own)}` : `No known vulnerabilities in ${r.packages} packages`} · ${ago(r.scanned)}${db ? ` · database from ${db}` : ""} · Grype ${esc(r.grype)}</div>
    ${err}
    ${r.vulns.length ? `<div class="sc-filters">
      <label><input type="checkbox" data-scanfix ${f.fix ? "checked" : ""}> Has a fix</label>
      <label><input type="checkbox" data-scanown ${f.own ? "checked" : ""}> Only from ${esc(words.own)}</label>
      ${f.sev || f.fix || f.own ? `<span class="muted">${shown.length} shown</span><button class="sc-link" data-scanclear>Clear</button>` : ""}
    </div>
    <div class="sc-table"><table>
      <thead><tr><th>Severity</th><th>Vulnerability</th><th>Package</th><th>Fixed in</th><th>Layer</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="5" class="muted">None match these filters.</td></tr>`}</tbody>
    </table></div>` : ""}
  </div>`;
}
function rerenderScan() {
  if (ui.view === "builds") renderBuilds();
  else if (ui.view === "images" && ui.imgd) render();
}

// The first-scan card's own Start scan.
document.addEventListener("submit", (ev) => {
  const f = ev.target.closest("[data-scanform]");
  if (!f) return;
  ev.preventDefault();
  if (new FormData(f).get("scanner") === "grype") startScan(f.dataset.scanform);
});

document.addEventListener("click", (ev) => {
  const t = (q) => ev.target.closest(q), b = ui.bl;
  let el;
  if ((el = t("[data-bl]"))) { const x = b.items.find((i) => i.id === el.dataset.bl); if (x && x.id !== b.sel?.id) { pickBuild(x); renderBuilds(); } }
  else if ((el = t("[data-bltab]"))) {
    b.tab = el.dataset.bltab;
    if ((b.tab === "layers" || b.tab === "security") && b.sel && b.layers?.id !== b.sel.id) send("buildlayers", { name: b.sel.builder, id: b.sel.id });
    renderBuilds();
  }
  else if ((el = t("[data-blplat]"))) { b.plat = el.dataset.blplat; renderBuilds(); }
  else if ((el = t("[data-blstep]"))) { const n = el.dataset.blstep; b.open.has(n) ? b.open.delete(n) : b.open.add(n); renderBuilds(); }
  else if (t("[data-blall]")) {
    const steps = (b.d?.steps || []).filter((x) => (b.internal || !blInternal(x.name)) && (x.log || x.error));
    const all = steps.every((x) => b.open.has(x.name));
    b.open = all ? new Set() : new Set(steps.map((x) => x.name)); renderBuilds();
  }
  else if ((el = t("[data-blrm]"))) {
    const a = el.dataset.blrm;
    if (a === "ask") b.confirm = b.sel?.id;
    else if (a === "no") b.confirm = null;
    else if (b.sel) { send("rmbuild", { name: b.sel.builder, id: b.sel.id }); b.items = b.items.filter((x) => x.id !== b.sel.id); b.sel = null; b.d = null; b.confirm = null; if (b.items[0]) pickBuild(b.items[0]); }
    render();
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.matches("[data-blsteps]")) { ui.bl.steps = ev.target.value; renderBuilds(); }
  else if (ev.target.matches("[data-blinternal]")) { ui.bl.internal = ev.target.checked; renderBuilds(); }
});
// Back to the window (it doesn't tick while hidden): ask at once rather than at the next 15 s.
document.addEventListener("visibilitychange", () => { if (!document.hidden && ui.view === "builds" && ui.vm !== "stopped") send("builds"); });
// While the view is open: every 15 s, or every 2 s during a build.
setInterval(() => {
  if (ui.view !== "builds" || document.hidden || ui.vm === "stopped") return;
  const busy = ui.bl.items?.some((x) => x.status === "Running");
  if (busy || (Date.now() / 1000 | 0) % 15 < 2) send("builds");
}, 2000);

// Feedback goes to the repo's GitHub issues; the app's "open" handler allows exactly this address.
const FEEDBACK_URL = "https://github.com/libracoder/kiri/issues/new";

/* The VM's memory: under 1 GB in MB, so an idle VM doesn't read as "0.2". */
const memText = (mib) => (mib < 1024 ? `${Math.round(mib)} MB` : `${(mib / 1024).toFixed(1)} GB`);
const memTitle = () => !ui.mem?.target ? `The ${VM.toLowerCase()} is asleep: it holds no memory`
  : LINUX ? `Kiri's containers and engine use ${memText(ui.mem.used)}, of the ${memText(ui.mem.ceiling)} this computer has.`
  : WIN ? `Kiri's containers, engine and agent hold ${memText(ui.mem.used)} of the ${memText(ui.mem.ceiling)} WSL has (.wslconfig sets that).`
  : `In use ${memText(ui.mem.used)}. The VM may take up to ${memText(ui.mem.target)} right now, and grows as containers need more.`;
/* What Kiri's window costs this computer (ui/usage.rs): memory and CPU of
   the window and the processes that draw this page, not the Linux VM. */
function usageItem() {
  const u = ui.usage;
  if (!u) return "";
  // The engine counts CPU per core (100% = one core busy); shown as a share of
  // the whole computer, which is what a reader takes "CPU" to mean.
  const cores = Math.max(1, u.cores || 1);
  const cpu = (c) => `${pct(c / cores)} CPU`;
  const why = `What Kiri's window uses on this ${HOST}, not counting the ${VM}:\n`
    + (u.parts || []).map((p) => `${p.name}${p.n > 1 ? ` (${p.n} processes)` : ""}: ${size(p.mem)} · ${cpu(p.cpu)}`).join("\n")
    + `\n\nCPU is a share of all ${cores} cores: 100% would be every core busy.`;
  return `<span class="sep">·</span><span class="num use" title="${esc(why)}">${size(u.mem)} · ${cpu(u.cpu)}</span>`;
}
// Every 5 s while the window shows; nothing while it's hidden.
setInterval(() => { if (!document.hidden) send("usage"); }, 5000);
send("usage");

/* Replaces an element's content only when it would change: the VM's figures
   (every 2 s) and the window's usage (every 5 s) mostly come back the same,
   and rewriting the same markup still lays out and repaints it. */
function setHTML(el, html) {
  if (el && el._html !== html) { el.innerHTML = html; el._html = html; }
}
const setText = (el, text) => { if (el && el.textContent !== text) el.textContent = text; };

function renderStatus() {
  const sb = $("statusbar");
  if (!sb) return;
  const running = ui.containers.filter((c) => c.State === "running");
  const k8s = ui.containers.find((c) => c.Names?.[0] === "/kiri-k8s" && c.State === "running");
  const k8sVersion = k8s ? (k8s.Image.split(":")[1] || "").replace(/-k3s\d+$/, "") : "";
  const { shown: vshown } = engineShown();
  const vmText = { running: `${VM} running`, stopped: `${VM} off`, booting: "Starting…", stopping: "Stopping…" }[vshown] || vshown;
  const mem = ui.mem ? `${memText(ui.mem.used)} of ${Math.round(ui.mem.ceiling / 1024)} GB` : "";
  const parts = [
    `<span class="item">${KDOT}<span>Kiri ${esc(ui.status?.version || "")}</span>${ui.status?.dev ? `<span class="dev" title="${esc(ui.status?.app || "Kiri Dev")}: its own engine, containers and settings">DEV</span>` : ""}</span>`,
    usageItem(),
    updateChip(),
    pullItem(),
    htStatusItem(),
    `<span class="grow"></span>`,
    shareOn() ? shStatusItem() : "",
    `<span class="item"><i class="dot ${esc(vshown)}"></i>${esc(vmText)}</span>`,
    ui.vm === "running" ? `<span class="sep">·</span><button data-status-go="containers" title="Show containers">${running.length} of ${ui.containers.length} running</button>` : "",
    ui.vm === "running" && mem ? (memOut()
      ? `<span class="sep">·</span><button class="item memfull" data-memmore title="${esc(memTitle())}. Give the VM more memory in Settings → Resources">${MEM_IC}Memory full · ${mem}</button>`
      : `<span class="sep">·</span><span class="num" title="${esc(memTitle())}">${mem}</span>`) : "",
    k8s ? `<span class="sep">·</span><span class="item"><svg class="k8s" viewBox="0 0 24 24" aria-hidden="true"><path d="${K8S_LOGO}"/></svg>Kubernetes ${esc(k8sVersion)}</span>` : "",
    ctxStatusItem(),
    `<span class="sep">·</span><button class="item" data-open-site="${FEEDBACK_URL}" title="Send an idea or report a bug on GitHub"><svg class="i" viewBox="0 0 256 256"><path d="${PH.chatdots}"/></svg>Feedback</button>`,
  ];
  setHTML(sb, parts.join(""));
}

/* Updates (design A): a card in the bottom-right corner offers a newer
   release (Download, Snooze, Skip this version, × until the next launch);
   the download shows in the status bar; then Restart now or Later, which
   installs it when Kiri quits. After a Later the engine may still run the
   older build: the card offers to restart it. */
const UPD_ICON = {
  up: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16V8M8.5 11.5 12 8l3.5 3.5"></path></svg>`,
  ok: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>`,
  down: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 20h14"></path></svg>`,
  x: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>`,
};
let wnModal = null; // the What's new window, when open
const mbs = (b) => `${(b / 1048576).toFixed(1)}`;

function updateChip() {
  const u = ui.upd;
  if (u?.phase === "downloading") {
    const pct = u.total ? Math.min(100, Math.round((u.got / u.total) * 100)) : 0;
    const secs = (Date.now() - u.t0) / 1000, rate = secs > 1 ? (u.got - u.g0) / secs : 0;
    const left = u.total && rate > 0 ? Math.max(1, Math.round((u.total - u.got) / rate)) : 0;
    const tip = u.total ? `${mbs(u.got)} of ${mbs(u.total)} MB${left ? ` · about ${left < 90 ? `${left} s` : `${Math.round(left / 60)} min`} left` : ""}` : `${mbs(u.got)} MB`;
    return `<span class="upd" title="${esc(tip)}">${UPD_ICON.down}<span>Downloading ${esc(u.version)}</span><span class="track"><i style="width:${pct}%"></i></span><span class="num">${pct}%</span><button class="x" data-upd="cancel" aria-label="Cancel download">${UPD_ICON.x}</button></span>`;
  }
  if (u?.phase === "ready") return `<button class="upd ok" data-upd="show" title="Installs when you quit Kiri">${UPD_ICON.ok}${esc(u.version)} ready</button>`;
  if (u?.phase === "available" && u.hidden) return `<button class="badge" data-upd="show" title="Show the update">${esc(u.version)} available</button>`;
  if (ui.engineStale && ui.staleHidden) return `<button class="badge" data-upd="showengine" title="The engine still runs Kiri ${esc(ui.engineStale)}">Restart engine to finish</button>`;
  return "";
}

/* About's update row: this version and what the last check found
   ("updatestate"), or the card's download as it goes (ui.upd). Linux's
   kiri is a .deb or .rpm installed by hand (there's no apt or dnf repository
   yet), so it links to the releases page; test builds and Kiri Dev don't
   update themselves, so those say so instead of offering a download. */
function aboutUpdate(version) {
  const u = ui.upd, s = ui.updState, v = esc(s?.current || version || "");
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const check = s?.checking ? `<span class="faint">Checking…</span>` : `<button class="linkbtn" data-updcheck>Check now</button>`;
  let row;
  if (u?.phase === "downloading") {
    const pct = u.total ? Math.round((u.got / u.total) * 100) : 0;
    row = `<span>Downloading ${esc(u.version)}</span><span class="updbar"><span style="width:${pct}%"></span></span><span class="faint">${u.total ? `${(u.got / 1e6).toFixed(0)} of ${(u.total / 1e6).toFixed(0)} MB` : ""}</span><button class="linkbtn" data-upd="cancel">Cancel</button>`;
  } else if (u?.phase === "ready") {
    row = `<span>Kiri ${esc(u.version)} is downloaded</span>${btn("Restart to update", 'data-upd="restart"', "primary")}`;
  } else if (u?.phase === "available") {
    const whatsNew = u.notes.trim() || NOTES_URL.test(u.notesUrl) ? `<button class="linkbtn" data-upd="notes">What's new</button>` : "";
    row = `<span>Version ${v}</span><span class="updpill new">${esc(u.version)} available</span>${btn(u.error ? "Try again" : "Download", 'data-upd="download"', "primary")}${whatsNew}`;
  } else if (s?.state === "available") {
    row = `<span>Version ${v}</span><span class="updpill new">${esc(s.latest)} available</span>${btn("Show", "data-updcheck", "primary")}`;
  } else if (s?.state === "package") {
    row = `<span>Version ${v}</span>${s.latest ? `<span class="updpill new">${esc(s.latest)} available</span><button class="linkbtn" data-open-site="https://runkiri.com/releases/">Download the new .deb or .rpm</button>` : `<span class="updpill">Up to date</span><span class="faint">checked ${ago(s.checked)}</span>${check}`}`;
  } else if (s?.state === "test" || s?.state === "dev") {
    row = `<span>Version ${v}</span><span class="updpill test">${s.state === "dev" ? "Built from source" : "Test build"}</span><span class="faint">doesn't update itself</span>`;
  } else if (s?.state === "uptodate") {
    row = `<span>Version ${v}</span><span class="updpill">Up to date</span><span class="faint">checked ${ago(s.checked)}</span>${check}`;
  } else if (s?.state === "error") {
    row = `<span>Version ${v}</span><span class="faint">Couldn't check: ${esc(s.error || "")}</span>${check}`;
  } else row = `<span>Version ${v}</span>${check}`;
  const notes = u?.phase === "available" && u.notes.trim() ? `<div class="updnotes"><b>What's new in ${esc(u.version)}</b>${notesHtml(u.notes)}</div>` : "";
  const fixed = s?.state === "test" || s?.state === "dev";
  const auto = prefs.updateAuto !== false;
  return `<div class="updrow">${row}</div>${notes}${fixed ? "" : `<div class="pref"><span class="t">Check for updates automatically</span><span class="d">${auto ? "On: Kiri checks each time it opens. It never updates without asking." : "Off: Kiri checks only when you click Check now."}</span>
      <div class="seg" role="group" aria-label="Check for updates automatically"><button data-updauto="0" aria-pressed="${!auto}">Off</button><button data-updauto="1" aria-pressed="${auto}">On</button></div></div>`}`;
}

function renderUpdate() {
  renderStatus();
  if (ui.view === "settings" && prefs.tab === "about") render();
  if (wnModal) { if (ui.upd) wnModal.querySelector("[data-wngo]").innerHTML = notesGo(); else closeNotes(); }
  const el = $("updcard"), u = ui.upd;
  const card = (ic, title, sub, close, body) => `<div class="updcard" role="dialog" aria-label="${esc(title)}">
    <div class="head"><div class="ic ${ic === "ok" ? "ok" : ""}">${UPD_ICON[ic]}</div><div class="txt"><h4>${esc(title)}</h4><div class="sub">${sub}</div></div>
    ${close ? `<button class="close" data-upd="${close}" aria-label="Close" title="Hide until Kiri next opens">${UPD_ICON.x}</button>` : ""}</div>${body}</div>`;
  if (u && !u.hidden && u.phase === "available") {
    const whatsNew = u.notes.trim() || NOTES_URL.test(u.notesUrl) ? ` · <button data-upd="notes">What's new</button>` : "";
    const sub = `You have ${esc(u.current)}${whatsNew}${u.error ? `<div class="err">Couldn't download it: ${esc(u.error)}</div>` : ""}`;
    el.innerHTML = card("up", `Kiri ${u.version} is available`, sub, "hide", `<div class="row">
      ${btn(u.error ? "Try again" : "Download", 'data-upd="download"', "primary")}
      ${u.snoozing ? `<span class="snooze">${btn("Tomorrow", 'data-upd="snooze1"')}${btn("In a week", 'data-upd="snooze7"')}</span>` : btn("Snooze ▾", 'data-upd="snooze" aria-haspopup="true"')}
      <button class="skip" data-upd="skip">Skip this version</button></div>`);
  } else if (u && !u.hidden && u.phase === "ready") {
    el.innerHTML = card("ok", `Kiri ${u.version} is ready to install`, "Restart Kiri to finish. Running containers stop, and those with a restart policy start again." + (u.error ? `<div class="err">${esc(u.error)}</div>` : ""), "", `<div class="row">${btn("Restart now", 'data-upd="restart"', "primary")}${btn("Later", 'data-upd="later"')}</div>
      <div class="foot">Later installs it when you quit Kiri.</div>`);
  } else if (ui.engineStale && !ui.staleHidden && (!u || u.hidden || u.phase === "downloading")) {
    el.innerHTML = card("up", `Finish updating to Kiri ${ui.status?.version || ""}`, `The engine still runs ${esc(ui.engineStale)}. Restarting it stops running containers, and those with a restart policy start again.`, "", `<div class="row">${btn("Restart engine", 'data-upd="engine"', "primary")}${btn("Later", 'data-upd="enginelater"')}</div>`);
  } else el.innerHTML = crashCard();
}

function updateAction(a) {
  const u = ui.upd;
  const snooze = (days) => { setPref("updateSnoozeUntil", Date.now() + days * 86400000); u.hidden = true; u.snoozing = false; };
  switch (a) {
    case "download": Object.assign(u, { phase: "downloading", t0: Date.now(), g0: 0, got: 0, total: 0, error: "" }); send("updatedownload"); break;
    case "cancel": send("updatecancel"); break;
    case "hide": case "later": u.hidden = true; break;
    case "show": u.hidden = false; break;
    case "snooze": u.snoozing = true; break;
    case "snooze1": snooze(1); break;
    case "snooze7": snooze(7); break;
    case "skip": setPref("updateSkip", u.version); ui.upd = null; break;
    case "notes": if (u.notes.trim()) openNotes(); else send("updatenotes", { name: u.notesUrl }); break;
    case "restart": send("updaterestart"); break;
    case "engine": send("restartengine"); ui.engineStale = null; break;
    case "enginelater": ui.staleHidden = true; break;
    case "showengine": ui.staleHidden = false; break;
  }
  renderUpdate();
}

/* What's new: the feed's notes, a small Markdown ("## New", "- a line", `code`,
   **bold**), in a window with Download. Without notes, the button opens notes_url. */
const NOTES_URL = /^https:\/\/runkiri\.com\//;

const WN_KIRI = `<svg class="wn-kiri" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(6 0) skewX(-10)"><clipPath id="wnlid"><rect x="22" y="12" width="34" height="40" rx="10"/></clipPath>

  <g fill="#0F1419"><ellipse cx="41.5" cy="29" rx="3.1" ry="3.6"/><ellipse cx="50.5" cy="29" rx="3.1" ry="3.6"/></g></g>
  <g class="speed" fill="currentColor" opacity=".55"><rect x="5" y="21.5" width="13" height="5" rx="2.5"/><rect x="1" y="32" width="15" height="5" rx="2.5"/><rect x="7" y="42.5" width="7" height="5" rx="2.5"/></g></svg>`;

/* A plain notice: the box settles on the stack with a tick, or jolts with a
   cross. Errors stay longer, and any toast stays while the pointer is on it.
   An error from an action (`op`) offers its log lines: Details and Copy. */
/* Out of memory: one flat red notice with a memory chip, wherever memory is
   the reason something stopped or waits, so it never just looks stuck. The
   guest reports PSI (the share of time everything waited on memory) and the
   kernel's kills; memory counts as out when it stalls or is all but used. */

const oomLine = (title, sub, acts = btn("More memory", "data-memmore")) =>
  `<div class="oom" role="status"><span class="oic">${MEM_IC}</span><span class="t"><b>${title}</b> <span class="s">${sub}</span></span>${acts}</div>`;
/* For a screen that waits on the VM: say memory is why, once it is. */
const oomWait = () => (memOut() ? oomLine("Slow because the VM is out of memory", `· ${memFree()}`) : "");
function oomToast(title, sub) {
  const el = document.createElement("div");
  el.className = "oom toast"; el.setAttribute("role", "alert");
  el.innerHTML = `<span class="oic">${MEM_IC}</span><span class="t"><b>${esc(title)}</b> <span class="s">${esc(sub)}</span></span>${btn("More memory", "data-memmore")}<button class="btn ghost" data-oomx aria-label="Dismiss">✕</button>`;
  el.addEventListener("click", (ev) => { if (ev.target.closest("[data-oomx]")) el.remove(); else if (ev.target.closest("[data-memmore]")) { el.remove(); memMore(); } });
  $("toasts").append(el);

}
function memMore() { prefs.tab = "resources"; show("settings"); }
document.addEventListener("click", (ev) => { if (ev.target.closest("[data-memmore]") && !ev.target.closest(".oom.toast")) memMore(); });

const oomSeen = new Set();

  }

    el.querySelector("[data-trestart]").addEventListener("click", () => { el.remove(); send("restartvm"); });
  }

/* Run says a container started only once it stays up: the button spins a
   few seconds more while Kiri watches it, and one that stops with an error
   in that time, or within 10 s, is said to have failed, with why (the tip
   turns red when its last log lines arrive). */
const RUN_SAY = 3000, RUN_WATCH = 10000;
const runHeld = (image) => [...ui.runWatch.values()].some((w) => w.image === image && !w.said);
function runHold(image, text, id, ms) {
  ui.runWatch.set(id, { image, text, ms, said: false });
  setTimeout(() => runSay(id), RUN_SAY);
  setTimeout(() => ui.runWatch.delete(id), RUN_WATCH);
  if (ui.view === "images") render();
}
function runSay(id) {
  const w = ui.runWatch.get(id);
  if (!w || w.said) return;
  w.said = true;
  if (ui.view === "images") render();
  if (!runTip(w.image, w.text, id)) toast("ok", w.text, null, id);
  const c = ui.containers.find((x) => x.Id === id);
  if (c) starMoment(`Kiri started ${cname(c)}${w.ms ? ` in ${w.ms < 1000 ? `${w.ms} ms` : `${(w.ms / 1000).toFixed(1)} s`}` : ""}.`);
}
function runWatchCheck() {
  for (const [id, w] of ui.runWatch) {
    const c = ui.containers.find((x) => x.Id === id);
    if (!c || ["running", "created", "restarting", "paused"].includes(c.State)) continue;
    ui.runWatch.delete(id);
    const name = (c.Names?.[0] || "").replace(/^\//, ""), secs = c.KiriStartedAt && c.KiriFinishedAt ? Math.max(1, c.KiriFinishedAt - c.KiriStartedAt) : 0;
    const said = w.said;
    w.said = true;
    if (ui.view === "images") render();
    // A clean exit is a container that did its job and finished.
    if (!c.KiriExitCode && c.State !== "dead" && !ui.startErr[id]) { if (!said && !runTip(w.image, `${name} ran and finished`, id)) toast("ok", `${name} ran and finished`, null, id); continue; }
    askWhy(c);
    const text = `${name} stopped${secs ? ` after ${secs} s` : ""}`;
    if (!said && runTip(w.image, text, id)) {
      const tip = document.querySelector(".run-tip");
      tip.classList.add("fail"); tip.setAttribute("role", "alert");
      tip.querySelector("svg").innerHTML = `<path d="${PH.warning}"/>`;
      tip.querySelector("[data-tview]").textContent = "See why";
      clearTimeout(tip.timer); tip.timer = setTimeout(() => tip.remove(), 15000);
      runTipFailed(id);
    } else if (!document.querySelector(`.run-tip[data-id="${CSS.escape(id)}"]`)) toast("error", `${text} with an error.`, null, id, null, true);
  }
}

/* Kubernetes in a container (k3s, kind's node, minikube's): Kiri runs its own
