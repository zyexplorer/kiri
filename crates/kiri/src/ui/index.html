<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiri</title>
<style>
/* Kiri window. Hand-written, no framework: only the rules this page uses. */
:root {
  --blue: #0D6EFD; --blue-hover: #0B5ED7; --blue-active: #0A58CA; --blue-light: #6EA8FE;
  --moss: #3FB68B; --sun: #FFC23D; --red: #DC3545;
  /* The same hues as small text, at 4.5:1 or better on the panels. */
  --sun-text: #FFC23D; --red-text: #F87171;
  /* External: a share another computer on the account runs. */
  --ext: #A78BFA; --ext-text: #C4B5FD;
  --bg: #0F1419; --side: #121920; --panel: #171D24; --raised: #1E252D; --line: #2A313A;
  --text: #F2F0EB; --muted: #98A1AC; --faint: #66707C;
  --row-hover: rgba(255, 255, 255, .035);
  --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  --mono-font: ui-monospace, "SF Mono", Menlo, monospace;
  font: var(--fs)/1.4 var(--ui-font);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F5F7FA; --side: #EDF0F5; --panel: #FFFFFF; --raised: #F3F5F9; --line: #DDE3EB;
    --text: #0F1419; --muted: #5E6773; --faint: #8A929C; --row-hover: rgba(15, 20, 25, .035);
    --sun-text: #8A6100; --red-text: #B42318; --ext-text: #6941C6;
    color-scheme: light;
  }
}
/* Type: four sizes, and nothing else (tests/ui/type.js checks). Small print,
   the base everything you read is set in, section headings, page titles.
   Values in code (IDs, commands, paths, env) sit half a step under the base,
   since a monospace face reads larger at the same size. font-size-adjust
   gives every font the same lowercase height, so a monospace or interface
   font you pick looks as big as the others. */
:root { --fs-small: 11px; --fs: 12px; --fs-mono: 11.5px; --fs-head: 14px; --fs-title: 18px;
  /* Logs and anything read like one (requests, diagnostics, build output):
     one size, small print unless Settings → Log text says otherwise. */
  --fs-log: var(--log-size, var(--fs-small)); }
html { font-size: var(--fs); font-size-adjust: 0.5; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { display: grid; grid-template-columns: 212px 1fr; grid-template-rows: var(--strip-h) minmax(0, 1fr) auto; --strip-h: 44px; -webkit-user-select: none; user-select: none; cursor: default; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.mono { font: var(--fs-mono) var(--mono-font); }
svg.i { width: 16px; height: 16px; fill: currentColor; flex: none; }

/* --- buttons: flat, Bootstrap blue ------------------------------------------------ */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 14px;
       border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
       font: 600 var(--fs)/1 var(--ui-font); cursor: pointer; white-space: nowrap;
       transition: background-color .15s, border-color .15s, color .15s; }
.btn:hover { background: var(--raised); border-color: var(--faint); }
.copied-tip { position: fixed; z-index: 1000; transform: translate(-50%, -100%); pointer-events: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px 5px 8px; border-radius: 8px; white-space: nowrap; font: 600 var(--fs-small) var(--ui-font); color: #B9F0D2; background: #0F2A1F;
  border: 1px solid color-mix(in srgb, var(--moss) 55%, transparent); box-shadow: 0 6px 18px rgb(0 0 0 / .45); animation: copied-rise .18s ease-out; }
.copied-tip svg { width: 12px; height: 12px; fill: var(--moss); }
.copied-tip::after { content: ""; position: absolute; left: 50%; bottom: -5px; width: 8px; height: 8px; margin-left: -4px; transform: rotate(45deg); background: #0F2A1F;
  border-right: 1px solid color-mix(in srgb, var(--moss) 55%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--moss) 55%, transparent); }
.copied-tip.out { opacity: 0; transform: translate(-50%, calc(-100% - 4px)); transition: opacity .2s, transform .2s; }
@keyframes copied-rise { from { opacity: 0; transform: translate(-50%, calc(-100% + 4px)); } }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 .25rem color-mix(in srgb, var(--blue) 25%, transparent); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-hover); border-color: var(--blue-hover); }
.btn.primary:active { background: var(--blue-active); border-color: var(--blue-active); }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: rgba(220, 53, 69, .1); border-color: rgba(220, 53, 69, .5); }
.btn.sm { height: 26px; padding: 0 10px; font-size: var(--fs); border-radius: 5px; }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }

input.field { height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel);
              color: var(--text); font: inherit; outline: none; min-width: 0; }
input.field:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
input.field::placeholder { color: var(--faint); }

/* --- sidebar -------------------------------------------------------------------------- */
aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column;
        padding: 8px 12px 14px; gap: 2px; }

/* --- the strip ----------------------------------------------------------------------------
   Across the top: on the Mac it holds the traffic lights (ui/mod.rs moves
   them into it) and drags the window; then the sidebar button, back and
   forward, empty room to drag by, search and Settings. On Windows it sits
   under Windows' own title bar. */
.strip { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 12px; background: var(--side); border-bottom: 1px solid var(--line); }
.strip .lights { width: 74px; flex: none; }
body.win .strip .lights, body.linux .strip .lights { display: none; }
.strip .gap { width: 6px; flex: none; }
.strip .drag { flex: 1; align-self: stretch; min-width: 24px; }
.sb { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: transparent; color: var(--muted);
      cursor: pointer; flex: none; transition: background-color .15s, color .15s, opacity .15s; }
.sb svg { width: 16px; height: 16px; fill: currentColor; }
.sb:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
.sb:active { background: color-mix(in srgb, var(--text) 12%, transparent); }
.sb[aria-pressed=true] { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
.sb:disabled { opacity: .3; cursor: default; background: transparent; color: var(--muted); }
.sb:focus-visible { outline: none; box-shadow: 0 0 0 .2rem color-mix(in srgb, var(--blue) 35%, transparent); }
.sb.chev svg { width: 15px; height: 15px; }
.sb.back svg { transform: scaleX(-1); }
.gfind { display: flex; align-items: center; gap: 7px; width: 280px; height: 28px; padding: 0 5px 0 10px; margin-right: 6px; border-radius: 8px; cursor: text; flex: none;
         background: var(--panel); border: 1px solid var(--line); transition: background-color .15s, border-color .15s, box-shadow .15s, width .2s ease; }
.gfind:hover { border-color: color-mix(in srgb, var(--text) 22%, var(--line)); }
.gfind:focus-within { width: 400px; background: var(--panel); border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
.gfind > svg { width: 14px; height: 14px; color: var(--muted); flex: none; }
.gfind input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; color: var(--text); font: var(--fs) var(--ui-font); outline: none; }
.gfind input::placeholder { color: var(--faint); }
.gfind kbd { flex: none; height: 18px; padding: 0 6px; border-radius: 5px; display: inline-flex; align-items: center; font: 500 var(--fs-small) var(--ui-font);
             color: var(--faint); background: color-mix(in srgb, var(--text) 6%, transparent); transition: opacity .15s; }
.gfind:focus-within kbd { opacity: 0; }
@media (max-width: 900px) { .gfind { width: 200px; } .gfind:focus-within { width: 300px; } }
.about-head .devband { vertical-align: 4px; font-size: var(--fs-small); }
/* Kiri Dev: the icon's blue DEV band, beside the name in the sidebar and About. */
.devband { display: none; padding: 2px 6px 1px; border-radius: 4px; background: #3B86F0; color: #fff; font-size: var(--fs-small); font-weight: 800; letter-spacing: .12em; line-height: 1.3; }
body.dev .devband { display: inline-block; }
.mark { width: 22px; height: 22px; flex: none; }
/* Folded to a rail of icons (the strip's sidebar button, or ⌘B / Ctrl+B). */
:root { --rail: 60px; }
body.anim { transition: grid-template-columns .2s ease; }
body.rail { grid-template-columns: var(--rail) 1fr; }
aside { overflow: hidden; }
body.rail aside { padding-left: 10px; padding-right: 10px; }
body.rail .navlabel { height: 0; padding: 0; margin: 9px 6px; overflow: hidden; border-top: 1px solid var(--line); }
body.rail .navlabel > * { display: none; }
body.rail nav button { justify-content: center; padding: 0; }
body.rail nav .lbl, body.rail nav .count { display: none; }
/* Share's live-links badge rides on the icon's corner. */
body.rail nav button { position: relative; }
body.rail nav .sh-globes { position: absolute; top: 1px; right: 1px; transform: scale(.7); transform-origin: top right; }
body.rail .vm { padding: 12px 0; place-items: center; cursor: pointer; }
body.rail .vm dl, body.rail .vm-head span, body.rail #vm-toggle, body.rail .vm-sub { display: none; }
/* Folded, the VM is a small dot whose live ring beats with the share dots. */
body.rail .vm .dot { width: 6px; height: 6px; position: relative; box-shadow: none; }
body.rail[data-vm=running] .vm .dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--moss); --ring: 2.8; animation: var(--beat); pointer-events: none; }
.mark .speed { fill: currentColor; opacity: .35; transition: opacity .3s; }
[data-vm=running] .mark .speed { opacity: .9; }
[data-vm=booting] .mark .speed { animation: zoom .25s infinite alternate; }

[data-vm=stopped] .mark .eyes, [data-vm=asleep] .mark .eyes { transform: scaleY(.25); transform-origin: 46px 29px; }
.navlabel { font-size: var(--fs); font-weight: 600; color: var(--faint); padding: 10px 8px 4px; text-transform: uppercase; letter-spacing: .06em; }
nav button { display: flex; align-items: center; gap: 9px; width: 100%; height: 31px; padding: 0 8px; border: 0; border-radius: 7px;
             background: transparent; color: var(--muted); font: 500 var(--fs) var(--ui-font); cursor: pointer; text-align: left; }
nav button:hover { background: var(--row-hover); color: var(--text); }
nav button[aria-current=page] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
nav button[aria-current=page] svg { color: var(--blue); }
nav svg.i { width: 17px; height: 17px; }
nav .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav .count { margin-left: auto; font-size: var(--fs); color: var(--faint); font-variant-numeric: tabular-nums; }

.vm { margin-top: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.vm-head { display: flex; align-items: center; gap: 7px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
[data-vm=running] .dot { background: var(--moss); box-shadow: 0 0 0 3px color-mix(in srgb, var(--moss) 25%, transparent); }
[data-vm=booting] .dot, [data-vm=waking] .dot, [data-vm=stopping] .dot { background: var(--sun); animation: pulse .8s infinite alternate; }
[data-vm=asleep] .dot { background: transparent; box-shadow: inset 0 0 0 2px var(--moss); }
.vm-sub { color: var(--faint); font-size: var(--fs-small); margin-top: -6px; }
.vm-head span:last-child { margin-left: auto; font-weight: 500; color: var(--muted); font-size: var(--fs); }
.vm dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: var(--fs); }
.vm dt { color: var(--muted); }
.vm dd .pct { color: var(--muted); font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
.vm dd { text-align: right; font-variant-numeric: tabular-nums; }
.meter { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; grid-column: 1 / -1; }
.meter span { display: block; height: 100%; width: 0; background: var(--blue); transition: width .4s; }

/* --- main ----------------------------------------------------------------------------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 26px 12px 20px; height: 62px; }
.toolbar h2 { font-size: var(--fs-title); letter-spacing: -.01em; }
.toolbar .sub { color: var(--faint); font-size: var(--fs); }
.toolbar .spacer { flex: 1; align-self: stretch; }
[hidden] { display: none !important; }
/* The list's head (Containers, Images, …): the counts beside the title are
   tabs that filter the list, with the strip's search on top. The right side
   holds a one-click clean-up when there is something to clear, then the
   page's own action; picking rows turns it into what to do with them. */
.ltabs { display: flex; align-items: center; gap: 6px; }
body.picking .ltabs { display: none; }
.ltab { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 99px; background: transparent; color: var(--muted);
        font: 500 var(--fs) var(--ui-font); cursor: pointer; white-space: nowrap; transition: background-color .12s, color .12s, border-color .12s; }
.ltab:hover { color: var(--text); background: var(--row-hover); }
.ltab[aria-pressed=true] { color: var(--text); background: color-mix(in srgb, var(--blue) 16%, transparent); border-color: color-mix(in srgb, var(--blue) 50%, transparent); }
/* The pills, then a rule, then the page's own buttons. */
.ltabs:not([hidden]) + .hright:not(:empty)::before { content: ""; width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.ltab .n { color: var(--faint); font-variant-numeric: tabular-nums; }
.ltab[aria-pressed=true] .n { color: var(--muted); }
.ltab.bad .n { color: var(--red-text); }
.ltab i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.ltab i.moss { background: var(--moss); } .ltab i.red { background: var(--red); } .ltab i.sun { background: var(--sun); }
.toolbar .sub { white-space: nowrap; }
.hright { display: flex; align-items: center; gap: 8px; }
.hright .btn svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
.hright .vsep { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }
/* Quiet: no frame until the pointer is on it. */
.btn.quiet { border-color: transparent; background: none; color: var(--muted); padding: 0 10px; }
.btn.quiet:hover { color: var(--text); background: var(--raised); border-color: var(--line); }
/* The clean-up's cue: a red broom before its label. */
.btn.quiet .cue { width: 14px; height: 14px; fill: var(--red-text); flex: none; }
/* Work in progress sits beside the buttons, never inside one. */
.hbusy { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; padding: 0 6px; }
.hbusy b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.hspin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--muted) 30%, transparent); border-top-color: var(--text); animation: spin .9s linear infinite; flex: none; }
.bulk { display: flex; align-items: center; gap: 8px; animation: ppin .14s ease-out; }
.bulk .bcount { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 10px; border-radius: 8px; background: color-mix(in srgb, var(--blue) 14%, transparent); white-space: nowrap; }
.bulk .bcount b { font-weight: 600; font-variant-numeric: tabular-nums; }
.bulk .bcount .x { width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; font: var(--fs-head)/1 var(--ui-font); }
.bulk .bcount .x:hover { color: var(--text); background: color-mix(in srgb, var(--text) 10%, transparent); }
.bulk .linkish { padding: 0 4px; white-space: nowrap; }
.bulk .linkish:hover { text-decoration: underline; text-underline-offset: 3px; }
/* Picking rows: a narrow column of boxes before the icon, always showing,
   and the head's box for all, some (a dash) or none. A picked row is tinted
   right across, with a blue edge, and the row the arrow keys move from has a
   2 px blue ring, drawn inside its cells so nothing shifts. */
#content table[tabindex] { outline: none; }
th.ck, td.ck { width: 34px; padding: 0 0 0 10px; }
th.ck + th, td.ck + td { padding-left: 6px; }
.ckbox { display: grid; place-items: center; width: 24px; height: 30px; cursor: pointer; border-radius: 6px; }
th .ckbox { height: 22px; }
.cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--faint); display: grid; place-items: center; background: var(--panel); }
.cb svg { width: 11px; height: 11px; fill: #fff; opacity: 0; }
.ckbox:hover .cb { border-color: var(--muted); }
.ckbox:focus-visible { outline: none; } .ckbox:focus-visible .cb { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 35%, transparent); }
tr.chosen .cb, .cb.all, .cb.some { background: var(--blue); border-color: var(--blue); }
tr.chosen .cb svg, .cb.all svg { opacity: 1; }
.cb.some::after { content: ""; width: 8px; height: 2px; border-radius: 1px; background: #fff; }
tr.row.chosen td { background: color-mix(in srgb, var(--blue) 14%, transparent); }
tr.row.chosen:hover td { background: color-mix(in srgb, var(--blue) 18%, transparent); }
tr.row.chosen td.ck { box-shadow: inset 2px 0 0 var(--blue); }
/* Its buttons' fade takes the tint, so it runs right across. */
tr.row.chosen td.actions .acts-row { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--blue) 14%, var(--bg)) 24px); }
tr.row.chosen:hover td.actions .acts-row { background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--blue) 18%, var(--bg)) 24px); }
tr.row.cur td { border-bottom-color: transparent; box-shadow: inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
tr.row.cur td:first-child { border-radius: 6px 0 0 6px; box-shadow: inset 2px 0 0 var(--blue), inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
tr.row.cur td:last-child { border-radius: 0 6px 6px 0; box-shadow: inset -2px 0 0 var(--blue), inset 0 2px 0 var(--blue), inset 0 -2px 0 var(--blue); }
/* Clear of the sticky head when the keys scroll a row into view. */
tr[data-pick] { scroll-margin: 34px 0 4px; }
@keyframes ppin { from { opacity: 0; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .hspin { animation-duration: 2s; } .bulk, .pp { animation: none; } }

/* Pull image: a popover under the header's button (⌘⇧P / Ctrl+Shift+P from
   any page). Docker Hub's search as you type, or a full reference to pull
   exactly that; then the tag. */
/* One height whatever it holds, so it doesn't grow under the pointer as search results or tags arrive. */
.pp { position: fixed; z-index: 8; top: 100px; right: 26px; width: 500px; height: min(560px, calc(100vh - 140px)); display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 36px rgba(0, 0, 0, .38), 0 2px 6px rgba(0, 0, 0, .2);
      animation: ppin .14s ease-out; outline: none; }
.pp::before { content: ""; position: absolute; top: -6px; right: var(--ax, 40px); width: 10px; height: 10px; background: var(--panel); border: solid var(--line); border-width: 1px 0 0 1px; transform: rotate(45deg); }
.pp-field { flex: none; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 10px 0 14px; border-bottom: 1px solid var(--line); }
.pp-field > svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.pp-field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; color: var(--text); font: var(--fs-head) var(--ui-font); -webkit-user-select: text; user-select: text; }
.pp-field input::placeholder { color: var(--faint); }
.pp .reg { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--raised); color: var(--text); font: 500 var(--fs-small) var(--ui-font); white-space: nowrap; }
/* Where it pulls from: Docker Hub works today, the rest are listed as Soon. */
.pp .reg { border: 0; cursor: pointer; }
.pp .reg:hover, .pp .reg[aria-expanded=true] { background: var(--row-hover); box-shadow: inset 0 0 0 1px var(--line); }
.pp .reg .car { width: 9px; height: 9px; color: var(--muted); }
.pp .reg.other svg.lg { display: none; }
.pp .reg svg.lg, .regmenu svg.lg { width: 14px; height: 14px; flex: none; color: inherit; }
.regmenu { position: absolute; top: 40px; right: 8px; width: 240px; z-index: 8; padding: 5px; display: grid; gap: 1px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgba(0, 0, 0, .4); }
.regmenu .hd { font-size: var(--fs-small); font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; padding: 6px 9px 3px; }
.regmenu button { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 9px; border: 0; border-radius: 7px; background: none; color: var(--text); font: var(--fs) var(--ui-font); text-align: left; cursor: pointer; }
.regmenu button[aria-checked=true] { background: var(--raised); }
.regmenu button:disabled { color: var(--faint); cursor: default; }
.regmenu button:disabled svg.lg { opacity: .45; filter: grayscale(1); }
.regmenu .ck { margin-left: auto; width: 13px; height: 13px; fill: var(--blue-light); }
.regmenu .soon { margin-left: auto; font-size: var(--fs-small); font-weight: 600; padding: 1px 6px; border-radius: 5px; color: var(--muted); background: var(--raised); }
.regmenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.regmenu .mono-lg { width: 14px; height: 14px; flex: none; display: grid; place-items: center; border-radius: 4px; color: #fff; font: 700 8.5px var(--ui-font); }

.content { flex: 1; overflow: auto; overflow-x: hidden; padding: 4px 24px 20px 20px; }

.tag { display: inline-block; max-width: min(160px, 100%); box-sizing: border-box; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; padding: 1px 7px; border-radius: 99px; background: var(--raised); border: 1px solid var(--line); font-size: var(--fs-small); color: var(--muted); }

/* Images' Used by: how many containers, then a small box per state (Phosphor's

   An image nothing uses steps back. */
:root { --lit-hi: #A8F5D4; }
@media (prefers-color-scheme: light) { :root { --lit-hi: #0F9E6A; } }

tr.pulling td { color: var(--muted); }

         font: 500 var(--fs) var(--ui-font); text-align: left; cursor: pointer; width: 168px; }

.range input { -webkit-appearance: none; appearance: none; width: 200px; height: 9px; margin: 0; border-radius: 999px; cursor: pointer;
  background: linear-gradient(to right, var(--blue) var(--fill, 0%), var(--line) var(--fill, 0%)); }
.range input::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 18px; border-radius: 999px; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .35), 0 0 0 .5px rgba(0, 0, 0, .2); }

.isec { display: grid; gap: 6px; }

.linkish:disabled { color: var(--faint); cursor: default; }
.pxgrid { display: grid; gap: 10px; max-width: 560px; }

            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }

/* A row's name opens it, a link; so does the rest of a row that has a page. */

.copy:hover, .copy:focus-visible { color: var(--text); background: var(--raised); opacity: 1; }

        border: 1px solid color-mix(in srgb, var(--sun) 45%, var(--line)); background: color-mix(in srgb, var(--sun) 10%, var(--panel)); }

/* Live stats on the Overview tab: four small charts, the last minute. */

.btn.lb { display: inline-flex; align-items: center; gap: 6px; }

/* The buttons sit on a fade of the page colour, which shows as a darker band on a hovered row. */
td.actions .acts-row { margin-left: auto; width: max-content; padding-left: 24px; background: linear-gradient(90deg, transparent, var(--bg) 24px); }
.menu { position: fixed; z-index: 7; min-width: 150px; padding: 4px; display: grid; background: var(--panel);
        border: 1px solid var(--line); border-radius: 8px; }
.menu button { height: 30px; padding: 0 10px; border: 0; border-radius: 5px; background: transparent; color: var(--text);
               font: 500 var(--fs) var(--ui-font); text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--raised); outline: none; }
.menu button.danger { color: var(--red); }
/* Settings */
.settings { display: grid; grid-template-columns: 180px 1fr; gap: 28px; align-items: start; max-width: 860px; }
.settings .tabs { display: grid; gap: 2px; }
.settings .tabs button { display: flex; align-items: center; gap: 9px; height: 31px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent;
                         color: var(--muted); font: 500 var(--fs) var(--ui-font); text-align: left; cursor: pointer; }
.settings .tabs button:hover { background: var(--row-hover); color: var(--text); }
.settings .tabs button[aria-current=true] { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.settings .tabs button[aria-current=true] svg { color: var(--blue); }
.pane { display: grid; gap: 22px; min-width: 0; }
/* A tab with more than one pane (Resources: the engine, then its limits)
   keeps them together in the second column of .settings. */
.panes { display: grid; gap: 28px; min-width: 0; }
.pane h3 { font-size: var(--fs-head); }
.updrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.updpill { font-size: var(--fs-small); font-weight: 600; padding: 2px 7px; border-radius: 99px; background: color-mix(in srgb, #3FB97A 16%, transparent); color: color-mix(in srgb, #3FB97A 70%, var(--text)); }
.updpill.new { background: color-mix(in srgb, var(--blue-light) 18%, transparent); color: color-mix(in srgb, var(--blue-light) 70%, var(--text)); }
.updpill.test { background: color-mix(in srgb, #E0B420 16%, transparent); color: color-mix(in srgb, #E0B420 75%, var(--text)); }
.updbar { width: 180px; height: 5px; border-radius: 9px; background: var(--raised); overflow: hidden; } .updbar span { display: block; height: 100%; background: var(--blue-light); }
.updnotes { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 6px; max-width: 640px; }
.updnotes > b { display: block; font-weight: 600; margin-bottom: 4px; }
.updnotes .wn-group { padding: 10px 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue-light); font: inherit; cursor: pointer; }
.pref { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.pref .t { font-weight: 600; }
.pref .d { color: var(--muted); font-size: var(--fs); grid-column: 1; }
.pref select { grid-row: 1 / span 2; grid-column: 2; height: 32px; width: 240px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line);
               background: var(--panel); color: var(--text); font: var(--fs) var(--ui-font); }
.seg { grid-row: 1 / span 2; grid-column: 2; display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { height: 30px; padding: 0 12px; border: 0; border-left: 1px solid var(--line); background: var(--panel); color: var(--muted); font: 500 var(--fs) var(--ui-font); cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed=true] { background: var(--blue); color: #fff; }
.preview { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 8px; background: var(--panel); }
.preview .p-title { font-size: var(--fs-head); font-weight: 600; }
.preview .p-mono { font: var(--fs-mono) var(--mono-font); color: var(--muted); }
.about { display: grid; gap: 18px; }
.about-head { display: flex; align-items: center; gap: 16px; }
.about-head svg { width: 64px; height: 64px; }
.about-head .n { font-size: var(--fs-title); font-weight: 700; }
.about dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 24px; font-size: var(--fs); }
.about dt { color: var(--muted); }
.about dd { font-variant-numeric: tabular-nums; }
.about a { color: var(--blue-light); cursor: pointer; text-decoration: none; }
/* Linux: the setup checklist the window opens on until Kiri can run containers (onboarding()). */
#onb { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow: auto; display: grid; place-items: start center; }
#onb .onb-in { width: min(460px, calc(100% - 32px)); padding: 44px 0 28px; }
#onb .onb-hd { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
#onb .onb-hd svg.logo { width: 38px; height: 38px; flex: none; }
#onb h2 { font-size: var(--fs-head); font-weight: 600; }
#onb .onb-hd p, #onb .onb-row p { color: var(--muted); font-size: var(--fs-small); }
#onb .onb-rows { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
#onb .onb-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-top: 1px solid var(--line); }
#onb .onb-row:first-child { border-top: 0; }
#onb .onb-row .t { flex: 1; min-width: 0; }
#onb .onb-row .t > div { font-weight: 500; }
#onb .onb-row .linkish { align-self: center; color: var(--muted); font-size: var(--fs-small); padding: 0 4px; }
#onb .onb-row .linkish:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
#onb .onb-row.skipped .t > div { color: var(--muted); }
#onb .onb-row .btn { height: 28px; margin-top: -2px; }
#onb .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-top: 1px; }
#onb .st svg.i { width: 11px; height: 11px; }
#onb .st.ok { background: rgba(63, 182, 139, .16); color: var(--moss); }
#onb .st.no, #onb .st.restart { background: rgba(255, 194, 61, .15); color: var(--sun-text); }
#onb .st.bad { background: rgba(220, 53, 69, .16); color: var(--red-text); }
#onb .st.off { background: var(--raised); color: var(--faint); }
#onb .st.wait { border: 2px solid var(--line); border-top-color: var(--blue); animation: onbspin .8s linear infinite; }
@keyframes onbspin { to { transform: rotate(360deg); } }
#onb .btn svg.i { width: 13px; height: 13px; }
#onb .onb-ft { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
#onb .onb-ft .m { flex: 1; display: flex; align-items: center; gap: 5px; color: var(--faint); font-size: var(--fs-small); }
#onb .onb-ft .m svg.i { width: 12px; height: 12px; }
#onb .onb-err { margin-top: 12px; color: var(--red-text); font-size: var(--fs-small); }
#onb .onb-rs { margin-top: 12px; border: 1px solid rgba(255, 194, 61, .35); background: rgba(255, 194, 61, .06); border-radius: 8px; padding: 10px 12px; }
#onb .onb-rs b { color: var(--sun-text); font-weight: 600; }
#onb .onb-rs p { color: var(--muted); font-size: var(--fs-small); margin: 2px 0 8px; }
#onb .onb-rs .a { display: flex; gap: 6px; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); display: grid; place-items: center; z-index: 8; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(460px, calc(100% - 32px)); display: grid; gap: 14px; }
.dialog h3 { font-size: var(--fs-head); }
.dialog p { color: var(--muted); font-size: var(--fs); }
/* An alert: what kind it is as a symbol on the left, in its colour, centred on
   the title's first line; the words and buttons line up beside it. */
.dialog.alert { grid-template-columns: 28px minmax(0, 1fr); column-gap: 14px; row-gap: 6px; padding: 20px 20px 16px; }
.dialog.alert > :not(.ico) { grid-column: 2; }
.dialog.alert > .ico { grid-row: 1 / span 2; width: 28px; height: 28px; margin-top: -2px; fill: var(--ink); --ink: var(--blue-light); }
.dialog.alert h3 { line-height: 20px; }
.dialog.alert > .row-end { margin-top: 12px; }
.dialog.alert > .ico.error, .dialog.alert > .ico.remove { --ink: var(--red-text); }
.dialog.alert > .ico.warn { --ink: var(--sun-text); transform: scale(.9); }
.dialog.alert > .ico.remove { transform: scale(.94); }
.dialog.alert > .ico.ok { --ink: var(--moss); }
/* The build question: each answer in a line of its own, its name in the text colour. */
.dialog.alert > p.bw-opt b { color: var(--text); font-weight: 600; }
.dialog.alert > p.bw-later { font-size: var(--fs-small); }
@media (prefers-color-scheme: light) { .dialog.alert > .ico.info { --ink: var(--blue); } }
/* Removing: a red tint, not a block of red. */
.port-row { display: grid; grid-template-columns: 1fr 18px 1fr 74px 30px; gap: 8px; align-items: center; }
.port-row input, .port-row select { height: 30px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: var(--fs) ui-monospace, "SF Mono", Menlo, monospace; min-width: 0; }
.port-row .arrow { color: var(--faint); text-align: center; }
.port-head { display: grid; grid-template-columns: 1fr 18px 1fr 74px 30px; gap: 8px; font-size: var(--fs-small); font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.dialog .row-end { display: flex; justify-content: space-between; gap: 8px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 9; }
/* Images → Run: the "Started" note beside the button, pointing at it. */
.run-tip { position: fixed; z-index: 9; transform: translate(calc(-100% - 10px), -50%); display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px;
           background: var(--raised); border: 1px solid color-mix(in srgb, var(--moss) 45%, var(--line)); border-radius: 9px; white-space: nowrap;
           box-shadow: 0 8px 24px rgba(0, 0, 0, .3); font-weight: 500; animation: tip-in .2s ease-out; }
.run-tip::after { content: ""; position: absolute; right: -5px; top: 50%; width: 8px; height: 8px; background: var(--raised);
                  border: solid color-mix(in srgb, var(--moss) 45%, var(--line)); border-width: 1px 1px 0 0; transform: translateY(-50%) rotate(45deg); }
.run-tip svg { width: 16px; height: 16px; fill: var(--sun); flex: none; animation: tip-spark .9s ease-out; }
.run-tip .lnk { margin-left: 2px; }
@keyframes tip-in { from { opacity: 0; transform: translate(calc(-100% - 2px), -50%); } }
@keyframes tip-spark { 0% { transform: scale(.4) rotate(-40deg); } 60% { transform: scale(1.25) rotate(10deg); } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .run-tip, .run-tip svg { animation: none; } }
/* Run on an image that can't start as it is: what it needs, on its Run button. */
.need { position: fixed; z-index: 10; width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, .38), 0 2px 6px rgba(0, 0, 0, .2); display: grid; gap: 12px; padding: 14px 14px 12px; animation: need-in .16s ease-out; }
.need::before { content: ""; position: absolute; left: calc(var(--ax) - 5px); width: 10px; height: 10px; background: var(--panel); border: solid var(--line); transform: rotate(45deg); }
.need.below::before { top: -6px; border-width: 1px 0 0 1px; }
.need.above::before { bottom: -6px; border-width: 0 1px 1px 0; }
.need.below { transform-origin: var(--ax) 0; } .need.above { transform-origin: var(--ax) 100%; }
@keyframes need-in { from { opacity: 0; transform: scale(.97); } }
.need .hd { display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: start; }
.need .oic { grid-row: span 2; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--sun-text); background: color-mix(in srgb, var(--sun) 16%, transparent); }
.need .oic svg { width: 15px; height: 15px; fill: currentColor; }
.need h3 { font-size: var(--fs-head); font-weight: 600; line-height: 1.3; margin: 0; overflow-wrap: anywhere; }
.need .why { color: var(--muted); margin: 0; }
.need .fld { display: grid; gap: 5px; }
.need .fld > label { font: 600 var(--fs-mono) var(--mono-font); color: var(--text); }
.need .pw { display: flex; gap: 6px; align-items: center; }
.need .inp { position: relative; flex: 1; min-width: 0; display: flex; }
.need .inp input, .need .more input { width: 100%; height: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); padding: 0 30px 0 9px;
             font: var(--fs-mono) var(--mono-font); outline: none; -webkit-user-select: text; user-select: text; min-width: 0; }
.need .more input { padding-right: 9px; }
.need .inp input:focus, .need .more input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
.need input::placeholder { color: var(--faint); }
.need input:disabled { opacity: .55; }
.need .eye { position: absolute; right: 2px; top: 2px; width: 24px; height: 24px; border: 0; border-radius: 5px; background: none; color: var(--faint); display: grid; place-items: center; cursor: pointer; }
.need .eye:hover { color: var(--text); }
.need .eye svg, .need .gen svg { width: 15px; height: 15px; fill: currentColor; }
.need .btn.gen { gap: 5px; padding: 0 9px; height: 28px; }
.need .btn.gen svg { width: 13px; height: 13px; }
.need .hint { color: var(--faint); font-size: var(--fs-small); display: flex; align-items: center; gap: 8px; }
.need .hint.ok { color: var(--moss); } .need .hint.no { color: var(--sun-text); }
.need .bars { display: inline-flex; gap: 3px; flex: none; }
.need .bars i { width: 18px; height: 4px; border-radius: 99px; background: var(--line); }
.need .bars[data-n="1"] i:nth-child(-n+1) { background: var(--red); }
.need .bars[data-n="2"] i:nth-child(-n+2), .need .bars[data-n="3"] i:nth-child(-n+3) { background: var(--sun); }
.need .bars[data-n="4"] i { background: var(--moss); }
.need .opts { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; }
.need .opt { display: grid; grid-template-columns: 16px 1fr; gap: 3px 8px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); cursor: pointer; line-height: 1.4; }
.need .opt > input { margin: 2px 0 0; accent-color: var(--blue); }
.need .opt:has(> input:checked) { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--raised)); }
.need .opt .t { font-weight: 500; }
.need .opt .d, .need .chk .d { grid-column: 2; color: var(--muted); font-size: var(--fs-small); }
.need .opt .pw { grid-column: 2; margin-top: 4px; }
.need .opt:not(:has(> input:checked)) .pw { display: none; }
.need .chk { display: grid; grid-template-columns: 16px 1fr; gap: 2px 8px; align-items: start; cursor: pointer; }
.need .chk input { margin: 2px 0 0; accent-color: var(--blue); }
.need .dim-when-off { transition: opacity .15s; }
.need.sec-off .dim-when-off { opacity: .4; pointer-events: none; }
.need .disc { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; padding: 0; color: var(--muted); font: 500 var(--fs) var(--ui-font); cursor: pointer; justify-self: start; }
.need .disc:hover { color: var(--text); }
.need .disc svg { width: 11px; height: 11px; fill: currentColor; transition: transform .15s; }
.need .disc[aria-expanded=true] svg { transform: rotate(90deg); }
.need .disc .n { color: var(--faint); font-weight: 400; }
.need .more { display: grid; grid-template-columns: max-content 1fr; gap: 6px 10px; align-items: center; padding: 2px 0 0 16px; }
.need .more[hidden] { display: none; }
.need .more label { font: var(--fs-mono) var(--mono-font); color: var(--muted); }
.need .err { color: var(--red-text); font-size: var(--fs-small); line-height: 1.4; padding: 8px 10px; border-radius: 8px;
  background: color-mix(in srgb, var(--red) 10%, transparent); border: 1px solid color-mix(in srgb, var(--red) 35%, var(--line)); }
.need .err[hidden] { display: none; }
.need .inp input.bad { border-color: var(--red); }
.need .ft { display: grid; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
.need .ft .row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.need .ft .note { color: var(--faint); font-size: var(--fs-small); }
.need .btn.quiet { border-color: transparent; background: none; color: var(--muted); }
.need .btn.quiet:hover { color: var(--text); background: var(--raised); }
.need .btn .spin { display: inline-block; width: 11px; height: 11px; margin-right: 6px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .3); border-top-color: #fff; animation: spin .9s linear infinite; }
.need .kbd { font: 500 10px var(--ui-font); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 2px; }
/* Run, once its container is up: how long it's been up, which opens it, and
   Stop, so it isn't started twice. Run comes back after leaving Images. */
.run-up { align-self: center; background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit; color: var(--moss); font-size: var(--fs-small); white-space: nowrap; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .need { animation: none; } }
/* The same tip when the container stops within seconds: red, with the fix first. */
.run-tip.fail, .run-tip.fail::after { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); background: color-mix(in srgb, var(--red) 8%, var(--raised)); }
.run-tip.fail svg { fill: var(--red-text); animation: none; }
.run-tip.fail .t b { font-weight: 600; }
.run-tip .sep { color: var(--faint); }
/* Why a container stopped, on its page where the out-of-memory line sits:
   its own words quoted, and the fix when there is one. */
.fix { margin: 12px 0 16px; padding: 14px 16px 14px 14px; border-radius: 10px; max-width: 860px; display: grid; grid-template-columns: 26px 1fr; gap: 0 12px;
       background: color-mix(in srgb, var(--red) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--red) 35%, var(--line)); }
.fix .oic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--red-text); background: color-mix(in srgb, var(--red) 18%, transparent); }
.fix .oic svg { width: 16px; height: 16px; fill: currentColor; }
.fix .body { display: grid; gap: 10px; min-width: 0; }
.fix h3 { font-size: var(--fs-head); font-weight: 600; line-height: 26px; margin: 0; }
.fix p { color: var(--muted); max-width: 620px; margin: 0; }
.fix p b { color: var(--text); font-weight: 600; }
.fix .quote { display: grid; gap: 4px; }
.fix .quote q { display: block; quotes: none; padding: 8px 10px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line);
                font: var(--fs-log)/1.55 var(--mono-font); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.fix .quote small { color: var(--faint); font-size: var(--fs-small); }
.fix .setrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fix .setrow label { font: 600 var(--fs-mono) var(--mono-font); color: var(--text); }
.fix .setrow input { height: 26px; width: 230px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); padding: 0 8px;
                     font: var(--fs-mono) var(--mono-font); outline: none; -webkit-user-select: text; user-select: text; }
.fix .setrow input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
.fix .setrow input::placeholder { color: var(--faint); font-family: var(--ui-font); }
.fix .hint { color: var(--faint); font-size: var(--fs-small); }
.fix .hint.ok { color: var(--moss); }
.fix .foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.fix .foot .note { color: var(--muted); font-size: var(--fs-small); flex: 1; }
.fix .alt { display: flex; align-items: baseline; gap: 8px; padding-top: 10px; border-top: 1px solid color-mix(in srgb, var(--red) 18%, var(--line)); color: var(--muted); }
.fix .alt .mono { color: var(--text); }
.fix .spin { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -1px; border-radius: 50%;
             border: 2px solid color-mix(in srgb, var(--sun) 25%, transparent); border-top-color: var(--sun-text); animation: spin .9s linear infinite; }
/* Started after the fix: moss, then gone. */
.fixed { display: flex; align-items: center; gap: 9px; margin: 12px 0 16px; padding: 9px 12px; border-radius: 10px; max-width: 760px; font-weight: 500;
         background: color-mix(in srgb, var(--moss) 10%, var(--panel)); border: 1px solid color-mix(in srgb, var(--moss) 45%, var(--line)); animation: fixed-out 6s ease-in forwards; }
.fixed svg { width: 16px; height: 16px; fill: var(--moss); flex: none; }

@keyframes fixed-out { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .fixed, .fix .spin { animation: none; } }  /* above dialogs (8): a note is never behind the blur */
.toast { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; max-width: 360px;
         box-shadow: 0 8px 24px rgba(0, 0, 0, .25); animation: rise .18s ease-out; font-weight: 500; }
.toolsbar { position: fixed; right: 18px; top: 64px; z-index: 6; width: 300px; display: grid; gap: 8px; padding: 11px 13px; background: var(--panel);
            border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); animation: rise .18s ease-out; }
.toolsbar .tb-text { display: grid; gap: 2px; font-size: var(--fs); }
.toolsbar .tb-track { height: 4px; border-radius: 2px; background: var(--raised); overflow: hidden; }
.toolsbar .tb-track div { height: 100%; background: var(--blue); border-radius: 2px; transition: width .2s; }
.toolsbar:has(#tools-retry) { grid-template-columns: 1fr auto; align-items: center; }
/* Plain notices are in the family too: the box settles onto the stack and
   takes a tick when it went well; when it didn't, the box jolts and takes a
   cross. The text is a sentence, so it wraps rather than clips. */
.toast { position: relative; }
.toast .tclose { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--faint);
                 display: grid; place-items: center; cursor: pointer; z-index: 1; }
.toast .tclose:hover { color: var(--text); background: var(--raised); }
.toast .tclose svg { width: 10px; height: 10px; }
.toast.ok, .toast.error { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; width: 340px; max-width: none;
                          position: relative; overflow: hidden; animation: rise .22s cubic-bezier(.2, 1.4, .4, 1); }
.toast.ok { border-color: color-mix(in srgb, var(--moss) 40%, var(--line)); }
.toast.error { border-color: color-mix(in srgb, var(--red) 50%, var(--line)); }
.toast.ok .yard, .toast.error .yard { position: relative; width: 46px; height: 40px; }
.toast.ok .yard i, .toast.error .yard i { position: absolute; left: 6px; bottom: 0; width: 34px; height: 10px; border-radius: 2px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.toast.ok .yard i:nth-child(2), .toast.error .yard i:nth-child(2) { bottom: 11px; left: 3px; width: 22px; }
.toast.ok .yard .box, .toast.error .yard .box { bottom: 22px; left: 9px; width: 30px; height: 11px; box-shadow: none; }
.toast.ok .yard .box { background: var(--moss); animation: settle .4s cubic-bezier(.3, .1, .3, 1) both; }
.toast.error .yard .box { background: var(--red); animation: jolt .5s ease-out .1s both; }
.toast.ok .yard .tick, .toast.error .yard .tick { position: absolute; right: -2px; top: -2px; width: 16px; height: 16px; border-radius: 50%; color: #fff;
                                                  display: grid; place-items: center; animation: pop .3s cubic-bezier(.2, 1.8, .4, 1) .4s both; }
.toast.ok .yard .tick { background: var(--moss); }
.toast.error .yard .tick { background: var(--red); animation-delay: .55s; }
.toast.ok .yard .tick svg, .toast.error .yard .tick svg { width: 10px; height: 10px; }
.toast.ok .txt, .toast.error .txt { min-width: 0; line-height: 1.35; overflow-wrap: anywhere; }
.toast.ok .life, .toast.error .life { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; opacity: .6; transform-origin: left; animation: life var(--life, 3.5s) linear forwards; }
.toast.ok .life { background: var(--moss); }
.toast.error .life { background: var(--red); }
.toast.ok:hover .life, .toast.error:hover .life { animation-play-state: paused; }
@keyframes settle { from { transform: translateY(-10px); opacity: 0; } 70% { transform: translateY(1px) scale(1.04, .9); } }
@keyframes jolt { 20% { transform: translateX(-3px) rotate(-4deg); } 40% { transform: translateX(3px) rotate(4deg); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }

/* The pulled toast: a box is lowered onto the stack, lands, and gets a tick. */
.toast.pulled { display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 12px; padding: 10px 10px 10px 12px;
                width: 340px; max-width: none; position: relative; overflow: hidden;
                border-color: color-mix(in srgb, var(--moss) 40%, var(--line)); animation: rise .22s cubic-bezier(.2, 1.4, .4, 1); }
.toast.pulled .yard { position: relative; width: 46px; height: 40px; }
.toast.pulled .yard i { position: absolute; left: 6px; width: 34px; height: 10px; border-radius: 2px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.toast.pulled .yard i:nth-child(1) { bottom: 0; }
.toast.pulled .yard i:nth-child(2) { bottom: 11px; left: 3px; width: 22px; }
.toast.pulled .yard .box { bottom: 22px; left: 9px; width: 30px; height: 11px; background: var(--sun); box-shadow: none;
                           animation: lower .55s cubic-bezier(.3, .1, .3, 1) both, land .25s ease-out .55s; }
.toast.pulled .yard .box::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 1px; height: 40px; background: var(--faint);
                                   animation: unhook .2s ease-in .6s both; }
.toast.pulled .yard .tick { position: absolute; right: -2px; top: -2px; width: 16px; height: 16px; border-radius: 50%; background: var(--moss); color: #fff;
                            display: grid; place-items: center; animation: pop .3s cubic-bezier(.2, 1.8, .4, 1) .75s both; }
.toast.pulled .yard .tick svg { width: 10px; height: 10px; }
.toast.pulled b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.pulled .sub { color: var(--muted); font-size: var(--fs); font-weight: 400; }
.toast.pulled .txt { min-width: 0; }
.toast.pulled .life { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--moss); opacity: .6; transform-origin: left;
                      animation: life var(--life, 5s) linear forwards; }
.toast.pulled:hover .life { animation-play-state: paused; }
.toast.leaving { animation: leave .2s ease-in forwards; }
@keyframes lower { from { transform: translateY(-34px); } }
@keyframes land { 40% { transform: scale(1.06, .82); } }
@keyframes unhook { to { transform: translateY(-40px); opacity: 0; } }
@keyframes pop { from { transform: scale(0); } }
@keyframes life { to { transform: scaleX(0); } }
@keyframes leave { to { transform: translateX(16px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast.pulled, .toast.pulled * { animation: none !important; } }
/* The removed toast: the box is lifted off the stack and goes. */
.toast.removed { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; width: 320px; max-width: none;
                 position: relative; overflow: hidden; animation: rise .22s cubic-bezier(.2, 1.4, .4, 1); }
.toast.removed .yard { position: relative; width: 46px; height: 40px; }
.toast.removed .yard i { position: absolute; left: 6px; bottom: 0; width: 34px; height: 10px; border-radius: 2px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.toast.removed .yard i:nth-child(2) { bottom: 11px; left: 3px; width: 22px; }
.toast.removed .yard .box { bottom: 22px; left: 9px; width: 30px; height: 11px; background: var(--faint); box-shadow: none; animation: hoist .7s cubic-bezier(.5, 0, .7, .4) .15s forwards; }
.toast.removed .yard .box::before { content: ""; position: absolute; left: 50%; bottom: 100%; width: 1px; height: 40px; background: var(--faint); }
.toast.removed.many .yard .box:nth-child(4) { left: 12px; bottom: 25px; animation-delay: .5s; }
.toast.removed.many .yard .box:nth-child(5) { left: 6px; bottom: 28px; animation-delay: .85s; }
.toast.removed.many .life { animation-duration: 4.5s; }
.toast.removed b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.removed .sub { color: var(--muted); font-size: var(--fs); font-weight: 400; }
.toast.removed .sub em { font-style: normal; color: var(--moss); font-weight: 600; }
.toast.removed .txt { min-width: 0; }
.toast.removed .life { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--faint); opacity: .6; transform-origin: left; animation: life 3.5s linear forwards; }
.toast.removed:hover .life { animation-play-state: paused; }
@keyframes hoist { 30% { transform: translateY(2px); } to { transform: translateY(-46px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .toast.removed, .toast.removed * { animation: none !important; } }
/* The engine toast, after Finish updating: the stack comes back up, slat by
   slat, and the box on top gets its tick. Transforms and opacity only, each
   run once, so it costs nothing after the first second. */
.toast.engine { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 12px; padding: 10px 14px 10px 12px; width: 320px; max-width: none;
                position: relative; overflow: hidden; border-color: color-mix(in srgb, var(--moss) 40%, var(--line)); animation: rise .22s cubic-bezier(.2, 1.4, .4, 1); }
/* Room for the close at the top right, whatever the toast. */
.toast:has(> .tclose) { padding-right: 30px; }
/* The star card, asked once: a sun star beside a short line, and two buttons. */
.toast.star { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 12px; width: 300px; max-width: none; animation: rise .22s cubic-bezier(.2, 1.4, .4, 1); }
.toast.star .sic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--sun); background: color-mix(in srgb, var(--sun) 14%, var(--raised)); }
.toast.star .sic svg { width: 14px; height: 14px; }
.toast.star .txt { min-width: 0; font-size: var(--fs); line-height: 1.35; }
.toast.star .txt b { display: block; font-weight: 600; }
.toast.star .sub { color: var(--muted); font-weight: 400; }
.toast.star .acts { display: flex; gap: 6px; margin-top: 8px; }
.toast.engine .yard { position: relative; width: 46px; height: 40px; }
.toast.engine .yard i { position: absolute; left: 6px; bottom: 0; width: 34px; height: 10px; border-radius: 2px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line);
                        animation: relight .5s ease-out both; }
.toast.engine .yard i:nth-child(2) { bottom: 11px; left: 3px; width: 22px; animation-delay: .12s; }
.toast.engine .yard .box { bottom: 22px; left: 9px; width: 30px; height: 11px; background: var(--moss); box-shadow: none; animation-delay: .24s; }
.toast.engine .yard .tick { position: absolute; right: -2px; top: -2px; width: 16px; height: 16px; border-radius: 50%; background: var(--moss); color: #fff;
                            display: grid; place-items: center; animation: pop .3s cubic-bezier(.2, 1.8, .4, 1) .7s both; }
.toast.engine .yard .tick svg { width: 10px; height: 10px; }
.toast.engine b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.engine .sub { color: var(--muted); font-size: var(--fs); font-weight: 400; }
.toast.engine .txt { min-width: 0; }
.toast.engine .life { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--moss); opacity: .6; transform-origin: left; animation: life 4s linear forwards; }
.toast.engine:hover .life { animation-play-state: paused; }
@keyframes relight { from { opacity: .2; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .toast.engine, .toast.engine * { animation: none !important; } }

/* Builds: a list and the picked build's steps, side by side. */
.bl { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 16px; height: 100%; min-height: 0; }
.bl-list { overflow-y: auto; display: grid; align-content: start; gap: 2px; padding: 2px 4px 2px 0; border-right: 1px solid var(--line); }
.bl-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; color: var(--text); text-align: left; font: inherit; cursor: pointer; }
.bl-item:hover { background: var(--row-hover); }
.bl-item[aria-selected="true"] { background: var(--raised); }
.bl-txt { display: grid; min-width: 0; }
.bl-txt b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-txt small { color: var(--muted); font-size: var(--fs-small); }
.bl-st { flex: none; width: 18px; height: 18px; display: grid; place-items: center; color: var(--faint); }
.bl-st .i { width: 18px; height: 18px; fill: currentColor; }
.bl-st.ok { color: var(--moss); } .bl-st.fail { color: var(--red-text); } .bl-st.cached { color: var(--faint); } .bl-st.run { color: var(--blue-light); }
.bl-st .spin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: bl-spin .8s linear infinite; }
@keyframes bl-spin { to { transform: rotate(360deg); } }
.bl-none { color: var(--muted); padding: 12px; }
.bl-detail { overflow-y: auto; min-width: 0; padding: 4px 4px 16px 0; }
.bl-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 8px; }
.bl-head h2 { font-size: var(--fs-title); letter-spacing: -.01em; }
.bl-pill { padding: 2px 9px; border-radius: 999px; font-size: var(--fs-small); font-weight: 600; color: var(--muted); background: var(--raised); }
.bl-pill.ok { color: var(--moss); background: color-mix(in srgb, var(--moss) 15%, transparent); }
.bl-pill.fail { color: var(--red-text); background: color-mix(in srgb, var(--red) 15%, transparent); }
.bl-pill.run { color: var(--blue-light); background: color-mix(in srgb, var(--blue) 18%, transparent); }
.bl-acts { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: var(--fs); }
.bl-meta, .bl-sub { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: var(--fs); }
.bl-meta span { display: inline-flex; align-items: center; gap: 6px; }
.bl-meta .i { width: 14px; height: 14px; fill: currentColor; }
.bl-meta .warn { color: var(--sun-text); }
.bl-sub { margin-top: 6px; font-size: var(--fs-small); color: var(--faint); }
.bl-sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.bl-err { margin-top: 14px; padding: 12px 14px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--red) 40%, var(--line)); background: color-mix(in srgb, var(--red) 8%, var(--panel)); }
.bl-err b { display: flex; align-items: center; gap: 7px; color: var(--red-text); font-weight: 600; }
.bl-err b .i { width: 15px; height: 15px; fill: currentColor; }
.bl-err p { margin: 4px 0 0; }
.bl-err.off { border-color: var(--line); background: var(--panel); } .bl-err.off b { color: var(--muted); }
.bl-err pre { margin-top: 8px; font: var(--fs)/1.5 var(--mono-font); color: var(--muted); white-space: pre-wrap; }
.bl-warns { margin-top: 12px; display: grid; gap: 6px; }
.bl-warns > div { display: flex; gap: 8px; align-items: flex-start; padding: 8px 12px; border-radius: 9px; background: color-mix(in srgb, var(--sun) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--sun) 30%, var(--line)); }
.bl-warns .i { width: 15px; height: 15px; flex: none; margin-top: 1px; fill: var(--sun-text); }
.bl-warns span { flex: 1; min-width: 0; }
.bl-warns small { display: block; color: var(--muted); font-size: var(--fs-small); margin-top: 2px; }
.bl-bar { display: flex; align-items: center; gap: 14px; margin: 16px 0 8px; }
.bl-bar select { height: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: var(--fs) var(--ui-font); }
.bl-check { display: inline-flex; align-items: center; gap: 6px; color: var(--text); font-size: var(--fs); cursor: pointer; }
.bl-all { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.bl-all .i { width: 13px; height: 13px; fill: currentColor; }
.bl-steps { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.bl-step + .bl-step { border-top: 1px solid var(--line); }
.bl-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 12px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.bl-row:disabled { cursor: default; }
.bl-row:not(:disabled):hover { background: var(--row-hover); }
.bl-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-small); line-height: 1.4; }
.bl-step.cached .bl-name, .bl-step.skip .bl-name { color: var(--muted); }
.bl-time { flex: none; width: 120px; display: grid; justify-items: end; gap: 4px; font: var(--fs-small) var(--mono-font); color: var(--text); }
.bl-time .track { width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bl-time .track i { display: block; height: 100%; border-radius: 2px; background: var(--blue-light); }
.bl-step.fail .bl-time .track i { background: var(--red); }
.bl-log { margin: 0 12px 12px 40px; max-height: 320px; overflow: auto; padding: 10px 12px; white-space: pre-wrap; }
/* Builds: the Steps, Layers and Security tabs. */
.bl-tabs { display: flex; gap: 18px; margin: 16px 0 0; border-bottom: 1px solid var(--line); }
.bl-tabs button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 0; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; color: var(--muted); font: 600 var(--fs) var(--ui-font); cursor: pointer; }
.bl-tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }
/* Builds → Layers. */
.bl-lsum { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; margin: 14px 0 12px; font-size: var(--fs); }
.bl-lplat { margin-left: auto; }
.bl-plats { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.bl-plats button { padding: 3px 10px; border: 0; background: none; color: var(--muted); font: var(--fs-small) var(--mono-font); cursor: pointer; }
.bl-plats button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.bl-lgroup { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; margin-bottom: 12px; }
.bl-lhead { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: var(--fs); }
.bl-layer { display: grid; grid-template-columns: 22px minmax(0, 1fr) 120px; gap: 10px; align-items: center; padding: 6px 12px; }
.bl-layer + .bl-layer { border-top: 1px solid var(--line); }
.bl-layer .bl-by { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bl-layer.cfgline .bl-by, .bl-layer.base .bl-by { color: var(--muted); }
.bl-ln { font: var(--fs-small) var(--mono-font); text-align: right; }
.bl-lsz { display: grid; justify-items: end; gap: 4px; font: var(--fs-small) var(--mono-font); }
.bl-lsz .track { width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bl-lsz .track i { display: block; height: 100%; background: var(--blue-light); }
.bl-layer.base .bl-lsz .track i { background: var(--faint); }
.bl-cfg > div:not(.bl-lhead) { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; padding: 6px 12px; font-size: var(--fs); }
.bl-cfg > div:not(.bl-lhead) + div { border-top: 1px solid var(--line); }
.bl-cfg .mono { overflow-wrap: anywhere; }
/* Security: a scan's severity chips, filters and findings. */
.sc-intro, .sc-run { display: grid; gap: 10px; margin-top: 14px; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: var(--fs); }
.sc-intro p, .sc-run p { margin: 0; max-width: 640px; }
.sc-introtop, .sc-runline { display: flex; align-items: center; gap: 8px; font-size: var(--fs); }
.sc-introtop .i { width: 18px; height: 18px; fill: var(--moss); }
.sc-spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--blue); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sc-run .stripe { width: 100%; max-width: 360px; }
.sc-err { margin: 0; padding: 8px 10px; border-radius: 8px; color: var(--red-text); background: color-mix(in srgb, var(--red) 12%, transparent); font-size: var(--fs); }
.sc { display: grid; gap: 10px; margin-top: 14px; }
.sc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs); }
.sc-introtop .spacer, .sc-runline .spacer { flex: 1; }
.sc-by { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: var(--fs-small) var(--ui-font); cursor: pointer; }
.sc-by img { width: 15px; height: 17px; }
.sc-by b { color: var(--text); font-weight: 600; }
.sc-by:hover { background: var(--raised); }
.sc-opts { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 640px; }
/* Start scan sits under the scanner card, at its right edge. */
.sc-go { max-width: 640px; display: flex; justify-content: flex-end; }
.sc-opts legend { padding: 0 0 8px; font-size: var(--fs); }
.sc-opt { display: grid; grid-template-columns: auto 22px 1fr; gap: 10px; align-items: start; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); font-size: var(--fs); line-height: 1.45; cursor: pointer; }
.sc-opt input { margin: 3px 0 0; accent-color: var(--blue); }
.sc-opt img { width: 20px; height: 22px; }
.sc-opt:has(input:checked) { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--raised)); }
.bl-soon { padding: 1px 7px; border-radius: 999px; font-size: var(--fs-small); font-weight: 600; color: var(--blue-light); background: color-mix(in srgb, var(--blue) 16%, transparent); }
.sc-close { width: 28px; height: 28px; margin-left: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--muted); font: 18px/1 var(--ui-font); cursor: pointer; }
.sc-close:hover { color: var(--text); background: var(--raised); }
.sc-hrow { cursor: pointer; }
.sc-hrow:hover td { background: var(--row-hover); }
.sc-counts { display: flex; flex-wrap: wrap; gap: 4px; }
.sc-table td.r, .sc-table th.r { text-align: right; }
.sc-head .spacer { flex: 1; }
.sc-chips { display: flex; gap: 6px; flex-wrap: wrap; }

.sc-sev { --c: var(--muted); display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: var(--fs-small); font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }

/* Every scrolling area: a thin, quiet scrollbar instead of the wide system one.
   No scrollbar-width here: WebKit lets it override the sizes below. */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: 4px; background: color-mix(in srgb, var(--muted) 45%, transparent); }
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--muted) 70%, transparent); }
/* Every monospace text in Builds (steps, times, logs, the error's Dockerfile lines, the context path) one size smaller than elsewhere. */
.bl-detail .mono, .bl-detail pre, .bl-time, .bl-sub { font-size: var(--fs-small); }

/* What's new: the release's notes in a window. Kiri runs in from the left, the old
   version steps aside and the new one pops in with sparks, while the notes are already there to read. */
.wn-dialog { width: min(520px, calc(100% - 32px)); max-height: calc(100% - 48px); display: flex; flex-direction: column; overflow: hidden; padding: 0;
             background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); animation: wn-in .22s ease-out; }
.wn-hero { position: relative; padding: 22px 22px 18px; border-bottom: 1px solid var(--line);
           background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, #E0B420 22%, transparent), transparent 60%), var(--raised); }
.wn-hero .close { position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
                  color: var(--muted); background: none; border: 0; cursor: pointer; }
.wn-hero .close:hover { background: var(--row-hover); color: var(--text); }
.wn-stage { display: flex; align-items: center; gap: 12px; height: 56px; margin-bottom: 12px; }
.wn-kiri { width: 56px; height: 56px; flex: none; color: var(--muted); animation: wn-run .4s cubic-bezier(.2, .8, .3, 1.2) both; }
.wn-kiri .speed rect { animation: wn-speed .35s ease-out .3s both; }
.wn-vers { position: relative; display: flex; align-items: center; gap: 8px; font: 600 var(--fs-mono) var(--mono-font); }
.wn-ver { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); }
.wn-ver.old { color: var(--faint); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--faint) 60%, transparent);
              animation: wn-aside .3s ease-out .2s both; }
.wn-arrow { color: var(--faint); animation: wn-fade .2s ease-out .3s both; }
.wn-ver.new { color: #1A1400; background: #E0B420; border-color: #E0B420; animation: wn-pop .35s cubic-bezier(.2, .9, .3, 1.4) .35s both; }
.wn-spark { position: absolute; right: 0; top: 50%; width: 5px; height: 5px; margin: -2.5px -2.5px 0 0; border-radius: 50%; background: #F2CF5B; opacity: 0;
            animation: wn-spark .6s ease-out .55s both; }
.wn-spark:nth-of-type(1) { --x: 18px; --y: -16px; }
.wn-spark:nth-of-type(2) { --x: 24px; --y: 6px; animation-delay: .6s; }
.wn-spark:nth-of-type(3) { --x: 4px; --y: -22px; animation-delay: .63s; background: var(--moss); }
.wn-spark:nth-of-type(4) { --x: 10px; --y: 20px; animation-delay: .66s; background: var(--blue-light); }
.wn-hero h3 { font-size: var(--fs-head); letter-spacing: -.01em; }
.wn-hero p { color: var(--muted); font-size: var(--fs); margin-top: 3px; }
.wn-body { overflow-y: auto; padding: 8px 22px 6px; display: grid; gap: 4px; }
.wn-group { padding: 12px 0 8px; }
.wn-group + .wn-group { border-top: 1px solid var(--line); }
.wn-group h4 { display: flex; align-items: center; gap: 8px; font-size: var(--fs-small); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.wn-group h4 i { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-style: normal; }
.wn-group h4 svg { width: 14px; height: 14px; fill: currentColor; }
.wn-group.wn-new h4 i { color: #E0B420; background: color-mix(in srgb, #E0B420 16%, transparent); }
.wn-group.wn-fix h4 i { color: var(--moss); background: color-mix(in srgb, var(--moss) 16%, transparent); }
.wn-group.wn-better h4 i { color: var(--blue-light); background: color-mix(in srgb, var(--blue) 18%, transparent); }
.wn-group.wn-security h4 i { color: var(--red-text); background: color-mix(in srgb, var(--red) 16%, transparent); }
.wn-group.wn-other h4 i { color: var(--muted); background: var(--row-hover); }
.wn-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.wn-group li { position: relative; padding-left: 30px; margin: 0; line-height: 1.45; animation: wn-line .2s ease-out both; animation-delay: calc(var(--i) * 15ms); }
.wn-group li::before { content: ""; position: absolute; left: 10px; top: .62em; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.wn-group code { font: var(--fs-small) var(--mono-font); padding: 1px 5px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); }
.wn-foot { display: flex; align-items: center; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); }
.wn-foot .more { margin-right: auto; background: none; border: 0; padding: 0; color: var(--blue-light); font: inherit; cursor: pointer; }
.wn-foot .more:hover { text-decoration: underline; }
@keyframes wn-in { from { transform: translateY(8px) scale(.98); opacity: 0; } }
@keyframes wn-run { from { transform: translateX(-60px) skewX(-8deg); opacity: 0; } 70% { transform: translateX(4px) skewX(4deg); opacity: 1; } }
@keyframes wn-speed { from { transform: translateX(10px); opacity: 0; } }
@keyframes wn-aside { to { opacity: .7; transform: scale(.92); } }
@keyframes wn-fade { from { opacity: 0; transform: translateX(-4px); } }
@keyframes wn-pop { from { transform: scale(0); opacity: 0; } }
@keyframes wn-spark { 0% { opacity: 0; transform: translate(0, 0) scale(.4); } 30% { opacity: 1; } to { opacity: 0; transform: translate(var(--x), var(--y)) scale(1); } }
@keyframes wn-line { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) { .wn-dialog, .wn-dialog * { animation: none !important; } .wn-spark { display: none; } }
/* The import strip, a thin bar across the bottom of the lists, and its review window. */
.impstrip { display: flex; align-items: center; gap: 10px; flex: none; height: 24px; padding: 0 6px 0 20px;
            border-top: 1px solid color-mix(in srgb, var(--sun) 30%, var(--line)); background: color-mix(in srgb, var(--sun) 6%, var(--panel)); animation: rise .2s ease-out; }
.impstrip .is-text { flex: 1; min-width: 0; color: var(--muted); font-size: var(--fs-small); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.impstrip .is-text b { color: var(--text); font-weight: 600; }
.impstrip .btn.sm { height: 18px; padding: 0 8px; font-size: var(--fs-small); border-radius: 4px; }
.impstrip .is-x { border: 0; background: none; color: var(--faint); font-size: var(--fs); line-height: 1; width: 18px; height: 18px; border-radius: 4px; cursor: pointer; }
.impstrip .is-x:hover { color: var(--text); background: var(--raised); }
/* Three yellow containers on a crane line. Once every 20 s they sway for a
   moment (`sway` in the script), and have no animation in between: an
   animation inside an SVG repaints the whole drawing every frame it runs,
   even where its keyframes stand still (an endless one cost ~15% of a core). */
.is-art { width: 18px; height: 18px; flex: none; overflow: visible; }
.is-art .load { transform-origin: 9px 0; }
body.sway .is-art .load { animation: sway 1.2s ease-in-out; }
.is-art.big { width: 40px; height: 40px; margin-right: 2px; }
@keyframes sway { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(7deg); } 50% { transform: rotate(-5deg); } 75% { transform: rotate(2deg); } }
@keyframes bob { 50% { transform: translateY(-3px); } }
.imp-dialog { width: min(860px, calc(100vw - 32px)); height: min(460px, calc(100vh - 48px)); grid-template-rows: auto minmax(0, 1fr) auto auto; }
/* Columns, as in Finder: the kinds on the left, the chosen kind's items on the right. */
.imp-cols { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; }
.imp-kinds { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 2px; min-width: 0; padding: 6px; border-right: 1px solid var(--line); }

.imp-kind .pick { display: flex; align-items: center; gap: 11px; align-self: stretch; min-width: 0; overflow: hidden; white-space: nowrap; }
.imp-kind input { width: 16px; height: 16px; margin: 0 0 0 2px; transform: scale(1.2); }
.imp-kind:hover { background: var(--raised); }
.imp-kind[aria-selected=true] { background: var(--blue); color: #fff; }
.imp-kind[aria-selected=true] input:not(:checked) { outline: 1.5px solid rgba(255, 255, 255, .85); outline-offset: -1px; border-radius: 4px; }
.imp-kind .n { color: var(--muted); font-size: var(--fs-small); font-variant-numeric: tabular-nums; white-space: nowrap; }
.imp-kind[aria-selected=true] .n, .imp-kind[aria-selected=true] .chev { color: rgba(255, 255, 255, .8); }
.imp-kind .chev { color: var(--faint); font-size: var(--fs); }
.imp-items { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.imp-items .ihead { padding: 8px 12px 6px; border-bottom: 1px solid var(--line); }
.imp-items .list { overflow: auto; padding: 4px 6px; }
